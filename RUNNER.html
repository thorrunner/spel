<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      font-family: 'Courier New', monospace;
      color: #eee;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    canvas {
      border: 2px solid #e94560;
      border-radius: 4px;
      display: block;
      max-width: 100vw;
      max-height: 80dvh;
    }
    #ui {
      width: 800px;
      max-width: 100vw;
      display: flex;
      justify-content: space-between;
      padding: 8px 4px;
      font-size: 14px;
      color: #aaa;
    }
    #score-display { color: #e94560; font-weight: bold; font-size: 16px; }
    #hi-display { color: #f5a623; }
    #coin-display { color: #ffe066; font-weight: bold; font-size: 16px; }
    #lives-display { color: #ff6b8a; font-weight: bold; font-size: 16px; letter-spacing: 3px; }
    #level-display  { color: #7ee8fa; font-weight: bold; font-size: 16px; }
    #diamond-display { color: #40c9a2; font-weight: bold; font-size: 16px; }
    @media (max-width: 820px) {
      #ui { font-size: 11px; padding: 4px 2px; }
      #score-display, #coin-display, #lives-display, #level-display, #diamond-display { font-size: 12px; }
      #hi-display { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <span id="score-display">SCORE: 0</span>
    <span id="coin-display">&#9679; 0</span>
    <span id="diamond-display">&#9670; 0</span>
    <span id="lives-display">&#9829;&#9829;&#9829;</span>
    <span id="level-display">LVL 1</span>
    <span id="hi-display">BEST: 0</span>
  </div>
  <canvas id="canvas" width="800" height="300"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score-display');
    const hiEl    = document.getElementById('hi-display');
    const coinEl  = document.getElementById('coin-display');
    const livesEl = document.getElementById('lives-display');
    const levelEl = document.getElementById('level-display');
    const diamondEl = document.getElementById('diamond-display');

    const W = canvas.width;
    const H = canvas.height;

    // ---- Responsive canvas scaling ----
    function resizeCanvas() {
      const maxW = window.innerWidth;
      const maxH = window.innerHeight * 0.82;
      const scale = Math.min(maxW / W, maxH / H);
      canvas.style.width = Math.floor(W * scale) + 'px';
      canvas.style.height = Math.floor(H * scale) + 'px';
      // Also resize the UI bar to match
      const ui = document.getElementById('ui');
      ui.style.width = Math.floor(W * scale) + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const GROUND = H - 60;       // player.y when standing (top of player)
    const PLAYER_H = 40;
    const SLIDE_H  = 18;
    const FLOOR = GROUND + PLAYER_H; // bottom of player / ground surface = 280

    // ---- Level themes (sky, buildings, ground colours + building layout [x,w,h]) ----
    const LEVEL_THEMES = [
      { sky: '#0f0e17', bldCol: '#16213e', ground: '#e94560', gFill: '#2a0a14', gTile: '#c73352',
        blds: [[0,60,120],[55,40,100],[90,50,140],[135,35,110],[165,45,130],[205,30,115],
               [230,55,145],[280,40,105],[315,50,125],[360,35,100],[390,45,135],
               [430,60,120],[485,40,110],[520,50,140],[565,35,115],[595,45,130],
               [635,55,120],[685,40,105],[720,50,145],[765,40,125]] },
      { sky: '#04100d', bldCol: '#0a2018', ground: '#00cec9', gFill: '#001a17', gTile: '#007a76',
        blds: [[0,80,88],[84,15,132],[103,62,80],[168,88,98],[260,18,142],[283,74,86],
               [362,82,104],[448,18,128],[470,76,94],[550,88,110],[643,18,140],[666,64,92],
               [735,58,105],[796,40,88]] },
      { sky: '#0f0600', bldCol: '#2b1200', ground: '#e67e22', gFill: '#1a0800', gTile: '#b35900',
        blds: [[0,26,72],[30,22,88],[56,30,62],[90,22,82],[115,26,74],[143,32,94],
               [179,22,68],[204,26,78],[234,30,98],[268,22,72],[295,26,88],[329,30,62],
               [363,22,82],[389,26,68],[419,30,92],[453,22,78],[479,26,72],[509,30,88],
               [543,22,68],[569,26,82],[599,30,98],[633,22,74],[659,26,88],[689,30,62],
               [723,22,78],[749,30,93],[783,26,68]] },
      { sky: '#04000f', bldCol: '#120028', ground: '#a855f7', gFill: '#0e0018', gTile: '#7e22ce',
        blds: [[0,14,185],[20,10,130],[36,12,200],[54,14,155],[74,9,215],[89,16,120],
               [111,11,180],[128,9,145],[144,13,205],[163,14,165],[183,10,135],[199,12,195],
               [217,14,160],[237,9,220],[252,15,125],[273,11,175],[290,9,140],[306,13,200],
               [325,14,170],[345,10,130],[361,12,190],[379,14,155],[399,9,215],[414,16,120],
               [436,11,180],[453,9,145],[469,13,205],[488,14,165],[508,10,135],[524,12,195],
               [542,14,160],[562,9,220],[577,15,125],[598,11,175],[615,9,140],[631,13,200],
               [650,14,170],[670,10,130],[686,12,190],[704,14,155],[724,9,215],[739,16,120],
               [761,11,180],[778,9,145]] },
      // Level 5 — Frozen tundra (icy blues)
      { sky: '#0a1628', bldCol: '#1a3050', ground: '#5bc0eb', gFill: '#081220', gTile: '#3a8fbf',
        blds: [[0,70,95],[75,50,130],[130,80,80],[215,45,145],[265,65,100],[335,55,120],
               [395,75,90],[475,40,140],[520,60,105],[585,70,115],[660,50,135],[715,65,95],
               [785,45,110]] },
      // Level 6 — Volcanic (deep reds and magma orange)
      { sky: '#1a0505', bldCol: '#3d0c0c', ground: '#ff6347', gFill: '#120303', gTile: '#cc3a2a',
        blds: [[0,30,160],[35,25,110],[65,35,180],[105,20,130],[130,40,200],[175,25,150],
               [205,30,170],[240,35,120],[280,20,190],[305,40,140],[350,25,165],[380,35,115],
               [420,20,185],[445,30,145],[480,35,175],[520,25,125],[550,30,195],[585,40,135],
               [630,20,160],[655,35,150],[695,25,180],[725,30,120],[760,35,170]] },
      // Level 7 — Deep ocean (teals and navy)
      { sky: '#020c15', bldCol: '#0a2540', ground: '#20b2aa', gFill: '#010810', gTile: '#168a84',
        blds: [[0,90,75],[95,30,150],[130,70,90],[205,40,160],[250,85,70],[340,35,140],
               [380,75,85],[460,30,155],[495,65,95],[565,90,80],[660,35,145],[700,70,90],
               [775,40,130]] },
      // Level 8 — Neon city (pink and cyan)
      { sky: '#0d0221', bldCol: '#1a0a3e', ground: '#f72585', gFill: '#09011a', gTile: '#b5179e',
        blds: [[0,22,200],[26,18,140],[48,24,210],[76,16,160],[96,28,190],[128,14,220],
               [146,22,150],[172,18,180],[194,26,205],[224,14,135],[242,22,195],[268,18,165],
               [290,26,215],[320,14,145],[338,22,185],[364,18,155],[386,26,200],[416,14,170],
               [434,22,210],[460,18,140],[482,26,190],[512,14,160],[530,22,205],[556,18,175],
               [578,26,215],[608,14,145],[626,22,185],[652,18,155],[674,26,200],[704,14,170],
               [722,22,210],[748,18,140],[770,26,190]] },
    ];
    function getTheme() { return LEVEL_THEMES[Math.min(level - 1, LEVEL_THEMES.length - 1)]; }

    // ---- Palette ----
    const COL = {
      sky:      '#0f0e17',
      ground:   '#e94560',
      player:   '#a8dadc',
      obstacle: '#f5a623',
      particle: '#e94560',
      text:     '#ffffff',
      dim:      '#444466',
    };

    // ---- State ----
    let state = 'start'; // 'start' | 'shop' | 'running' | 'levelup' | 'boss' | 'victory' | 'dead'
    let score = 0;
    let hiScore = 0;
    let speed = 0;
    let frame = 0;
    let particles = [];
    let stars = [];
    let lives = 3;
    let invincible = 0;    // countdown frames of hit-invincibility
    let totalCoins = 0;    // cumulative coins this run (for 1-up milestone)
    let nextLifeAt = 50;   // coin total at which next extra life is awarded
    let level = 1;
    let levelUpTimer = 0;  // counts down during level transition
    let nextLevelScore = 5000;
    let floatingTexts = [];
    let comboWorth = 0;    // accumulated coin value in current combo window
    let comboTimer = 0;    // frames remaining before combo resets
    let comboText  = null; // reference to the active combo FloatText object

    // ---- Boss ----
    const BOSS_MAX_HP = 20;
    let boss = null;
    let victoryTimer = 0;
    function initBoss() {
      boss = {
        x: W - 100, y: GROUND - 60,
        w: 64, h: 80,
        hp: BOSS_MAX_HP,
        phase: 0,          // attack phase timer
        hurtTimer: 0,      // flash when hit
        bobPhase: 0,       // floating animation
        attackCooldown: 0,  // frames until next attack
        defeated: false,
        deathTimer: 0,
      };
    }

    // ---- Player ----
    const player = {
      x: 100,
      y: GROUND,
      w: 32,
      h: PLAYER_H,
      vy: 0,
      onGround: true,
      jumpsLeft: 2,
      lean: 0,
      legPhase: 0,
      sliding: false,
      slideTimer: 0,
      diving: false,
    };

    // ---- Obstacles ----
    let obstacles = [];
    let nextObstacle = 80;

    // ---- Coins ----
    let coins = [];
    let coinCount = 0;
    let nextCoin = 50;

    // ---- Diamonds ----
    let diamonds = [];
    let diamondCount = 0;
    let levelStartScore = 0;
    let levelDiamondsSpawned = 0;

    // ---- Shop / persistent upgrades ----
    let totalDiamonds = parseInt(localStorage.getItem('runner_totalDiamonds') || '0');
    let upgrades = JSON.parse(localStorage.getItem('runner_upgrades') || '{}');
    let shopSelection = 0;
    let shopReturnState = 'start';

    // Skins
    let activeSkin = localStorage.getItem('runner_activeSkin') || 'default';
    let ownedSkins = JSON.parse(localStorage.getItem('runner_ownedSkins') || '["default"]');

    const SKINS = {
      default: { body: '#a8dadc', visor: '#57b8e8', visorBg: '#1a1a2e', legs: '#7bbfbf', jump: '#a8dadc' },
      fire:    { body: '#ff6b35', visor: '#ffdd44', visorBg: '#3a0808', legs: '#cc4422', jump: '#ff6b35' },
      neon:    { body: '#39ff14', visor: '#ff00ff', visorBg: '#0a002e', legs: '#00cc44', jump: '#39ff14' },
      ghost:   { body: '#b8c6db', visor: '#e0e8ff', visorBg: '#2a2a4a', legs: '#8898b0', jump: '#c0d0e8', ghost: true },
      robot:   { body: '#8a8a8a', visor: '#ff2020', visorBg: '#222222', legs: '#666666', jump: '#aaaaaa', robot: true },
      ninja:   { body: '#2a2a2a', visor: '#cc0000', visorBg: '#111111', legs: '#1a1a1a', jump: '#444444', ninja: true, scarfColor: '#cc0000' },
      frost:   { body: '#b0e0ff', visor: '#ffffff', visorBg: '#1a3050', legs: '#80b8d8', jump: '#d0f0ff', frost: true },
      royal:   { body: '#8b1a8b', visor: '#ffd700', visorBg: '#2a0a2a', legs: '#6b0a6b', jump: '#c040c0', royal: true, capeColor: '#c020c0', crownColor: '#ffd700' },
    };
    function getSkin() { return SKINS[activeSkin] || SKINS.default; }

    const SHOP_ITEMS = [
      { key: 'tripleJump',    name: 'TRIPLE JUMP',    desc: '3 jumps instead of 2',            cost: 3, color: '#a8dadc' },
      { key: 'extraHeart',    name: 'EXTRA HEART',    desc: 'Start with 4 lives',              cost: 2, color: '#ff6b8a' },
      { key: 'longSlide',     name: 'LONG SLIDE',     desc: 'Longer slide, cancel by jumping',  cost: 2, color: '#f5a623' },
      { key: 'coinMagnet',    name: 'COIN MAGNET',    desc: 'Pull nearby coins toward you',     cost: 3, color: '#ffe066' },
      { key: 'diamondMagnet', name: 'GEM MAGNET',     desc: 'Pull nearby diamonds toward you',  cost: 2, color: '#40c9a2' },
      { key: 'dive',           name: 'DIVE',            desc: 'Press DOWN while airborne',        cost: 3, color: '#7ee8fa' },
      { key: 'trail',         name: 'TRAIL EFFECT',   desc: 'Colorful particle trail',          cost: 2, color: '#e94560' },
      { key: 'fire',          name: 'FIRE SKIN',      desc: 'Red & orange look',                cost: 2, color: '#ff6b35', type: 'skin' },
      { key: 'neon',          name: 'NEON SKIN',      desc: 'Green & pink neon look',           cost: 2, color: '#39ff14', type: 'skin' },
      { key: 'ghost',         name: 'GHOST SKIN',     desc: 'Transparent phantom, floats',      cost: 3, color: '#b8c6db', type: 'skin' },
      { key: 'robot',         name: 'ROBOT SKIN',     desc: 'Antenna, bolts & mech legs',       cost: 3, color: '#8a8a8a', type: 'skin' },
      { key: 'ninja',         name: 'NINJA SKIN',     desc: 'Slit visor & trailing scarf',      cost: 4, color: '#cc0000', type: 'skin' },
      { key: 'frost',         name: 'FROST SKIN',     desc: 'Ice spikes & sparkle aura',        cost: 4, color: '#b0e0ff', type: 'skin' },
      { key: 'royal',         name: 'ROYAL SKIN',     desc: 'Crown & flowing cape',             cost: 5, color: '#ffd700', type: 'skin' },
    ];

    function saveDiamonds() { localStorage.setItem('runner_totalDiamonds', totalDiamonds); }
    function saveUpgrades() { localStorage.setItem('runner_upgrades', JSON.stringify(upgrades)); }
    function saveActiveSkin() { localStorage.setItem('runner_activeSkin', activeSkin); }
    function saveOwnedSkins() { localStorage.setItem('runner_ownedSkins', JSON.stringify(ownedSkins)); }

    // ---- Stars (background) ----
    function initStars() {
      stars = [];
      for (let i = 0; i < 60; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * GROUND * 0.8, r: Math.random() * 1.5 + 0.3, s: Math.random() * 0.3 + 0.1 });
      }
    }

    // ---- Ambient background particles (per-level atmosphere) ----
    let ambientParts = [];
    function initAmbient() {
      ambientParts = [];
      const lv = Math.min(level, LEVEL_THEMES.length);
      const count = [0, 25, 20, 0, 35, 30, 40, 50][lv - 1] || 0;
      for (let i = 0; i < count; i++) {
        ambientParts.push(makeAmbientParticle(true));
      }
    }
    function makeAmbientParticle(randomX) {
      const lv = Math.min(level, LEVEL_THEMES.length);
      const p = { x: randomX ? Math.random() * W : W + Math.random() * 40,
                  y: Math.random() * GROUND, r: 0, vx: 0, vy: 0, phase: Math.random() * Math.PI * 2 };
      if (lv === 2) { // Fireflies
        p.r = Math.random() * 2 + 1; p.vx = -0.3 - Math.random() * 0.5;
        p.vy = Math.sin(p.phase) * 0.3;
      } else if (lv === 4) { // Energy motes
        p.r = Math.random() * 1.5 + 0.5; p.vx = -0.2 - Math.random() * 0.3;
        p.vy = -0.5 - Math.random() * 0.8; p.y = GROUND - Math.random() * 60;
      } else if (lv === 5) { // Snowflakes
        p.r = Math.random() * 2.5 + 1; p.vx = -0.5 - Math.random() * 1;
        p.vy = 0.8 + Math.random() * 1.2; p.y = randomX ? Math.random() * H : -5;
      } else if (lv === 6) { // Embers
        p.r = Math.random() * 2 + 0.5; p.vx = -0.3 + (Math.random() - 0.5) * 0.6;
        p.vy = -1 - Math.random() * 1.5; p.y = FLOOR - Math.random() * 30;
      } else if (lv === 7) { // Bubbles
        p.r = Math.random() * 3 + 1; p.vx = (Math.random() - 0.5) * 0.4;
        p.vy = -0.4 - Math.random() * 0.8; p.y = randomX ? Math.random() * GROUND : GROUND;
      } else if (lv === 8) { // Rain
        p.r = 1; p.vx = -2; p.vy = 6 + Math.random() * 3;
        p.y = randomX ? Math.random() * H : -5;
      }
      return p;
    }
    function updateAmbient() {
      for (let i = ambientParts.length - 1; i >= 0; i--) {
        const p = ambientParts[i];
        const lv = Math.min(level, LEVEL_THEMES.length);
        p.x += p.vx; p.y += p.vy; p.phase += 0.03;
        // Wobble for fireflies and snowflakes
        if (lv === 2) p.vy = Math.sin(p.phase) * 0.4;
        if (lv === 5) p.vx += Math.sin(p.phase) * 0.02;
        // Recycle off-screen particles
        if (p.x < -10 || p.y < -10 || p.y > H + 10) {
          const vertical = (lv === 5 || lv === 6 || lv === 7 || lv === 8);
          ambientParts[i] = makeAmbientParticle(vertical);
          if (lv === 5) ambientParts[i].y = -5;                     // snow falls from top
          if (lv === 6) ambientParts[i].y = FLOOR - Math.random() * 20; // embers rise from ground
          if (lv === 7) ambientParts[i].y = GROUND;                 // bubbles rise from ground
          if (lv === 8) ambientParts[i].y = -5;                     // rain falls from top
        }
      }
    }

    // ---- Particles ----
    function spawnParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 2,
          life: 1,
          decay: Math.random() * 0.03 + 0.02,
          r: Math.random() * 5 + 2,
          color,
        });
      }
    }

    function spawnDustParticle() {
      particles.push({
        x: player.x + player.w / 2,
        y: FLOOR,
        vx: -speed * 0.3 + (Math.random() - 0.5) * 1,
        vy: -Math.random() * 1.5,
        life: 1,
        decay: 0.06,
        r: Math.random() * 3 + 1,
        color: COL.ground,
      });
    }

    // ---- Floating texts ----
    function spawnFloatText(x, y, text, color) {
      const ft = { x, y, text, color, life: 1, vy: -1.8, scale: 1.4 };
      floatingTexts.push(ft);
      return ft;
    }

    function addCoinCombo(worth, x, y) {
      comboWorth += worth;
      comboTimer = 48; // window to keep combo alive
      if (comboText && floatingTexts.includes(comboText)) {
        // Update existing text and pop the scale
        comboText.text  = '+' + comboWorth;
        comboText.scale = 1.6;
        comboText.life  = Math.max(comboText.life, 0.85); // refresh fade
      } else {
        comboText = spawnFloatText(x, y - 20, '+' + comboWorth, '#ffe066');
      }
    }

    // ---- Reset ----
    function reset() {
      score = 0;
      speed = 5;
      frame = 0;
      obstacles = [];
      nextObstacle = 80;
      coins = [];
      coinCount = 0;
      nextCoin = 50;
      diamonds = [];
      diamondCount = 0;
      levelStartScore = 0;
      levelDiamondsSpawned = 0;
      particles = [];
      lives = upgrades.extraHeart ? 4 : 3;
      invincible = 0;
      totalCoins = 0;
      nextLifeAt = 50;
      level = 1;
      levelUpTimer = 0;
      nextLevelScore = 5000;
      boss = null;
      victoryTimer = 0;
      initAmbient();
      floatingTexts = [];
      comboWorth = 0;
      comboTimer = 0;
      comboText  = null;
      player.y = GROUND;
      player.h = PLAYER_H;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = upgrades.tripleJump ? 3 : 2;
      player.lean = 0;
      player.legPhase = 0;
      player.sliding = false;
      player.slideTimer = 0;
      player.diving = false;
    }

    // ---- Jump ----
    function jump() {
      if (state === 'shop') return;
      if (state === 'start' || state === 'victory') { state = 'running'; reset(); return; }
      if (state === 'dead') { state = 'running'; reset(); return; }
      if (player.sliding) {
        endSlide();
        if (!upgrades.longSlide) return; // without upgrade: cancel only, no jump
        // with long slide upgrade: cancel slide AND jump
      }
      if (player.jumpsLeft > 0) {
        player.vy = -13;
        player.jumpsLeft--;
        spawnParticles(player.x + player.w / 2, player.y + player.h, getSkin().jump, 6);
      }
    }

    // ---- Slide ----
    function startSlide() {
      if (!player.onGround || player.sliding) return;
      player.sliding = true;
      player.slideTimer = upgrades.longSlide ? 60 : 38;
      player.h = SLIDE_H;
      player.y = GROUND + (PLAYER_H - SLIDE_H); // keep feet on ground
    }

    function endSlide() {
      if (!player.sliding) return;
      player.sliding = false;
      player.slideTimer = 0;
      player.h = PLAYER_H;
      player.y = GROUND;
    }

    // ---- Dive ----
    function dive() {
      if ((state !== 'running' && state !== 'boss') || !upgrades.dive) return;
      if (player.onGround || player.sliding || player.diving) return;
      player.diving = true;
      player.vy = 14;
      spawnParticles(player.x + player.w / 2, player.y, getSkin().jump, 8);
    }

    // ---- Touch detection ----
    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

    // ---- Shop purchase logic (shared by keyboard & touch) ----
    function shopPurchase(idx) {
      if (idx === undefined) idx = shopSelection;
      const item = SHOP_ITEMS[idx];
      if (item.type === 'skin') {
        if (ownedSkins.includes(item.key)) {
          activeSkin = item.key;
          saveActiveSkin();
        } else if (totalDiamonds >= item.cost) {
          totalDiamonds -= item.cost;
          ownedSkins.push(item.key);
          activeSkin = item.key;
          saveDiamonds();
          saveOwnedSkins();
          saveActiveSkin();
        }
      } else {
        if (!upgrades[item.key] && totalDiamonds >= item.cost) {
          totalDiamonds -= item.cost;
          upgrades[item.key] = true;
          saveDiamonds();
          saveUpgrades();
        }
      }
    }

    // ---- Input (keyboard) ----
    document.addEventListener('keydown', e => {
      // Open shop from start or dead screen
      if ((state === 'start' || state === 'dead') && e.code === 'KeyS') {
        e.preventDefault(); shopReturnState = state; state = 'shop'; shopSelection = 0; return;
      }
      // Shop navigation
      if (state === 'shop') {
        e.preventDefault();
        if (e.code === 'ArrowUp') shopSelection = (shopSelection + SHOP_ITEMS.length - 1) % SHOP_ITEMS.length;
        if (e.code === 'ArrowDown') shopSelection = (shopSelection + 1) % SHOP_ITEMS.length;
        if (e.code === 'Space' || e.code === 'Enter') shopPurchase();
        if (e.code === 'Escape' || e.code === 'KeyS') state = shopReturnState;
        return;
      }
      if (e.code === 'ArrowUp')    { e.preventDefault(); jump(); }
      if (e.code === 'ArrowDown')  { e.preventDefault(); if (!player.onGround && !player.sliding) dive(); else startSlide(); }
      if (e.code === 'Space') {
        e.preventDefault();
        if (state === 'start' || state === 'dead' || state === 'victory') jump();
      }
    });

    // ---- Input (touch / pointer gestures) ----
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0, touchId = null;

    // Convert page coordinates to canvas-internal coordinates (0..W, 0..H)
    function pageToCanvas(px, py) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (px - rect.left) / rect.width * W,
        y: (py - rect.top) / rect.height * H,
      };
    }

    // Shop hit-test: returns item index or -1
    function shopHitTest(cx, cy) {
      const visCount = 6;
      let scrollOff = Math.max(0, Math.min(shopSelection - 2, SHOP_ITEMS.length - visCount));
      if (scrollOff < 0) scrollOff = 0;
      for (let vi = 0; vi < visCount && scrollOff + vi < SHOP_ITEMS.length; vi++) {
        const idx = scrollOff + vi;
        const y = 80 + vi * 28;
        if (cx > W / 2 - 230 && cx < W / 2 + 230 && cy > y - 11 && cy < y + 13) {
          return idx;
        }
      }
      // Close button area (bottom of shop)
      if (cy > H - 30) return -2; // special: close
      return -1;
    }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      touchId = t.identifier;
      touchStartX = t.pageX;
      touchStartY = t.pageY;
      touchStartTime = performance.now();

      const cp = pageToCanvas(t.pageX, t.pageY);

      // Shop: handle taps on items
      if (state === 'shop') {
        const hit = shopHitTest(cp.x, cp.y);
        if (hit === -2) {
          state = shopReturnState;
        } else if (hit >= 0) {
          shopSelection = hit;
          shopPurchase(hit);
        }
        return;
      }

      // Start/dead: check if tapping "SHOP" button area
      if (state === 'start' || state === 'dead') {
        const shopBtnY = state === 'start' ? H / 2 + 44 : H / 2 + 60;
        if (cp.y > shopBtnY - 18 && cp.y < shopBtnY + 10 &&
            cp.x > W / 2 - 80 && cp.x < W / 2 + 80) {
          shopReturnState = state;
          state = 'shop';
          shopSelection = 0;
          return;
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const t = Array.from(e.changedTouches).find(ct => ct.identifier === touchId);
      if (!t) return;

      // Shop: swipe up/down to scroll selection
      if (state === 'shop') {
        const dy = t.pageY - touchStartY;
        if (Math.abs(dy) > 30) {
          if (dy > 0) shopSelection = Math.max(0, shopSelection - 1);
          else shopSelection = Math.min(SHOP_ITEMS.length - 1, shopSelection + 1);
        }
        touchId = null;
        return;
      }

      const dx = t.pageX - touchStartX;
      const dy = t.pageY - touchStartY;
      const dt = performance.now() - touchStartTime;
      const dist = Math.sqrt(dx * dx + dy * dy);

      const SWIPE_THRESHOLD = 30;
      const SWIPE_TIME = 400;

      if (dist > SWIPE_THRESHOLD && dt < SWIPE_TIME) {
        // It's a swipe
        if (dy > 0 && Math.abs(dy) > Math.abs(dx)) {
          // Swipe down — dive if airborne, slide if grounded
          if (!player.onGround && !player.sliding) dive(); else startSlide();
        } else if (dy < 0 && Math.abs(dy) > Math.abs(dx)) {
          jump(); // swipe up
        }
      } else {
        // Tap = jump (or start/restart)
        jump();
      }

      touchId = null;
    }, { passive: false });

    // Mouse click fallback for non-touch devices (desktop with no keyboard)
    canvas.addEventListener('click', e => {
      if (isTouchDevice) return; // touch handled separately
      if (state === 'shop') return;
      jump();
    });

    // Prevent scrolling/zooming on the whole page for Safari
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    // Coordinate note:
    //   ob.y = bottom of obstacle, ob.y - ob.h = top.
    //   Player standing: top=GROUND(240), bottom=FLOOR(280).
    //   Player sliding:  top=GROUND+22(262), bottom=FLOOR(280).
    //   Slide-under bottom must be 246–261: hits standing/jumping, misses sliding.

    // Gap bottom — sliding player top + a little breathing room
    const SLIDE_CLEAR = GROUND + 20; // = 260; obstacle bottom must be <= this to let slide through

    // ---- Obstacle shapes ----
    // Weights per level: [short, tall, wide, pair, overhead, lowwall]
    const OBSTACLE_WEIGHTS = [
      [4, 2, 2, 1, 2, 1],   // level 1 — easy intro
      [2, 2, 2, 2, 3, 2],   // level 2 — balanced
      [1, 2, 2, 3, 3, 3],   // level 3 — harder mix
      [0, 1, 2, 3, 3, 4],   // level 4 — mostly hard
      [2, 3, 1, 2, 1, 3],   // level 5 — tall & low walls (tundra)
      [1, 1, 3, 4, 2, 1],   // level 6 — wide & pairs (volcanic)
      [2, 2, 2, 1, 4, 3],   // level 7 — overhead-heavy (ocean)
      [1, 2, 2, 3, 3, 3],   // level 8 — balanced hard (neon city)
    ];

    function weightedPick(weights) {
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++) {
        r -= weights[i];
        if (r <= 0) return i;
      }
      return weights.length - 1;
    }

    function makeObstacle() {
      const w = OBSTACLE_WEIGHTS[Math.min(level - 1, OBSTACLE_WEIGHTS.length - 1)];
      const kind = weightedPick(w);
      const s = Math.min(1 + (level - 1) * 0.10, 1.5); // size scale, capped at 1.5×
      const sw = n => Math.round(n * s);
      if (kind === 0) return { x: W + 20, y: FLOOR,       w: sw(28), h: sw(30), type: 'ground' };
      if (kind === 1) return { x: W + 20, y: FLOOR,       w: sw(20), h: sw(54), type: 'ground' };
      if (kind === 2) return { x: W + 20, y: FLOOR,       w: sw(64), h: sw(24), type: 'ground' };
      if (kind === 3) return { x: W + 20, y: FLOOR,       w: sw(52), h: sw(42), type: 'ground', pair: true };
      if (kind === 4) return { x: W + 20, y: SLIDE_CLEAR, w: sw(72), h: 52,    type: 'overhead' };
               return { x: W + 20, y: SLIDE_CLEAR, w: sw(34), h: SLIDE_CLEAR,  type: 'lowwall' };
    }

    // ---- Coin spawn patterns ----
    // Coin heights:
    //   FLOOR-18 (=262) — ground level, collect while running
    //   GROUND-30 (=210) — low jump
    //   GROUND-80 (=160) — high / double jump
    //   FLOOR-10 (=270) — slide zone, reward for sliding
    function spawnCoinGroup() {
      const kind = Math.floor(Math.random() * 6);
      const sx = W + 20;
      if (kind === 0) {
        // Row of 4 at ground level — run right through
        for (let i = 0; i < 4; i++)
          coins.push({ x: sx + i * 28, y: FLOOR - 18, r: 8, phase: i * 0.4 });
      } else if (kind === 1) {
        // Arc over an imaginary obstacle — must jump
        for (let i = 0; i < 6; i++) {
          const t = i / 5;
          coins.push({ x: sx + i * 28, y: FLOOR - 18 - Math.sin(t * Math.PI) * 100, r: 8, phase: i * 0.3 });
        }
      } else if (kind === 2) {
        // Two rows stacked: ground + mid — jump to grab both
        for (let i = 0; i < 3; i++) {
          coins.push({ x: sx + i * 30, y: FLOOR - 18,  r: 8, phase: i * 0.5 });
          coins.push({ x: sx + i * 30, y: GROUND - 30, r: 8, phase: i * 0.5 + 1 });
        }
      } else if (kind === 3) {
        // Diagonal rising line — jump to follow
        for (let i = 0; i < 5; i++)
          coins.push({ x: sx + i * 30, y: FLOOR - 18 - i * 22, r: 8, phase: i * 0.4 });
      } else if (kind === 4) {
        // Single big-value coin up high — double jump
        coins.push({ x: sx + 10, y: GROUND - 80, r: 11, phase: 0, big: true });
      } else {
        // Coin bag — 10 coins, floats at mid height
        coins.push({ x: sx + 10, y: GROUND - 40, r: 13, phase: 0, bag: true });
      }
    }

    // ---- AABB collision ----
    function collides(a, b) {
      const pad = 6;
      return (
        a.x + pad < b.x + b.w &&
        a.x + a.w - pad > b.x &&
        a.y + pad < b.y + b.h &&
        a.y + a.h - pad > b.y
      );
    }

    // ---- Draw helpers ----
    function roundRect(x, y, w, h, r = 4) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawPlayer() {
      const px = player.x;
      const py = player.y;
      const pw = player.w;
      const ph = player.h;
      const sliding = player.sliding;
      const skin = getSkin();

      ctx.save();
      // Anchor at bottom of player (moves up when jumping)
      ctx.translate(px + pw / 2, py + ph);

      // Ghost: pulsing transparency
      if (skin.ghost) {
        ctx.globalAlpha = 0.5 + Math.sin(frame * 0.08) * 0.2;
      }

      if (sliding) {
        // Sliding: wide flat body
        const sw = pw + 14, sh = SLIDE_H;
        // Shadow
        ctx.fillStyle = skin.ghost ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 2, sw * 0.6, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Royal cape (dragging behind while sliding)
        if (skin.royal) {
          const cw = Math.sin(frame * 0.08) * 3;
          ctx.fillStyle = skin.capeColor;
          ctx.beginPath();
          ctx.moveTo(-sw / 2, -sh + 2);
          ctx.quadraticCurveTo(-sw / 2 - 10, -sh - 2 + cw, -sw / 2 - 16, -sh + 4 + cw);
          ctx.lineTo(-sw / 2 - 12, 0);
          ctx.lineTo(-sw / 2, -2);
          ctx.closePath();
          ctx.fill();
        }

        // Body (flat)
        ctx.fillStyle = skin.body;
        roundRect(-sw / 2, -sh, sw, sh - 4, skin.robot ? 2 : 5);
        ctx.fill();

        // Frost: small spikes on sliding body
        if (skin.frost) {
          ctx.fillStyle = '#d0f0ff';
          for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 10 - 3, -sh);
            ctx.lineTo(i * 10, -sh - 6);
            ctx.lineTo(i * 10 + 3, -sh);
            ctx.closePath();
            ctx.fill();
          }
        }

        // Robot panel line on slide body
        if (skin.robot) {
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-sw / 2 + 4, -sh / 2);
          ctx.lineTo(sw / 2 - 14, -sh / 2);
          ctx.stroke();
        }

        // Visor (side-facing)
        ctx.fillStyle = skin.visorBg;
        roundRect(sw / 2 - 12, -sh + 3, 10, sh - 10, 3);
        ctx.fill();
        ctx.fillStyle = skin.visor;
        if (skin.ninja) {
          roundRect(sw / 2 - 11, -sh + 6, 8, sh - 18, 1);
        } else {
          roundRect(sw / 2 - 11, -sh + 5, 8, sh - 14, 2);
        }
        ctx.fill();

        // Ninja scarf while sliding
        if (skin.ninja) {
          const w1 = Math.sin(frame * 0.12) * 5;
          const w2 = Math.sin(frame * 0.1 + 2) * 7;
          ctx.strokeStyle = skin.scarfColor;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-sw / 2 + 2, -sh + 4);
          ctx.quadraticCurveTo(-sw / 2 - 10, -sh + 2 + w1, -sw / 2 - 18, -sh + 6 + w2);
          ctx.stroke();
        }
      } else {
        const lean = player.onGround ? Math.sin(player.legPhase * 0.5) * 0.08 : -0.15;
        ctx.rotate(lean);

        // Shadow
        ctx.fillStyle = skin.ghost ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 2, skin.ghost ? pw * 0.4 : pw * 0.6, skin.ghost ? 3 : 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs (ghost floats - no legs)
        if (!skin.ghost) {
          ctx.strokeStyle = skin.legs;
          ctx.lineWidth = skin.robot ? 6 : 5;
          ctx.lineCap = skin.robot ? 'square' : 'round';
          if (player.onGround) {
            const lp = player.legPhase;
            if (skin.robot) {
              // Segmented robot legs with knee joints
              const lkx = -6 + Math.sin(lp) * 4, rky = -5;
              ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(lkx, rky); ctx.lineTo(-6 + Math.sin(lp) * 8, 0); ctx.stroke();
              const rkx = 6 - Math.sin(lp) * 4;
              ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(rkx, rky); ctx.lineTo(6 - Math.sin(lp) * 8, 0); ctx.stroke();
              // Knee bolts
              ctx.fillStyle = '#bbb';
              ctx.beginPath(); ctx.arc(lkx, rky, 2, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(rkx, rky, 2, 0, Math.PI * 2); ctx.fill();
            } else {
              ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(-6 + Math.sin(lp) * 8, 0); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(6 - Math.sin(lp) * 8, 0); ctx.stroke();
            }
          } else {
            if (skin.robot) {
              ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(-8, -3); ctx.lineTo(-10, 4); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(8, -3); ctx.lineTo(10, 4); ctx.stroke();
              ctx.fillStyle = '#bbb';
              ctx.beginPath(); ctx.arc(-8, -3, 2, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(8, -3, 2, 0, Math.PI * 2); ctx.fill();
            } else {
              ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(-10, 4); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(10, 4); ctx.stroke();
            }
          }
        }

        // Royal cape (behind body)
        if (skin.royal) {
          const capeWave = Math.sin(frame * 0.1 + player.legPhase * 0.3) * 4;
          const capeWave2 = Math.sin(frame * 0.07 + 1.5) * 3;
          ctx.fillStyle = skin.capeColor;
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 2, -ph + 14);
          ctx.quadraticCurveTo(-pw / 2 - 10 + capeWave2, -ph / 2, -pw / 2 - 8 + capeWave, -6);
          ctx.lineTo(-pw / 2 - 4 + capeWave * 0.5, -2);
          ctx.lineTo(-pw / 2 + 2, -12);
          ctx.closePath();
          ctx.fill();
          // Cape highlight
          ctx.fillStyle = 'rgba(255,255,255,0.1)';
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 2, -ph + 14);
          ctx.quadraticCurveTo(-pw / 2 - 4 + capeWave2 * 0.5, -ph / 2 + 4, -pw / 2 - 2 + capeWave * 0.5, -8);
          ctx.lineTo(-pw / 2 + 2, -12);
          ctx.closePath();
          ctx.fill();
        }

        // Body
        ctx.fillStyle = skin.body;
        roundRect(-pw / 2, -ph, pw, ph - 12, skin.robot ? 2 : 6);
        ctx.fill();

        // Ghost: ethereal glow around body
        if (skin.ghost) {
          ctx.shadowColor = '#c0d0e8';
          ctx.shadowBlur = 12 + Math.sin(frame * 0.06) * 4;
          ctx.fillStyle = 'rgba(184,198,219,0.15)';
          roundRect(-pw / 2 - 2, -ph - 2, pw + 4, ph - 8, 8);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Robot panel details
        if (skin.robot) {
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 1;
          // Horizontal panel line
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 3, -ph + 22);
          ctx.lineTo(pw / 2 - 3, -ph + 22);
          ctx.stroke();
          // Vertical center seam
          ctx.beginPath();
          ctx.moveTo(0, -ph + 22);
          ctx.lineTo(0, -14);
          ctx.stroke();
          // Corner bolts
          ctx.fillStyle = '#bbb';
          ctx.beginPath(); ctx.arc(-pw / 2 + 5, -ph + 4, 2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(pw / 2 - 5, -ph + 4, 2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(-pw / 2 + 5, -14, 2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(pw / 2 - 5, -14, 2, 0, Math.PI * 2); ctx.fill();
          // Power indicator
          ctx.fillStyle = '#00ff44';
          ctx.beginPath(); ctx.arc(0, -ph + 26, 2, 0, Math.PI * 2); ctx.fill();
        }

        // Frost: ice crystal spikes on shoulders
        if (skin.frost) {
          ctx.fillStyle = '#d0f0ff';
          ctx.strokeStyle = '#a0d4f0';
          ctx.lineWidth = 1;
          // Left shoulder spike cluster
          ctx.beginPath();
          ctx.moveTo(-pw / 2 - 5, -ph + 16);
          ctx.lineTo(-pw / 2, -ph + 2);
          ctx.lineTo(-pw / 2 + 4, -ph + 16);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-pw / 2 - 2, -ph + 16);
          ctx.lineTo(-pw / 2 - 4, -ph + 6);
          ctx.lineTo(-pw / 2 + 1, -ph + 16);
          ctx.closePath();
          ctx.fill();
          // Right shoulder spike cluster
          ctx.beginPath();
          ctx.moveTo(pw / 2 + 5, -ph + 16);
          ctx.lineTo(pw / 2, -ph + 2);
          ctx.lineTo(pw / 2 - 4, -ph + 16);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(pw / 2 + 2, -ph + 16);
          ctx.lineTo(pw / 2 + 4, -ph + 6);
          ctx.lineTo(pw / 2 - 1, -ph + 16);
          ctx.closePath();
          ctx.fill();
          // Frost glow
          ctx.shadowColor = '#80d0ff';
          ctx.shadowBlur = 8;
          ctx.fillStyle = 'rgba(176,224,255,0.08)';
          roundRect(-pw / 2 - 2, -ph - 2, pw + 4, ph - 8, 8);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Visor
        ctx.fillStyle = skin.visorBg;
        if (skin.ninja) {
          // Narrow slit visor
          roundRect(-pw / 2 + 4, -ph + 9, pw - 8, 6, 2);
          ctx.fill();
          ctx.fillStyle = skin.visor;
          roundRect(-pw / 2 + 6, -ph + 10, pw - 12, 4, 1);
          ctx.fill();
        } else {
          roundRect(-pw / 2 + 4, -ph + 6, pw - 8, 14, 4);
          ctx.fill();
          ctx.fillStyle = skin.visor;
          roundRect(-pw / 2 + 6, -ph + 8, pw - 12, 10, 3);
          ctx.fill();
        }

        // Robot: antenna with blinking light
        if (skin.robot) {
          ctx.strokeStyle = '#777';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, -ph);
          ctx.lineTo(2, -ph - 7);
          ctx.stroke();
          // Blinking light
          const blink = frame % 40 < 20;
          ctx.fillStyle = blink ? '#ff2020' : '#881010';
          ctx.shadowColor = blink ? '#ff2020' : 'transparent';
          ctx.shadowBlur = blink ? 6 : 0;
          ctx.beginPath();
          ctx.arc(2, -ph - 8, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Royal: crown
        if (skin.royal) {
          ctx.fillStyle = skin.crownColor;
          ctx.beginPath();
          ctx.moveTo(-9, -ph + 1);
          ctx.lineTo(-11, -ph - 7);
          ctx.lineTo(-5, -ph - 4);
          ctx.lineTo(0, -ph - 10);
          ctx.lineTo(5, -ph - 4);
          ctx.lineTo(11, -ph - 7);
          ctx.lineTo(9, -ph + 1);
          ctx.closePath();
          ctx.fill();
          // Crown base band
          ctx.fillStyle = '#daa520';
          roundRect(-9, -ph, 18, 3, 1);
          ctx.fill();
          // Crown gems
          ctx.fillStyle = '#ff3366';
          ctx.beginPath(); ctx.arc(0, -ph - 5, 2, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#3366ff';
          ctx.beginPath(); ctx.arc(-6, -ph - 3, 1.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(6, -ph - 3, 1.5, 0, Math.PI * 2); ctx.fill();
        }

        // Ninja: trailing scarf ribbons
        if (skin.ninja) {
          const w1 = Math.sin(frame * 0.12 + 1) * 5;
          const w2 = Math.sin(frame * 0.1 + 2.5) * 7;
          const w3 = Math.sin(frame * 0.09 + 4) * 4;
          ctx.strokeStyle = skin.scarfColor;
          ctx.lineWidth = 3.5;
          ctx.lineCap = 'round';
          // Upper ribbon
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 1, -ph + 10);
          ctx.quadraticCurveTo(-pw / 2 - 10, -ph + 12 + w1, -pw / 2 - 18 + w3, -ph + 15 + w2);
          ctx.stroke();
          // Lower ribbon
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 1, -ph + 13);
          ctx.quadraticCurveTo(-pw / 2 - 8, -ph + 18 + w2 * 0.6, -pw / 2 - 15 + w1, -ph + 22 + w3);
          ctx.stroke();
        }
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawObstacle(ob) {
      const top = ob.y - ob.h;
      const bot = ob.y;

      if (ob.type === 'ground') {
        if (ob.pair) {
          // Two spikes side by side
          const sw = 20, gap = 12;
          ctx.fillStyle = COL.obstacle;
          roundRect(ob.x,          FLOOR - 42, sw, 42, 3); ctx.fill();
          roundRect(ob.x + sw + gap, FLOOR - 32, sw, 32, 3); ctx.fill();
          ctx.shadowColor = COL.obstacle; ctx.shadowBlur = 8;
          ctx.fillStyle = 'rgba(245,166,35,0.35)';
          roundRect(ob.x,          FLOOR - 42, sw, 42, 3); ctx.fill();
          roundRect(ob.x + sw + gap, FLOOR - 32, sw, 32, 3); ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = COL.obstacle;
          roundRect(ob.x, top, ob.w, ob.h, 3); ctx.fill();
          ctx.shadowColor = COL.obstacle; ctx.shadowBlur = 8;
          ctx.fillStyle = 'rgba(245,166,35,0.4)';
          roundRect(ob.x, top, ob.w, ob.h, 3); ctx.fill();
          ctx.shadowBlur = 0;
        }

      } else if (ob.type === 'overhead') {
        // Hanging beam — slide under or jump over (if reaction is fast enough)
        const beamH = 14;
        ctx.fillStyle = '#c0392b';
        roundRect(ob.x, bot - beamH, ob.w, beamH, 3); ctx.fill();
        // Support rods
        ctx.fillStyle = '#7f1d1d';
        roundRect(ob.x + ob.w * 0.15, top, ob.w * 0.1, ob.h - beamH, 2); ctx.fill();
        roundRect(ob.x + ob.w * 0.75, top, ob.w * 0.1, ob.h - beamH, 2); ctx.fill();
        // Glow
        ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 10;
        ctx.fillStyle = 'rgba(231,76,60,0.35)';
        roundRect(ob.x, bot - beamH, ob.w, beamH, 3); ctx.fill();
        ctx.shadowBlur = 0;

      } else if (ob.type === 'lowwall') {
        // Solid wall from canvas top down to bot — MUST SLIDE, jumping goes INTO it
        // Wall body
        ctx.fillStyle = '#1a0a2e';
        roundRect(ob.x, 0, ob.w, bot, 3); ctx.fill();
        // Hazard stripes
        ctx.save();
        ctx.beginPath();
        roundRect(ob.x, 0, ob.w, bot, 3);
        ctx.clip();
        ctx.strokeStyle = '#9b1a2e';
        ctx.lineWidth = 7;
        for (let sy = -bot; sy < bot * 2; sy += 18) {
          ctx.beginPath();
          ctx.moveTo(ob.x, sy);
          ctx.lineTo(ob.x + ob.w, sy + ob.w);
          ctx.stroke();
        }
        ctx.restore();
        // Bright danger edge on the bottom (where gap starts)
        ctx.fillStyle = '#e94560';
        ctx.fillRect(ob.x, bot - 4, ob.w, 4);
        // Slide gap highlight — arrow pointing into gap
        ctx.fillStyle = 'rgba(168,218,220,0.5)';
        ctx.beginPath();
        ctx.moveTo(ob.x + ob.w + 8, bot - 10);
        ctx.lineTo(ob.x + ob.w + 8, FLOOR);
        ctx.lineTo(ob.x + ob.w + 18, (bot + FLOOR) / 2);
        ctx.closePath();
        ctx.fill();
        // Glow
        ctx.shadowColor = '#e94560'; ctx.shadowBlur = 12;
        ctx.fillStyle = 'rgba(233,69,96,0.2)';
        roundRect(ob.x, 0, ob.w, bot, 3); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function drawCoin(c) {
      const bob = Math.sin(frame * 0.07 + c.phase) * 3;
      const cy = c.y + bob;
      const r = c.r;
      const pulse = 0.7 + Math.sin(frame * 0.1 + c.phase) * 0.3;

      if (c.bag) {
        // Coin bag — purple sack shape
        ctx.shadowColor = '#a78bfa';
        ctx.shadowBlur = 16 * pulse;

        // Sack body
        ctx.fillStyle = '#7c3aed';
        ctx.beginPath();
        ctx.ellipse(c.x, cy + r * 0.15, r, r * 0.9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Sack highlight
        ctx.fillStyle = '#a78bfa';
        ctx.beginPath();
        ctx.ellipse(c.x - r * 0.2, cy - r * 0.1, r * 0.35, r * 0.45, -0.4, 0, Math.PI * 2);
        ctx.fill();

        // Tie at top
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        ctx.ellipse(c.x, cy - r * 0.8, r * 0.28, r * 0.18, 0, 0, Math.PI * 2);
        ctx.fill();

        // "x10" label
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.round(r * 0.75)}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('×10', c.x, cy + r * 0.2);
        ctx.textBaseline = 'alphabetic';

        ctx.shadowBlur = 0;
        return;
      }

      // Regular / big coin
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 14 * pulse;
      ctx.fillStyle = c.big ? '#ffcc00' : '#ffe066';
      ctx.beginPath(); ctx.arc(c.x, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;

      // Inner highlight
      ctx.fillStyle = '#fff9c4';
      ctx.beginPath(); ctx.arc(c.x - r * 0.25, cy - r * 0.25, r * 0.45, 0, Math.PI * 2); ctx.fill();

      // Rim
      ctx.strokeStyle = '#e6ac00';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(c.x, cy, r, 0, Math.PI * 2); ctx.stroke();

      // "×5" label on big coin / rotating spokes
      if (c.big) {
        ctx.strokeStyle = '#c8860a';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        const a = frame * 0.04 + c.phase;
        for (let i = 0; i < 4; i++) {
          const ang = a + i * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(c.x + Math.cos(ang) * r * 0.3, cy + Math.sin(ang) * r * 0.3);
          ctx.lineTo(c.x + Math.cos(ang) * r * 0.85, cy + Math.sin(ang) * r * 0.85);
          ctx.stroke();
        }
        ctx.fillStyle = '#7a4f00';
        ctx.font = `bold ${Math.round(r * 0.7)}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('×5', c.x, cy);
        ctx.textBaseline = 'alphabetic';
      }
    }

    function drawDiamond(d) {
      const bob = Math.sin(frame * 0.05 + d.phase) * 4;
      const cy = d.y + bob;
      const r = d.r;
      const pulse = 0.7 + Math.sin(frame * 0.08 + d.phase) * 0.3;
      const rot = Math.sin(frame * 0.03 + d.phase) * 0.12; // gentle wobble

      ctx.save();
      ctx.translate(d.x, cy);
      ctx.rotate(rot);

      // Glow
      ctx.shadowColor = '#40c9a2';
      ctx.shadowBlur = 20 * pulse;

      // Diamond shape (kite/rhombus — taller than wide)
      const hw = r * 0.7;  // half-width
      const ht = r * 1.3;  // half-height top
      const hb = r * 0.9;  // half-height bottom

      // Main body
      ctx.beginPath();
      ctx.moveTo(0, -ht);       // top point
      ctx.lineTo(hw, 0);        // right point
      ctx.lineTo(0, hb);        // bottom point
      ctx.lineTo(-hw, 0);       // left point
      ctx.closePath();
      ctx.fillStyle = '#3ab8a0';
      ctx.fill();

      // Upper-left facet (lighter)
      ctx.beginPath();
      ctx.moveTo(0, -ht);
      ctx.lineTo(-hw, 0);
      ctx.lineTo(0, -ht * 0.15);
      ctx.closePath();
      ctx.fillStyle = '#6edbc4';
      ctx.fill();

      // Upper-right facet (medium)
      ctx.beginPath();
      ctx.moveTo(0, -ht);
      ctx.lineTo(hw, 0);
      ctx.lineTo(0, -ht * 0.15);
      ctx.closePath();
      ctx.fillStyle = '#4ecdc4';
      ctx.fill();

      // Lower-right facet (darker)
      ctx.beginPath();
      ctx.moveTo(hw, 0);
      ctx.lineTo(0, hb);
      ctx.lineTo(0, -ht * 0.15);
      ctx.closePath();
      ctx.fillStyle = '#2a9080';
      ctx.fill();

      // Lower-left facet (dark)
      ctx.beginPath();
      ctx.moveTo(-hw, 0);
      ctx.lineTo(0, hb);
      ctx.lineTo(0, -ht * 0.15);
      ctx.closePath();
      ctx.fillStyle = '#318f7e';
      ctx.fill();

      // Outline
      ctx.beginPath();
      ctx.moveTo(0, -ht);
      ctx.lineTo(hw, 0);
      ctx.lineTo(0, hb);
      ctx.lineTo(-hw, 0);
      ctx.closePath();
      ctx.strokeStyle = '#5ee8cc';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Center facet line (horizontal)
      ctx.beginPath();
      ctx.moveTo(-hw, 0);
      ctx.lineTo(hw, 0);
      ctx.strokeStyle = 'rgba(94,232,204,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Center vertical facet line
      ctx.beginPath();
      ctx.moveTo(0, -ht);
      ctx.lineTo(0, hb);
      ctx.stroke();

      // Sparkle highlight
      const sparkle = 0.5 + Math.sin(frame * 0.15 + d.phase) * 0.5;
      ctx.fillStyle = `rgba(255,255,255,${sparkle * 0.6})`;
      ctx.beginPath();
      ctx.arc(-hw * 0.3, -ht * 0.4, r * 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // ---- Ground segments ----
    let groundTiles = [];
    function initGround() {
      groundTiles = [];
      for (let i = 0; i < Math.ceil(W / 40) + 2; i++) {
        groundTiles.push(i * 40);
      }
    }

    // ---- Update ----
    function update() {
      // Level-up transition
      if (state === 'levelup') {
        frame++;
        levelUpTimer--;
        const progress = (130 - levelUpTimer) / 130;
        // Player runs toward portal (starts at progress 0.22, enters at 0.58)
        const PORTAL_TARGET = 520;
        const runFrames = Math.round(130 * (0.58 - 0.22)); // frames available to reach portal
        const runSpeed = Math.max(1, (PORTAL_TARGET - 100) / runFrames); // px per frame to hit portal
        if (progress < 0.22) {
          player.legPhase += runSpeed * 0.12;
        } else if (progress < 0.58) {
          player.x += runSpeed;
          player.legPhase += runSpeed * 0.16;
        }
        // Background scrolls gently
        for (const s of stars) { s.x -= s.s * 1.5; if (s.x < 0) s.x = W; }
        updateAmbient();
        for (let i = 0; i < groundTiles.length; i++) {
          groundTiles[i] -= speed * 0.6;
          if (groundTiles[i] + 40 < 0) groundTiles[i] += groundTiles.length * 40;
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= p.decay;
          if (p.life <= 0) particles.splice(i, 1);
        }
        if (levelUpTimer <= 0) {
          level++;
          player.x = 100;
          obstacles = [];
          coins = [];
          diamonds = [];
          if (level > LEVEL_THEMES.length) {
            // Boss level after final stage
            initBoss();
            invincible = 60;
            state = 'boss';
          } else {
            nextLevelScore = score + 5000;
            levelStartScore = score;
            levelDiamondsSpawned = 0;
            invincible = 90;
            initAmbient();
            state = 'running';
          }
        }
        return;
      }

      // Always update diamond display (persistent currency)
      diamondEl.textContent = '\u25C6 ' + totalDiamonds;

      if (state !== 'running' && state !== 'boss') return;

      frame++;
      if (!(state === 'boss' && boss && boss.defeated)) score++;
      // Base speed scales with level + gradual increase within level (plateaus after level 4)
      const levelSpeed = Math.min((level - 1) * 2.0, 8);
      speed = 5 + levelSpeed + (score % 5000) / 750;
      // Slow down during boss defeat
      if (state === 'boss' && boss && boss.defeated) speed *= Math.max(0, 1 - boss.deathTimer / 120);

      // Invincibility countdown
      if (invincible > 0) invincible--;

      // Slide timer
      if (player.sliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) endSlide();
      }

      // Player physics (no gravity/jump while sliding on ground)
      if (!player.sliding) {
        player.vy += 0.6;
        player.y += player.vy;
        const groundY = GROUND;
        if (player.y >= groundY) {
          player.y = groundY;
          player.vy = 0;
          player.onGround = true;
          player.jumpsLeft = upgrades.tripleJump ? 3 : 2;
          // Dive landing impact
          if (player.diving) {
            player.diving = false;
            spawnParticles(player.x + player.w / 2, FLOOR, getSkin().ground, 10);
          }
        } else {
          player.onGround = false;
        }
      }

      // Leg / dust animation
      if (player.onGround && !player.sliding) {
        player.legPhase += speed * 0.12;
        if (frame % 3 === 0) spawnDustParticle();
      } else if (player.sliding) {
        if (frame % 4 === 0) spawnDustParticle();
      }

      // Trail effect
      if (upgrades.trail && frame % 2 === 0) {
        const sk = getSkin();
        particles.push({
          x: player.x + 2,
          y: player.y + player.h * 0.3 + Math.random() * player.h * 0.4,
          vx: -speed * 0.5 - Math.random() * 2,
          vy: (Math.random() - 0.5) * 1.5,
          life: 1, decay: 0.04,
          r: Math.random() * 3 + 1.5,
          color: sk.body,
        });
      }

      // Ghost wisp particles (drift downward from body)
      const sk2 = getSkin();
      if (sk2.ghost && frame % 5 === 0) {
        particles.push({
          x: player.x + player.w / 2 + (Math.random() - 0.5) * player.w,
          y: player.y + player.h * 0.7 + Math.random() * 10,
          vx: (Math.random() - 0.5) * 0.4,
          vy: Math.random() * 0.6 + 0.2,
          life: 0.45, decay: 0.02,
          r: Math.random() * 3 + 1,
          color: '#c0d0e8',
        });
      }

      // Frost sparkle particles (drift around body)
      if (sk2.frost && frame % 4 === 0) {
        particles.push({
          x: player.x + player.w / 2 + (Math.random() - 0.5) * player.w * 1.8,
          y: player.y + Math.random() * player.h,
          vx: (Math.random() - 0.5) * 0.8,
          vy: -Math.random() * 0.8 - 0.2,
          life: 0.7, decay: 0.04,
          r: Math.random() * 2 + 0.5,
          color: Math.random() > 0.5 ? '#d0f0ff' : '#ffffff',
        });
      }

      // Level-up check (not during boss)
      if (state === 'running' && score >= nextLevelScore) {
        state = 'levelup';
        levelUpTimer = 130;
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#7ee8fa', 30);
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffffff', 15);
        // Snap player to start position on the ground for portal run
        player.x = 100;
        player.y = GROUND;
        player.vy = 0;
        player.onGround = true;
        player.sliding = false;
        player.diving = false;
        player.h = PLAYER_H;
        return;
      }

      // ---- Boss update ----
      if (state === 'boss' && boss && !boss.defeated) {
        boss.bobPhase += 0.04;
        boss.y = GROUND - 60 + Math.sin(boss.bobPhase) * 12;
        if (boss.hurtTimer > 0) boss.hurtTimer--;

        // Boss attacks — spawn obstacles from the boss position
        boss.attackCooldown--;
        if (boss.attackCooldown <= 0) {
          boss.phase++;
          const pattern = boss.phase % 5;
          if (pattern === 0) {
            // Ground obstacle
            obstacles.push({ x: boss.x, y: FLOOR, w: 28, h: 30, type: 'ground' });
          } else if (pattern === 1) {
            // Overhead beam
            obstacles.push({ x: boss.x, y: SLIDE_CLEAR, w: 72, h: 52, type: 'overhead' });
          } else if (pattern === 2) {
            // Tall + overhead combo
            obstacles.push({ x: boss.x, y: FLOOR, w: 20, h: 54, type: 'ground' });
            obstacles.push({ x: boss.x + 80, y: SLIDE_CLEAR, w: 60, h: 52, type: 'overhead' });
          } else if (pattern === 3) {
            // Pair
            obstacles.push({ x: boss.x, y: FLOOR, w: 52, h: 42, type: 'ground', pair: true });
          } else {
            // Low wall
            obstacles.push({ x: boss.x, y: SLIDE_CLEAR, w: 34, h: SLIDE_CLEAR, type: 'lowwall' });
          }
          // Boss flashes when attacking
          boss.attackCooldown = Math.max(40, 70 - Math.floor((BOSS_MAX_HP - boss.hp) * 1.5));
        }
      }

      // Handle boss defeat animation
      if (state === 'boss' && boss && boss.defeated) {
        boss.deathTimer++;
        if (boss.deathTimer % 8 === 0) {
          const ex = boss.x + Math.random() * boss.w - boss.w / 2;
          const ey = boss.y + Math.random() * boss.h - boss.h / 2;
          spawnParticles(ex, ey, '#ff4444', 6);
          spawnParticles(ex, ey, '#ffaa00', 4);
        }
        if (boss.deathTimer >= 120) {
          state = 'victory';
          victoryTimer = 0;
          if (score > hiScore) hiScore = score;
        }
      }

      // Obstacles — gap shrinks each level (normal spawning only in running state)
      if (state === 'running') {
        nextObstacle--;
        if (nextObstacle <= 0) {
          obstacles.push(makeObstacle());
          const gapMin = Math.max(35, 65 - (level - 1) * 5);
          const gapMax = Math.max(75, 120 - (level - 1) * 8);
          nextObstacle = Math.floor(Math.random() * (gapMax - gapMin) + gapMin);
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed;
        if (obstacles[i].x + obstacles[i].w < 0) {
          // Dodged! Damage boss if in boss state
          if (state === 'boss' && boss && !boss.defeated) {
            boss.hp--;
            boss.hurtTimer = 12;
            spawnParticles(boss.x, boss.y, '#ff4444', 8);
            floatingTexts.push({ x: boss.x, y: boss.y - 30, text: '-1', color: '#ff4444', life: 40 });
            if (boss.hp <= 0) {
              boss.defeated = true;
              boss.deathTimer = 0;
              obstacles = [];
            }
          }
          obstacles.splice(i, 1);
          continue;
        }
        const ob = obstacles[i];
        const obHitbox = { x: ob.x, y: ob.y - ob.h, w: ob.w, h: ob.h };
        const playerHitbox = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (invincible <= 0 && collides(playerHitbox, obHitbox)) {
          lives--;
          spawnParticles(player.x + player.w / 2, player.y + player.h / 2, getSkin().body, 16);
          spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffffff', 8);
          if (lives <= 0) {
            state = 'dead';
            if (score > hiScore) hiScore = score;
          } else {
            invincible = 120; // ~2 seconds of invincibility
            // Knock player back to ground and clear slide
            endSlide();
            player.vy = -6;  // small bounce on hit
          }
        }
      }

      // Coins (not during boss)
      if (state !== 'boss') {
        nextCoin--;
        if (nextCoin <= 0) {
          spawnCoinGroup();
          nextCoin = Math.floor(Math.random() * 80 + 60);
        }
      }

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.x -= speed;
        if (c.x + c.r < 0) { coins.splice(i, 1); continue; }
        // Coin magnet
        if (upgrades.coinMagnet) {
          const px = player.x + player.w / 2, py = player.y + player.h / 2;
          const dx = px - c.x, dy = py - c.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 100 && dist > 0) {
            const pull = (100 - dist) / 100 * 4;
            c.x += (dx / dist) * pull;
            c.y += (dy / dist) * pull;
          }
        }
        // Collection check — use coin circle vs player box
        const bob = Math.sin(frame * 0.07 + c.phase) * 3;
        const cy = c.y + bob;
        if (c.x + c.r > player.x && c.x - c.r < player.x + player.w &&
            cy + c.r > player.y && cy - c.r < player.y + player.h) {
          coins.splice(i, 1);
          const worth = c.bag ? 10 : c.big ? 5 : 1;
          coinCount  += worth;
          totalCoins += worth;
          score += worth * 10;
          spawnParticles(c.x, cy, c.bag ? '#a78bfa' : '#ffe066', c.bag ? 18 : c.big ? 14 : 8);
          addCoinCombo(worth, c.x, cy);
          // 1-up every 50 coins
          if (totalCoins >= nextLifeAt) {
            lives++;
            nextLifeAt += 50;
            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff6b8a', 20);
            spawnFloatText(player.x + player.w / 2, player.y - 10, '+1 \u2665', '#ff6b8a');
          }
        }
      }

      // Diamonds — spawn at 2000 and 4000 distance into each level (not during boss)
      const levelDist = score - levelStartScore;
      if (state !== 'boss' && levelDiamondsSpawned < 1 && levelDist >= 2000) {
        diamonds.push({ x: W + 20, y: GROUND - 60, r: 16, phase: Math.random() * Math.PI * 2 });
        levelDiamondsSpawned++;
      }
      if (state !== 'boss' && levelDiamondsSpawned < 2 && levelDist >= 4000) {
        diamonds.push({ x: W + 20, y: GROUND - 60, r: 16, phase: Math.random() * Math.PI * 2 });
        levelDiamondsSpawned++;
      }

      for (let i = diamonds.length - 1; i >= 0; i--) {
        const d = diamonds[i];
        d.x -= speed;
        if (d.x + d.r < 0) { diamonds.splice(i, 1); continue; }
        // Diamond magnet
        if (upgrades.diamondMagnet) {
          const px = player.x + player.w / 2, py = player.y + player.h / 2;
          const dx = px - d.x, dy = py - d.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120 && dist > 0) {
            const pull = (120 - dist) / 120 * 5;
            d.x += (dx / dist) * pull;
            d.y += (dy / dist) * pull;
          }
        }
        // Collection check
        const bob = Math.sin(frame * 0.05 + d.phase) * 4;
        const dy = d.y + bob;
        const hw = d.r * 0.7, ht = d.r * 1.3, hb = d.r * 0.9;
        if (d.x + hw > player.x && d.x - hw < player.x + player.w &&
            dy + hb > player.y && dy - ht < player.y + player.h) {
          diamonds.splice(i, 1);
          diamondCount++;
          totalDiamonds++;
          saveDiamonds();
          score += 250;
          spawnParticles(d.x, dy, '#40c9a2', 20);
          spawnParticles(d.x, dy, '#ffffff', 10);
          spawnFloatText(d.x, dy - 20, '+\u25C6', '#40c9a2');
        }
      }

      // Coin combo timer
      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer === 0) { comboWorth = 0; comboText = null; }
      }

      // Floating texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y    += ft.vy;
        ft.vy   *= 0.96;
        ft.scale += (1 - ft.scale) * 0.18; // spring back to 1
        ft.life -= 0.018;
        if (ft.life <= 0) {
          if (ft === comboText) comboText = null;
          floatingTexts.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Stars scroll
      for (const s of stars) {
        s.x -= s.s;
        if (s.x < 0) s.x = W;
      }

      // Ambient background particles
      updateAmbient();

      // Ground tiles scroll
      for (let i = 0; i < groundTiles.length; i++) {
        groundTiles[i] -= speed;
        if (groundTiles[i] + 40 < 0) groundTiles[i] += groundTiles.length * 40;
      }

      // Update UI
      scoreEl.textContent = 'SCORE: ' + score;
      hiEl.textContent = 'BEST: ' + hiScore;
      coinEl.textContent = '\u25cf ' + coinCount;
      livesEl.textContent = '\u2665'.repeat(Math.max(0, lives)) || '\u2661';
      levelEl.textContent = state === 'boss' ? 'BOSS' : 'LVL ' + level;
    }

    // ---- Per-level silhouette shapes ----
    function drawSilhouette(theme) {
      const lv = Math.min(level, LEVEL_THEMES.length);
      ctx.fillStyle = theme.bldCol;

      if (lv === 2) {
        // Cyber forest — trees with trunks and rounded canopies
        for (const [x, w, h] of theme.blds) {
          const trunkW = Math.max(4, w * 0.18);
          const trunkH = h * 0.45;
          const cx = x + w / 2;
          // Trunk
          ctx.fillRect(cx - trunkW / 2, GROUND - trunkH, trunkW, trunkH);
          // Canopy — layered circles for organic feel
          const canopyR = w * 0.45;
          const canopyY = GROUND - trunkH - canopyR * 0.6;
          ctx.beginPath();
          ctx.arc(cx, canopyY, canopyR, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath();
          ctx.arc(cx - canopyR * 0.4, canopyY + canopyR * 0.2, canopyR * 0.7, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath();
          ctx.arc(cx + canopyR * 0.4, canopyY + canopyR * 0.2, canopyR * 0.7, 0, Math.PI * 2); ctx.fill();
        }

      } else if (lv === 3) {
        // Desert — rolling dunes and mesa shapes
        // Background dune wave
        ctx.beginPath();
        ctx.moveTo(0, GROUND);
        for (let px = 0; px <= W; px += 4) {
          const dy = Math.sin(px * 0.006) * 35 + Math.sin(px * 0.015) * 18 + Math.sin(px * 0.003) * 25;
          ctx.lineTo(px, GROUND - 50 - dy);
        }
        ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
        // Mesa/butte accents on top of dunes
        const mesas = [[80, 50, 40], [250, 35, 55], [450, 45, 35], [620, 40, 50], [760, 30, 45]];
        for (const [mx, mw, mh] of mesas) {
          ctx.beginPath();
          ctx.moveTo(mx - mw * 0.7, GROUND - 50);
          ctx.lineTo(mx - mw * 0.35, GROUND - 50 - mh);
          ctx.lineTo(mx + mw * 0.35, GROUND - 50 - mh);
          ctx.lineTo(mx + mw * 0.7, GROUND - 50);
          ctx.closePath(); ctx.fill();
        }

      } else if (lv === 5) {
        // Frozen tundra — jagged mountain peaks
        ctx.beginPath();
        ctx.moveTo(0, GROUND);
        for (const [x, w, h] of theme.blds) {
          const peakX = x + w / 2;
          const peakY = GROUND - h;
          ctx.lineTo(x, GROUND - h * 0.15);
          ctx.lineTo(peakX, peakY);
          ctx.lineTo(x + w, GROUND - h * 0.2);
        }
        ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
        // Snow caps — lighter triangles at peaks
        ctx.fillStyle = '#2a4a6a';
        for (const [x, w, h] of theme.blds) {
          const peakX = x + w / 2;
          const peakY = GROUND - h;
          const capH = h * 0.25;
          ctx.beginPath();
          ctx.moveTo(peakX, peakY);
          ctx.lineTo(peakX - w * 0.18, peakY + capH);
          ctx.lineTo(peakX + w * 0.18, peakY + capH);
          ctx.closePath(); ctx.fill();
        }

      } else if (lv === 7) {
        // Deep ocean — coral reef mounds and sea fans
        // Undulating reef base
        ctx.beginPath();
        ctx.moveTo(0, GROUND);
        for (let px = 0; px <= W; px += 4) {
          const dy = Math.sin(px * 0.008) * 25 + Math.sin(px * 0.02) * 12 + Math.sin(px * 0.004) * 20;
          ctx.lineTo(px, GROUND - 35 - dy);
        }
        ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
        // Coral branches / fans on top
        ctx.strokeStyle = theme.bldCol; ctx.lineWidth = 3; ctx.lineCap = 'round';
        const corals = [[60,55],[180,70],[310,50],[440,65],[570,55],[700,60]];
        for (const [cx, ch] of corals) {
          const baseY = GROUND - 40;
          // Central stem
          ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY - ch); ctx.stroke();
          // Branches
          for (let b = 1; b <= 3; b++) {
            const by = baseY - ch * (b / 4);
            const spread = 8 + b * 5;
            ctx.beginPath(); ctx.moveTo(cx, by);
            ctx.lineTo(cx - spread, by - 12 - b * 3); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, by);
            ctx.lineTo(cx + spread, by - 10 - b * 4); ctx.stroke();
          }
        }

      } else {
        // Default — rectangular building silhouettes (levels 1, 4, 6, 8)
        for (const [x, w, h] of theme.blds) {
          ctx.fillRect(x, GROUND - h, w, h);
        }
      }
    }

    // ---- Boss drawing ----
    function drawBoss() {
      if (!boss) return;
      const bx = boss.x, by = boss.y, bw = boss.w, bh = boss.h;
      ctx.save();

      // Shake when hurt
      const shake = boss.hurtTimer > 0 ? (Math.random() - 0.5) * 6 : 0;
      ctx.translate(shake, 0);

      // Death fade
      if (boss.defeated) {
        ctx.globalAlpha = Math.max(0, 1 - boss.deathTimer / 120);
      }

      // Shadow on ground
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(bx, FLOOR, bw * 0.5, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body — dark angular shape
      const bodyColor = boss.hurtTimer > 0 && boss.hurtTimer % 4 < 2 ? '#ff4444' : '#2a0a3a';
      ctx.fillStyle = bodyColor;

      // Main body (angular torso)
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.35, by + bh * 0.1);    // left shoulder
      ctx.lineTo(bx - bw * 0.15, by - bh * 0.35);    // left neck
      ctx.lineTo(bx + bw * 0.15, by - bh * 0.35);    // right neck
      ctx.lineTo(bx + bw * 0.35, by + bh * 0.1);     // right shoulder
      ctx.lineTo(bx + bw * 0.25, by + bh * 0.45);    // right hip
      ctx.lineTo(bx - bw * 0.25, by + bh * 0.45);    // left hip
      ctx.closePath(); ctx.fill();

      // Head
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.2, by - bh * 0.3);
      ctx.lineTo(bx, by - bh * 0.55);                 // crown
      ctx.lineTo(bx + bw * 0.2, by - bh * 0.3);
      ctx.closePath(); ctx.fill();

      // Eye — glowing red
      const eyePulse = 0.7 + Math.sin(frame * 0.08) * 0.3;
      ctx.fillStyle = `rgba(255,30,30,${eyePulse})`;
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(bx, by - bh * 0.35, 6, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Arm spikes
      ctx.fillStyle = bodyColor;
      // Left arm
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.35, by + bh * 0.1);
      ctx.lineTo(bx - bw * 0.6, by + bh * 0.05 + Math.sin(boss.bobPhase * 1.5) * 5);
      ctx.lineTo(bx - bw * 0.3, by + bh * 0.25);
      ctx.closePath(); ctx.fill();
      // Right arm
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.35, by + bh * 0.1);
      ctx.lineTo(bx + bw * 0.6, by + bh * 0.05 + Math.sin(boss.bobPhase * 1.5 + 1) * 5);
      ctx.lineTo(bx + bw * 0.3, by + bh * 0.25);
      ctx.closePath(); ctx.fill();

      // Outline glow
      ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 1.5;
      ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.35, by + bh * 0.1);
      ctx.lineTo(bx - bw * 0.15, by - bh * 0.35);
      ctx.lineTo(bx, by - bh * 0.55);
      ctx.lineTo(bx + bw * 0.15, by - bh * 0.35);
      ctx.lineTo(bx + bw * 0.35, by + bh * 0.1);
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.globalAlpha = 1;
      ctx.restore();

      // HP bar (drawn without shake/fade)
      if (!boss.defeated) {
        const barW = 120, barH = 8;
        const barX = bx - barW / 2, barY = by - bh * 0.65 - 12;
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
        ctx.fillStyle = '#330a0a'; ctx.fillRect(barX, barY, barW, barH);
        const hpFrac = Math.max(0, boss.hp / BOSS_MAX_HP);
        const hpCol = hpFrac > 0.5 ? '#a855f7' : hpFrac > 0.25 ? '#ff6b35' : '#ff2020';
        ctx.fillStyle = hpCol;
        ctx.fillRect(barX, barY, barW * hpFrac, barH);
        ctx.shadowColor = hpCol; ctx.shadowBlur = 6;
        ctx.fillRect(barX, barY, barW * hpFrac, barH);
        ctx.shadowBlur = 0;
      }
    }

    // ---- Per-level animated background layers ----
    function drawLevelBg(theme) {
      const lv = Math.min(level, LEVEL_THEMES.length);
      ctx.save();

      if (lv === 2) {
        // Cyber forest — fireflies glow
        for (const p of ambientParts) {
          const glow = 0.4 + Math.sin(p.phase * 3) * 0.3;
          ctx.globalAlpha = glow;
          ctx.fillStyle = '#40ff90';
          ctx.shadowColor = '#40ff90'; ctx.shadowBlur = 10;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;

      } else if (lv === 3) {
        // Desert — heat shimmer waves
        ctx.globalAlpha = 0.04;
        ctx.fillStyle = '#e67e22';
        for (let i = 0; i < 5; i++) {
          const yy = GROUND - 20 - i * 18;
          ctx.beginPath();
          ctx.moveTo(0, yy);
          for (let x = 0; x < W; x += 8) {
            ctx.lineTo(x, yy + Math.sin((x + frame * 2) * 0.02 + i) * 6);
          }
          ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
        }

      } else if (lv === 4) {
        // Purple spires — pulsing energy lines between tall buildings
        ctx.globalAlpha = 0.15 + Math.sin(frame * 0.04) * 0.1;
        ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 1.5;
        ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 8;
        const blds = theme.blds;
        for (let i = 0; i < blds.length - 1; i += 2) {
          const [x1, w1, h1] = blds[i]; const [x2, w2, h2] = blds[i + 1];
          const y1 = GROUND - h1 + 10; const y2 = GROUND - h2 + 10;
          ctx.beginPath(); ctx.moveTo(x1 + w1 / 2, y1);
          const mx = (x1 + w1 / 2 + x2 + w2 / 2) / 2;
          const my = Math.min(y1, y2) - 15 + Math.sin(frame * 0.06 + i) * 8;
          ctx.quadraticCurveTo(mx, my, x2 + w2 / 2, y2);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        // Rising energy motes
        for (const p of ambientParts) {
          ctx.globalAlpha = 0.5 + Math.sin(p.phase * 2) * 0.3;
          ctx.fillStyle = '#c084fc';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }

      } else if (lv === 5) {
        // Frozen tundra — snowflakes + aurora borealis
        // Aurora: gently waving translucent bands
        for (let band = 0; band < 3; band++) {
          const hue = 140 + band * 40 + Math.sin(frame * 0.01 + band) * 20;
          ctx.globalAlpha = 0.06;
          ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
          ctx.beginPath(); ctx.moveTo(0, 30 + band * 25);
          for (let x = 0; x <= W; x += 10) {
            ctx.lineTo(x, 30 + band * 25 + Math.sin((x + frame * 0.8) * 0.008 + band * 2) * 20);
          }
          ctx.lineTo(W, 90 + band * 25); ctx.lineTo(0, 90 + band * 25); ctx.closePath(); ctx.fill();
        }
        // Snowflakes
        for (const p of ambientParts) {
          ctx.globalAlpha = 0.6 + Math.sin(p.phase) * 0.2;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }

      } else if (lv === 6) {
        // Volcanic — lava glow at ground + rising embers
        // Lava glow gradient at bottom
        const grad = ctx.createLinearGradient(0, FLOOR - 40, 0, FLOOR + 20);
        grad.addColorStop(0, 'rgba(255,80,0,0)');
        grad.addColorStop(0.7, 'rgba(255,60,0,0.12)');
        grad.addColorStop(1, 'rgba(255,30,0,0.25)');
        ctx.globalAlpha = 0.7 + Math.sin(frame * 0.03) * 0.15;
        ctx.fillStyle = grad;
        ctx.fillRect(0, FLOOR - 40, W, 60);
        // Embers
        for (const p of ambientParts) {
          const life = 1 - (FLOOR - p.y) / (FLOOR + 30);
          ctx.globalAlpha = Math.max(0, Math.min(1, life * 0.9));
          ctx.fillStyle = Math.random() > 0.5 ? '#ff6a00' : '#ff3800';
          ctx.shadowColor = '#ff4500'; ctx.shadowBlur = 4;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;

      } else if (lv === 7) {
        // Deep ocean — light rays from above + bubbles
        // God rays
        ctx.globalAlpha = 0.04;
        for (let i = 0; i < 5; i++) {
          const bx = 100 + i * 160 + Math.sin(frame * 0.006 + i * 1.5) * 40;
          const grad = ctx.createLinearGradient(bx, 0, bx + 30, GROUND);
          grad.addColorStop(0, '#40e0d0');
          grad.addColorStop(1, 'rgba(32,178,170,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(bx - 15, 0); ctx.lineTo(bx + 45, 0);
          ctx.lineTo(bx + 80, GROUND); ctx.lineTo(bx - 50, GROUND);
          ctx.closePath(); ctx.fill();
        }
        // Kelp — swaying vertical lines anchored at ground
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = '#0d6b5e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (let k = 0; k < 8; k++) {
          const kx = 50 + k * 105;
          const kh = 50 + (k % 3) * 25;
          ctx.beginPath();
          ctx.moveTo(kx, GROUND);
          for (let seg = 1; seg <= 5; seg++) {
            const sy = GROUND - (kh / 5) * seg;
            const sx = kx + Math.sin(frame * 0.025 + k + seg * 0.8) * (6 + seg * 2);
            ctx.lineTo(sx, sy);
          }
          ctx.stroke();
        }
        // Bubbles
        for (const p of ambientParts) {
          ctx.globalAlpha = 0.3 + Math.sin(p.phase * 2) * 0.15;
          ctx.strokeStyle = '#60d8d0'; ctx.lineWidth = 1;
          ctx.fillStyle = 'rgba(96,216,208,0.08)';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }

      } else if (lv === 8) {
        // Neon city — rain streaks + scrolling neon signs on buildings
        // Rain
        ctx.strokeStyle = 'rgba(180,200,255,0.25)'; ctx.lineWidth = 1;
        for (const p of ambientParts) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.vx * 2, p.y + p.vy * 2);
          ctx.stroke();
        }
        // Neon sign glow on some buildings

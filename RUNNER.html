      } else if (lv === 7) {
        // Deep ocean — light rays from above + bubbles
        // God rays
        ctx.globalAlpha = 0.04;
        for (let i = 0; i < 5; i++) {
          const bx = 100 + i * 160 + Math.sin(frame * 0.006 + i * 1.5) * 40;
          const grad = ctx.createLinearGradient(bx, 0, bx + 30, GROUND);
          grad.addColorStop(0, '#40e0d0');
          grad.addColorStop(1, 'rgba(32,178,170,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(bx - 15, 0); ctx.lineTo(bx + 45, 0);
          ctx.lineTo(bx + 80, GROUND); ctx.lineTo(bx - 50, GROUND);
          ctx.closePath(); ctx.fill();
        }
        // Kelp — swaying vertical lines anchored at ground
        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = '#0d6b5e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (let k = 0; k < 8; k++) {
          const kx = 50 + k * 105;
          const kh = 50 + (k % 3) * 25;
          ctx.beginPath();
          ctx.moveTo(kx, GROUND);
          for (let seg = 1; seg <= 5; seg++) {
            const sy = GROUND - (kh / 5) * seg;
            const sx = kx + Math.sin(frame * 0.025 + k + seg * 0.8) * (6 + seg * 2);
            ctx.lineTo(sx, sy);
          }
          ctx.stroke();
        }
        // Bubbles
        for (const p of ambientParts) {
          ctx.globalAlpha = 0.3 + Math.sin(p.phase * 2) * 0.15;
          ctx.strokeStyle = '#60d8d0'; ctx.lineWidth = 1;
          ctx.fillStyle = 'rgba(96,216,208,0.08)';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        }

      } else if (lv === 8) {
        // Neon city — rain streaks + scrolling neon signs on buildings
        // Rain
        ctx.strokeStyle = 'rgba(180,200,255,0.25)'; ctx.lineWidth = 1;
        for (const p of ambientParts) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + p.vx * 2, p.y + p.vy * 2);
          ctx.stroke();
        }
        // Neon sign glow on some buildings
        const signs = [
          { x: 50, y: GROUND - 150, w: 30, h: 8, color: '#f72585' },
          { x: 200, y: GROUND - 170, w: 25, h: 6, color: '#4cc9f0' },
          { x: 380, y: GROUND - 160, w: 35, h: 8, color: '#7209b7' },
          { x: 530, y: GROUND - 140, w: 28, h: 7, color: '#f72585' },
          { x: 680, y: GROUND - 180, w: 32, h: 8, color: '#4cc9f0' },
        ];
        for (const s of signs) {
          const pulse = 0.5 + Math.sin(frame * 0.05 + s.x * 0.1) * 0.3;
          ctx.globalAlpha = pulse;
          ctx.fillStyle = s.color;
          ctx.shadowColor = s.color; ctx.shadowBlur = 15;
          ctx.fillRect(s.x, s.y, s.w, s.h);
          // Reflection line below
          ctx.globalAlpha = pulse * 0.15;
          ctx.fillRect(s.x, s.y + s.h + 2, s.w, 40);
        }
        ctx.shadowBlur = 0;
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // ---- Draw ----
    function draw() {
      // Hide HUD bar during home / snake / flappy
      const uiEl = document.getElementById('ui');
      const isArcadeGame = state === 'home' || state === 'snake' || state === 'snakeDead' || state === 'flappy' || state === 'flappyDead';
      uiEl.style.visibility = isArcadeGame ? 'hidden' : 'visible';

      // Home / Snake / Flappy own their entire frame
      if (state === 'home') {
        ctx.save();
        if (screenShake > 0) {
          const fade = screenShake / 22;
          const m = shakeMag * fade;
          ctx.translate((Math.random() - 0.5) * m * 2, (Math.random() - 0.5) * m * 2);
        }
        drawHome();
        ctx.restore();
        drawOnlinePanel();
        return;
      }
      if (state === 'snake' || state === 'snakeDead') {
        ctx.save();
        if (screenShake > 0) {
          const fade = screenShake / 22;
          const m = shakeMag * fade;
          ctx.translate((Math.random() - 0.5) * m * 2, (Math.random() - 0.5) * m * 2);
        }
        drawSnake();
        // particles overlay (for food eat puff)
        for (const p of particles) {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        drawOnlinePanel();
        return;
      }
      if (state === 'flappy' || state === 'flappyDead') {
        ctx.save();
        if (screenShake > 0) {
          const fade = screenShake / 22;
          const m = shakeMag * fade;
          ctx.translate((Math.random() - 0.5) * m * 2, (Math.random() - 0.5) * m * 2);
        }
        drawFlappy();
        for (const p of particles) {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        for (const ft of floatingTexts) {
          ctx.save();
          ctx.globalAlpha = ft.life;
          ctx.translate(ft.x, ft.y);
          ctx.scale(ft.scale, ft.scale);
          ctx.shadowColor = ft.color; ctx.shadowBlur = 8;
          ctx.fillStyle = ft.color;
          ctx.font = 'bold 26px Courier New';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(ft.text, 0, 0);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        drawOnlinePanel();
        return;
      }

      const theme = getTheme();

      // Apply screen shake by translating the whole frame
      ctx.save();
      if (screenShake > 0) {
        const fade = screenShake / 22;
        const m = shakeMag * fade;
        ctx.translate((Math.random() - 0.5) * m * 2, (Math.random() - 0.5) * m * 2);
      }

      // Sky (oversized to mask shake gaps at the edges)
      ctx.fillStyle = theme.sky;
      ctx.fillRect(-20, -20, W + 40, H + 40);

      // Stars
      for (const s of stars) {
        ctx.fillStyle = `rgba(200,220,255,${0.3 + Math.sin(frame * 0.02 + s.x) * 0.2})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Distant silhouette (per-level shape)
      drawSilhouette(theme);

      // Animated background layer
      drawLevelBg(theme);

      // Ground line glow
      ctx.shadowColor = theme.ground;
      ctx.shadowBlur = 10;
      ctx.fillStyle = theme.ground;
      ctx.fillRect(0, FLOOR - 2, W, 4);
      ctx.shadowBlur = 0;

      // Ground tiles
      ctx.fillStyle = theme.gTile;
      for (const tx of groundTiles) {
        ctx.fillRect(tx, FLOOR + 2, 30, 3);
      }

      // Ground fill
      ctx.fillStyle = theme.gFill;
      ctx.fillRect(0, FLOOR + 2, W, H - FLOOR);

      // Floating platforms (drawn behind obstacles so spikes/coins read clearly)
      for (const p of platforms) drawPlatform(p);

      // Obstacles
      for (const ob of obstacles) drawObstacle(ob);

      // Boss
      if (state === 'boss' && boss) drawBoss();

      // Coins
      for (const c of coins) drawCoin(c);

      // Diamonds
      for (const d of diamonds) drawDiamond(d);
      for (const b of diamondBags) drawDiamondBag(b);
      for (const s of spinTokens) drawSpinToken(s);

      // Particles
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      // Floating texts
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = ft.life;
        ctx.translate(ft.x, ft.y);
        ctx.scale(ft.scale, ft.scale);
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 26px Courier New';
        ctx.fillText(ft.text, 0, 0);
        ctx.restore();
      }
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.globalAlpha = 1;

      // Player — hide when inside the portal (progress > 0.58)
      const inPortal = state === 'levelup' && (130 - levelUpTimer) / 130 > 0.56;
      if (state !== 'dead' && !inPortal) {
        if (invincible <= 0 || Math.floor(invincible / 6) % 2 === 0) {
          drawPlayer();
        }
      }

      // Thorren hammer swing animation
      if (thorrenHammerSwingTimer > 0 && activeSkin === 'thorren') {
        const t = 1 - (thorrenHammerSwingTimer / THORREN_HAMMER_SWING); // 0 → 1
        // Arc from -110° (up-back) to +90° (down-forward)
        const startAng = -Math.PI * 0.6;
        const endAng = Math.PI * 0.55;
        const angle = startAng + (endAng - startAng) * t;
        const px = player.x + player.w / 2;
        const py = player.y + 10;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(angle);
        // Handle
        ctx.fillStyle = '#5a3018';
        ctx.strokeStyle = '#2a1808'; ctx.lineWidth = 1.5;
        ctx.fillRect(-2, 0, 4, 38);
        ctx.strokeRect(-2, 0, 4, 38);
        // Pommel
        ctx.fillStyle = '#c89a30';
        ctx.beginPath(); ctx.arc(0, -3, 3, 0, Math.PI * 2); ctx.fill();
        // Hammer head
        ctx.fillStyle = '#9aa0a8';
        ctx.strokeStyle = '#3a3e44'; ctx.lineWidth = 1.5;
        roundRect(-16, 36, 32, 16, 3);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#cdd2d8';
        ctx.fillRect(-14, 38, 28, 3);
        // Electric arcs trailing the head
        ctx.strokeStyle = `rgba(200,235,255,${0.7 + Math.sin(frame * 0.4) * 0.3})`;
        ctx.lineWidth = 2;
        ctx.shadowColor = '#80c8ff'; ctx.shadowBlur = 10;
        for (let i = 0; i < 4; i++) {
          const lx = -14 + i * 9;
          ctx.beginPath();
          ctx.moveTo(lx, 52);
          ctx.lineTo(lx + 3, 58);
          ctx.lineTo(lx - 2, 62);
          ctx.lineTo(lx + 2, 68);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.restore();
        // Shockwave at impact (last third of the swing)
        if (t > 0.6) {
          const s = (t - 0.6) / 0.4; // 0 → 1
          const r = 30 + s * 90;
          ctx.strokeStyle = `rgba(160,216,255,${(1 - s) * 0.8})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(player.x + player.w + 80, player.y + player.h / 2, r, -Math.PI * 0.6, Math.PI * 0.6);
          ctx.stroke();
          // Lightning crackles in the swing path
          for (let i = 0; i < 5; i++) {
            const lx = player.x + player.w + 20 + i * 35;
            const ly = player.y + player.h / 2 + (Math.random() - 0.5) * 30;
            ctx.strokeStyle = `rgba(220,240,255,${(1 - s) * 0.9})`;
            ctx.lineWidth = 1.5;
            ctx.shadowColor = '#80c8ff'; ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.moveTo(lx, ly - 8);
            ctx.lineTo(lx + 3, ly - 2);
            ctx.lineTo(lx - 2, ly + 2);
            ctx.lineTo(lx + 3, ly + 8);
            ctx.stroke();
            ctx.shadowBlur = 0;
          }
        }
      }

      // Thorren hammer button (touch-friendly, bottom-right) — only when wearing the skin
      if ((state === 'running' || state === 'boss') && activeSkin === 'thorren') {
        const r = thorrenHammerBtnRect();
        const ready = thorrenHammerCooldown <= 0 && thorrenHammerSwingTimer <= 0 && canAffordArcadeCoin(THORREN_HAMMER_COIN_COST);
        ctx.fillStyle = ready ? 'rgba(128,200,255,0.30)' : 'rgba(60,60,60,0.45)';
        roundRect(r.x, r.y, r.w, r.h, 5); ctx.fill();
        ctx.strokeStyle = ready ? '#a0d8ff' : '#444'; ctx.lineWidth = 1.5;
        roundRect(r.x, r.y, r.w, r.h, 5); ctx.stroke();
        // Mini hammer icon
        ctx.save();
        ctx.translate(r.x + r.w / 2, r.y + r.h / 2 - 4);
        ctx.fillStyle = '#5a3018';
        ctx.fillRect(-1.5, -3, 3, 16);
        ctx.fillStyle = '#9aa0a8'; ctx.strokeStyle = '#3a3e44'; ctx.lineWidth = 1;
        roundRect(-9, -8, 18, 7, 1.5); ctx.fill(); ctx.stroke();
        ctx.restore();
        // Cost / cooldown indicator
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.font = 'bold 10px Courier New';
        if (thorrenHammerCooldown > 0) {
          ctx.fillStyle = '#888';
          ctx.fillText((thorrenHammerCooldown / 60).toFixed(1) + 's', r.x + r.w / 2, r.y + r.h - 14);
          // Cooldown progress strip
          const pct = 1 - thorrenHammerCooldown / THORREN_HAMMER_COOLDOWN;
          ctx.fillStyle = 'rgba(160,216,255,0.5)';
          ctx.fillRect(r.x + 2, r.y + r.h - 3, (r.w - 4) * pct, 2);
        } else {
          ctx.fillStyle = ready ? '#a0d8ff' : '#666';
          ctx.fillText('[F] ●' + THORREN_HAMMER_COIN_COST, r.x + r.w / 2, r.y + r.h - 14);
        }
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      }

      // Portal animation
      if (state === 'levelup') {
        const progress = (130 - levelUpTimer) / 130; // 0 → 1
        const PORTAL_X  = 520;
        const PORTAL_CY = FLOOR - PLAYER_H * 0.6;
        const PW = 86, PH = 158; // full portal size

        // Scale: grow in phase 1, stay open phase 2, shrink phase 3
        let pScale;
        if      (progress < 0.28) pScale = progress / 0.28;
        else if (progress < 0.82) pScale = 1;
        else                      pScale = (1 - progress) / 0.18;
        pScale = Math.max(0, pScale);

        const pw = PW * pScale, ph = PH * pScale;
        const spin = frame * 0.04;

        // Draw portal
        ctx.save();

        // Outer glow halo
        ctx.shadowColor = '#7ee8fa';
        ctx.shadowBlur = 28 * pScale;
        ctx.strokeStyle = '#7ee8fa';
        ctx.lineWidth = 4 * pScale;
        ctx.beginPath();
        ctx.ellipse(PORTAL_X, PORTAL_CY, pw / 2, ph / 2, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Inner void (dark purple)
        const voidGrad = ctx.createRadialGradient(PORTAL_X, PORTAL_CY, 0, PORTAL_X, PORTAL_CY, pw / 2);
        voidGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
        voidGrad.addColorStop(0.25, 'rgba(100,200,255,0.7)');
        voidGrad.addColorStop(0.6, 'rgba(40,0,100,0.85)');
        voidGrad.addColorStop(1, 'rgba(10,0,30,0.95)');
        ctx.fillStyle = voidGrad;
        ctx.beginPath();
        ctx.ellipse(PORTAL_X, PORTAL_CY, pw / 2, ph / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Rotating inner rings
        for (let r = 0; r < 3; r++) {
          const rf = 0.35 + r * 0.2;
          ctx.strokeStyle = `rgba(126,232,250,${0.6 - r * 0.15})`;
          ctx.lineWidth = (3 - r) * pScale;
          ctx.beginPath();
          ctx.ellipse(PORTAL_X, PORTAL_CY, pw / 2 * rf, ph / 2 * rf, spin + r * 0.5, 0, Math.PI * 1.6);
          ctx.stroke();
        }

        // Electric tendrils along the rim
        ctx.strokeStyle = `rgba(180,240,255,${0.7 * pScale})`;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 10; i++) {
          const ang = (i / 10) * Math.PI * 2 + spin * 1.5;
          const rx = pw / 2, ry = ph / 2;
          const ex = PORTAL_X + Math.cos(ang) * rx;
          const ey = PORTAL_CY + Math.sin(ang) * ry;
          const midX = ex + (Math.random() - 0.5) * 12 * pScale;
          const midY = ey + (Math.random() - 0.5) * 12 * pScale;
          ctx.beginPath();
          ctx.moveTo(PORTAL_X + Math.cos(ang) * rx * 0.6, PORTAL_CY + Math.sin(ang) * ry * 0.6);
          ctx.quadraticCurveTo(midX, midY, ex, ey);
          ctx.stroke();
        }
        ctx.restore();

        // Flash when fully open and when closing
        const flashA = pScale > 0.98 ? Math.sin(frame * 0.25) * 0.12 : 0;
        if (flashA > 0) {
          ctx.fillStyle = `rgba(126,232,250,${flashA})`;
          ctx.fillRect(0, 0, W, H);
        }

        // "LEVEL X" text visible while portal is open
        if (progress > 0.35 && progress < 0.82) {
          const ta = Math.min(1, (progress - 0.35) / 0.12);
          ctx.globalAlpha = ta;
          ctx.textAlign = 'center';
          ctx.shadowColor = '#7ee8fa';
          ctx.shadowBlur = 22;
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 48px Courier New';
          const isBossNext = level + 1 > LEVEL_THEMES.length;
          ctx.fillText(isBossNext ? 'BOSS FIGHT' : 'LEVEL ' + (level + 1), W / 2, H / 2 - 8);
          ctx.shadowBlur = 0;
          ctx.font = '20px Courier New';
          ctx.fillStyle = isBossNext ? '#ff4444' : '#7ee8fa';
          ctx.fillText(isBossNext ? 'SURVIVE' : 'GET READY', W / 2, H / 2 + 26);
          ctx.globalAlpha = 1;
          ctx.textAlign = 'left';
        }
      }

      // Overlay messages
      if (state === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        // back-to-home button (top-left)
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        roundRect(8, 8, 78, 22, 4); ctx.fill();
        ctx.fillStyle = '#7ee8fa'; ctx.font = 'bold 12px Courier New';
        ctx.fillText(isTouchDevice ? '← HOME' : 'H — HOME', 16, 23);
        ctx.textAlign = 'center';
        ctx.fillStyle = COL.text;
        ctx.font = 'bold 48px Courier New';
        ctx.fillText('RUNNER', W / 2, H / 2 - 30);
        ctx.font = '18px Courier New';
        ctx.fillStyle = '#aaa';
        if (isTouchDevice) {
          ctx.fillText('TAP jump  \u2022  SWIPE \u2193 slide / dive', W / 2, H / 2 + 14);
        } else {
          ctx.fillText('UP to jump  \u2022  DOWN to slide  \u2022  SPACE / TAP to start', W / 2, H / 2 + 14);
        }
        // Shop button (tappable area)
        ctx.fillStyle = '#40c9a2';
        ctx.font = 'bold 16px Courier New';
        ctx.fillText(isTouchDevice ? '\u25C6 SHOP' : 'S \u2014 SHOP', W / 2, H / 2 + 44);
        // Daily spin button
        const spinAvailable = canSpin();
        ctx.fillStyle = spinAvailable ? '#ffe066' : '#665533';
        ctx.font = 'bold 16px Courier New';
        const spinLabel = (isTouchDevice ? '\u2605 DAILY SPIN' : 'W \u2014 DAILY SPIN') +
                          (extraSpins > 0 ? ' (+' + extraSpins + ')' : '');
        ctx.fillText(spinLabel, W / 2, H / 2 + 70);
        if (!spinAvailable) {
          ctx.fillStyle = '#555'; ctx.font = '11px Courier New';
          ctx.fillText('next spin tomorrow', W / 2, H / 2 + 84);
        }

        ctx.textAlign = 'left';
      }

      // Shop overlay
      if (state === 'shop') {
        ctx.fillStyle = 'rgba(0,0,0,0.78)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';

        // Title
        ctx.shadowColor = '#40c9a2'; ctx.shadowBlur = 16;
        ctx.fillStyle = '#40c9a2';
        ctx.font = 'bold 34px Courier New';
        ctx.fillText('SHOP', W / 2, 36);
        ctx.shadowBlur = 0;

        // Balance: diamonds + coins
        ctx.font = '14px Courier New';
        ctx.fillStyle = '#40c9a2';
        ctx.fillText('\u25C6 ' + totalDiamonds, W / 2 - 50, 56);
        ctx.fillStyle = '#ffe066';
        ctx.fillText('\u25CF ' + coinBank, W / 2 + 50, 56);

        // Scrollable item list
        const visCount = 6;
        let scrollOff = Math.max(0, Math.min(shopSelection - 2, SHOP_ITEMS.length - visCount));
        if (scrollOff < 0) scrollOff = 0;

        for (let vi = 0; vi < visCount && scrollOff + vi < SHOP_ITEMS.length; vi++) {
          const idx = scrollOff + vi;
          const item = SHOP_ITEMS[idx];
          const y = 80 + vi * 28;
          const selected = idx === shopSelection;
          const isSkin = item.type === 'skin';
          const owned = isSkin ? ownedSkins.includes(item.key) : !!ownedUpgrades[item.key];
          const isActive = isSkin ? (activeSkin === item.key) : !!upgrades[item.key];

          // Selection highlight
          if (selected) {
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            roundRect(W / 2 - 230, y - 11, 460, 24, 4); ctx.fill();
            ctx.strokeStyle = item.color; ctx.lineWidth = 1.5;
            roundRect(W / 2 - 230, y - 11, 460, 24, 4); ctx.stroke();
          }

          // Item name
          ctx.fillStyle = isActive ? '#667' : item.color;
          ctx.font = (selected ? 'bold ' : '') + '14px Courier New';
          ctx.fillText(item.name, W / 2 - 40, y + 4);

          // Status / price
          if (isActive) {
            ctx.fillStyle = '#40c9a2'; ctx.font = 'bold 12px Courier New';
            ctx.fillText('ACTIVE', W / 2 + 185, y + 4);
          } else if (owned) {
            ctx.fillStyle = '#888'; ctx.font = '12px Courier New';
            ctx.fillText(isSkin ? 'EQUIP' : 'OFF', W / 2 + 185, y + 4);
          } else {
            const coinCost = item.cost * COINS_PER_DIAMOND;
            const affordD = totalDiamonds >= item.cost;
            const affordC = coinBank >= coinCost;
            ctx.font = 'bold 11px Courier New';
            ctx.fillStyle = affordD ? '#40c9a2' : '#664444';
            ctx.fillText('\u25C6 ' + item.cost, W / 2 + 160, y + 4);
            ctx.fillStyle = affordC ? '#ffe066' : '#665533';
            ctx.fillText('\u25CF ' + coinCost, W / 2 + 210, y + 4);
          }
        }

        // Scroll arrows
        if (scrollOff > 0) {
          ctx.fillStyle = '#555'; ctx.font = '12px Courier New';
          ctx.fillText('\u25B2', W / 2, 70);
        }
        if (scrollOff + visCount < SHOP_ITEMS.length) {
          ctx.fillStyle = '#555'; ctx.font = '12px Courier New';
          ctx.fillText('\u25BC', W / 2, 80 + visCount * 28 + 4);
        }

        // Selected item description
        ctx.fillStyle = '#888'; ctx.font = '13px Courier New';
        ctx.fillText(SHOP_ITEMS[shopSelection].desc, W / 2, 260);

        // Instructions
        ctx.fillStyle = '#555'; ctx.font = '12px Courier New';
        if (isTouchDevice) {
          ctx.fillText('TAP item to buy/equip  \u2022  TAP here to close', W / 2, H - 12);
        } else {
          ctx.fillText('\u2191\u2193 select  \u2022  SPACE buy  \u2022  ESC back', W / 2, H - 12);
        }
        ctx.textAlign = 'left';
      }

      if (state === 'wheel') {
        ctx.fillStyle = 'rgba(0,0,0,0.82)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';

        ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 14;
        ctx.fillStyle = '#ffe066';
        ctx.font = 'bold 24px Courier New';
        ctx.fillText('DAILY SPIN', W / 2, 26);
        ctx.shadowBlur = 0;

        const cx = W / 2, cy = H / 2 - 4, R = 76;
        const segAngle = (Math.PI * 2) / WHEEL_SEGMENTS.length;
        for (let i = 0; i < WHEEL_SEGMENTS.length; i++) {
          const a0 = wheelAngle + i * segAngle;
          const a1 = a0 + segAngle;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, R, a0, a1);
          ctx.closePath();
          ctx.fillStyle = WHEEL_COLORS[i];
          ctx.fill();
          ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2; ctx.stroke();
          const mid = a0 + segAngle / 2;
          ctx.save();
          ctx.translate(cx + Math.cos(mid) * R * 0.62, cy + Math.sin(mid) * R * 0.62);
          ctx.rotate(mid + Math.PI / 2);
          ctx.fillStyle = '#1a1a2e'; ctx.font = 'bold 14px Courier New';
          ctx.fillText('◆' + WHEEL_SEGMENTS[i], 0, 5);
          ctx.restore();
        }
        ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#1a1a2e'; ctx.fill();
        ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 2; ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx, cy - R - 10);
        ctx.lineTo(cx - 8, cy - R + 4);
        ctx.lineTo(cx + 8, cy - R + 4);
        ctx.closePath();
        ctx.fillStyle = '#e94560'; ctx.fill();
        ctx.strokeStyle = '#1a1a2e'; ctx.stroke();

        ctx.font = 'bold 15px Courier New';
        if (wheelSpinning) {
          ctx.fillStyle = '#888'; ctx.fillText('SPINNING...', W / 2, cy + R + 18);
        } else if (wheelResultShown > 0) {
          ctx.fillStyle = '#40c9a2';
          ctx.fillText('+ ◆ ' + wheelRewardAmount + ' DIAMONDS!', W / 2, cy + R + 18);
          ctx.font = '11px Courier New';
          if (canSpin()) {
            ctx.fillStyle = '#ffe066';
            ctx.fillText(isTouchDevice ? 'TAP WHEEL — SPIN AGAIN' : 'SPACE — SPIN AGAIN', W / 2, cy + R + 34);
          } else {
            ctx.fillStyle = '#888';
            ctx.fillText('COME BACK TOMORROW', W / 2, cy + R + 34);
          }
        } else if (canSpin()) {
          ctx.fillStyle = '#40c9a2';
          ctx.fillText(isTouchDevice ? 'TAP WHEEL TO SPIN' : 'SPACE TO SPIN', W / 2, cy + R + 18);
        } else {
          ctx.fillStyle = '#888';
          ctx.fillText('COME BACK TOMORROW', W / 2, cy + R + 18);
        }

        // Extra spins counter (always visible if you have any)
        if (extraSpins > 0) {
          ctx.fillStyle = '#ffe066'; ctx.font = 'bold 11px Courier New';
          ctx.fillText('★ EXTRA SPINS: ' + extraSpins, W / 2, cy + R + 50);
        }

        ctx.fillStyle = '#555'; ctx.font = '10px Courier New';
        ctx.fillText(isTouchDevice ? 'TAP HERE to close' : 'ESC / W to close', W / 2, H - 6);
        ctx.textAlign = 'left';
      }

      if (state === 'dead') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
        // back-to-home button (top-left)
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        roundRect(8, 8, 78, 22, 4); ctx.fill();
        ctx.fillStyle = '#7ee8fa'; ctx.font = 'bold 12px Courier New';
        ctx.fillText(isTouchDevice ? '← HOME' : 'H — HOME', 16, 23);
        ctx.textAlign = 'center';
        ctx.fillStyle = COL.ground;
        ctx.font = 'bold 42px Courier New';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
        ctx.fillStyle = COL.text;
        ctx.font = '20px Courier New';
        ctx.fillText('Score: ' + score + '   \u25cf ' + coinCount + '   \u25C6 ' + diamondCount + '   \u2665\u00d7' + Math.max(0,lives), W / 2, H / 2);
        // Revive option (accepts diamonds OR coins)
        const reviveOk = canRevive();
        ctx.font = 'bold 16px Courier New';
        ctx.fillStyle = reviveOk ? '#7ee8fa' : '#555';
        const reviveLabel = (isTouchDevice ? 'TAP HERE \u2014 REVIVE ' : 'R \u2014 REVIVE ')
                          + '\u25C6 ' + REVIVE_COST + ' / \u25CF ' + REVIVE_COIN_COST;
        ctx.fillText(reviveLabel, W / 2, H / 2 + 30);
        ctx.font = '16px Courier New';
        ctx.fillStyle = '#aaa';
        ctx.fillText(isTouchDevice ? 'TAP to restart' : 'SPACE / TAP to restart', W / 2, H / 2 + 58);
        ctx.fillStyle = '#40c9a2';
        ctx.font = 'bold 14px Courier New';
        ctx.fillText(isTouchDevice ? '\u25C6 SHOP' : 'S \u2014 SHOP', W / 2, H / 2 + 80);
        const spinAvailable = canSpin();
        ctx.fillStyle = spinAvailable ? '#ffe066' : '#665533';
        ctx.font = 'bold 14px Courier New';
        const spinLabel = (isTouchDevice ? '\u2605 DAILY SPIN' : 'W \u2014 DAILY SPIN') +
                          (extraSpins > 0 ? ' (+' + extraSpins + ')' : '');
        ctx.fillText(spinLabel, W / 2, H / 2 + 104);
        ctx.textAlign = 'left';
      }

      if (state === 'victory') {
        victoryTimer++;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';

        // Animated sparkle border
        for (let i = 0; i < 12; i++) {
          const angle = (victoryTimer * 0.02) + (i / 12) * Math.PI * 2;
          const sx = W / 2 + Math.cos(angle) * 180;
          const sy = H / 2 + Math.sin(angle) * 80;
          const sparkle = 0.4 + Math.sin(victoryTimer * 0.06 + i) * 0.4;
          ctx.globalAlpha = sparkle;
          ctx.fillStyle = '#ffd700';
          ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
          ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;

        // Bag of diamonds dropped by the boss
        const bagCx = W / 2, bagCy = FLOOR - 18;
        ctx.save();
        // Ground shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(bagCx, FLOOR + 2, 32, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Sack body
        ctx.fillStyle = '#8b5a2b';
        ctx.beginPath();
        ctx.moveTo(bagCx - 9, bagCy - 18);
        ctx.quadraticCurveTo(bagCx - 32, bagCy - 4, bagCx - 26, bagCy + 18);
        ctx.quadraticCurveTo(bagCx, bagCy + 30, bagCx + 26, bagCy + 18);
        ctx.quadraticCurveTo(bagCx + 32, bagCy - 4, bagCx + 9, bagCy - 18);
        ctx.closePath(); ctx.fill();
        // Right-side shading
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.moveTo(bagCx + 9, bagCy - 18);
        ctx.quadraticCurveTo(bagCx + 32, bagCy - 4, bagCx + 26, bagCy + 18);
        ctx.quadraticCurveTo(bagCx + 14, bagCy + 26, bagCx + 4, bagCy + 26);
        ctx.lineTo(bagCx + 4, bagCy - 18);
        ctx.closePath(); ctx.fill();
        // Rope tie
        ctx.strokeStyle = '#4a2e12'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(bagCx - 11, bagCy - 16);
        ctx.lineTo(bagCx + 11, bagCy - 16);
        ctx.stroke();
        // Diamonds spilling from the top
        const diamonds = [
          { x: -12, y: -26, s: 5 },
          { x:   0, y: -32, s: 6 },
          { x:  12, y: -26, s: 5 },
          { x:  -4, y: -22, s: 4 },
          { x:   8, y: -22, s: 4 },
        ];
        for (const d of diamonds) {
          const dx = bagCx + d.x, dy = bagCy + d.y;
          ctx.fillStyle = '#7ee8fa';
          ctx.shadowColor = '#7ee8fa'; ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.moveTo(dx, dy - d.s);
          ctx.lineTo(dx + d.s * 0.7, dy);
          ctx.lineTo(dx, dy + d.s);
          ctx.lineTo(dx - d.s * 0.7, dy);
          ctx.closePath(); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.beginPath();
          ctx.moveTo(dx, dy - d.s);
          ctx.lineTo(dx + d.s * 0.35, dy - d.s * 0.3);
          ctx.lineTo(dx, dy - d.s * 0.1);
          ctx.lineTo(dx - d.s * 0.35, dy - d.s * 0.3);
          ctx.closePath(); ctx.fill();
        }
        // Sparkles around the bag
        for (let i = 0; i < 5; i++) {
          const a = (victoryTimer * 0.05) + (i / 5) * Math.PI * 2;
          const r = 38 + Math.sin(victoryTimer * 0.06 + i) * 4;
          const sx = bagCx + Math.cos(a) * r;
          const sy = bagCy + Math.sin(a) * r * 0.5;
          const sp = 0.3 + Math.sin(victoryTimer * 0.09 + i * 1.3) * 0.5;
          ctx.globalAlpha = Math.max(0, sp);
          ctx.fillStyle = '#7ee8fa';
          ctx.shadowColor = '#7ee8fa'; ctx.shadowBlur = 6;
          ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        ctx.restore();

        // Title
        ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 42px Courier New';
        ctx.fillText('VICTORY!', W / 2, H / 2 - 40);
        ctx.shadowBlur = 0;

        ctx.fillStyle = COL.text;
        ctx.font = '18px Courier New';
        ctx.fillText('You defeated the boss!', W / 2, H / 2 - 6);

        ctx.fillStyle = '#aaa';
        ctx.font = '16px Courier New';
        ctx.fillText('Score: ' + score + '   \u25cf ' + coinCount + '   \u25C6 ' + diamondCount, W / 2, H / 2 + 24);

        ctx.fillStyle = '#7ee8fa';
        ctx.font = '14px Courier New';
        const restartMsg = isTouchDevice ? 'TAP to play again' : 'SPACE to play again';
        ctx.fillText(restartMsg, W / 2, H / 2 + 54);
        ctx.textAlign = 'left';
      }

      ctx.restore(); // matches the save at the top of draw() for screen shake
      drawOnlinePanel();
    }

    // ---- Loop ----
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initStars();
    initAmbient();
    initGround();
    loop();
  </script>
</body>
</html>

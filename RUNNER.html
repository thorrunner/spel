        const signs = [
          { x: 50, y: GROUND - 150, w: 30, h: 8, color: '#f72585' },
          { x: 200, y: GROUND - 170, w: 25, h: 6, color: '#4cc9f0' },
          { x: 380, y: GROUND - 160, w: 35, h: 8, color: '#7209b7' },
          { x: 530, y: GROUND - 140, w: 28, h: 7, color: '#f72585' },
          { x: 680, y: GROUND - 180, w: 32, h: 8, color: '#4cc9f0' },
        ];
        for (const s of signs) {
          const pulse = 0.5 + Math.sin(frame * 0.05 + s.x * 0.1) * 0.3;
          ctx.globalAlpha = pulse;
          ctx.fillStyle = s.color;
          ctx.shadowColor = s.color; ctx.shadowBlur = 15;
          ctx.fillRect(s.x, s.y, s.w, s.h);
          // Reflection line below
          ctx.globalAlpha = pulse * 0.15;
          ctx.fillRect(s.x, s.y + s.h + 2, s.w, 40);
        }
        ctx.shadowBlur = 0;
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // ---- Draw ----
    function draw() {
      const theme = getTheme();

      // Sky
      ctx.fillStyle = theme.sky;
      ctx.fillRect(0, 0, W, H);

      // Stars
      for (const s of stars) {
        ctx.fillStyle = `rgba(200,220,255,${0.3 + Math.sin(frame * 0.02 + s.x) * 0.2})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Distant silhouette (per-level shape)
      drawSilhouette(theme);

      // Animated background layer
      drawLevelBg(theme);

      // Ground line glow
      ctx.shadowColor = theme.ground;
      ctx.shadowBlur = 10;
      ctx.fillStyle = theme.ground;
      ctx.fillRect(0, FLOOR - 2, W, 4);
      ctx.shadowBlur = 0;

      // Ground tiles
      ctx.fillStyle = theme.gTile;
      for (const tx of groundTiles) {
        ctx.fillRect(tx, FLOOR + 2, 30, 3);
      }

      // Ground fill
      ctx.fillStyle = theme.gFill;
      ctx.fillRect(0, FLOOR + 2, W, H - FLOOR);

      // Obstacles
      for (const ob of obstacles) drawObstacle(ob);

      // Boss
      if (state === 'boss' && boss) drawBoss();

      // Coins
      for (const c of coins) drawCoin(c);

      // Diamonds
      for (const d of diamonds) drawDiamond(d);

      // Particles
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      // Floating texts
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = ft.life;
        ctx.translate(ft.x, ft.y);
        ctx.scale(ft.scale, ft.scale);
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 26px Courier New';
        ctx.fillText(ft.text, 0, 0);
        ctx.restore();
      }
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.globalAlpha = 1;

      // Player — hide when inside the portal (progress > 0.58)
      const inPortal = state === 'levelup' && (130 - levelUpTimer) / 130 > 0.56;
      if (state !== 'dead' && !inPortal) {
        if (invincible <= 0 || Math.floor(invincible / 6) % 2 === 0) {
          drawPlayer();
        }
      }

      // Portal animation
      if (state === 'levelup') {
        const progress = (130 - levelUpTimer) / 130; // 0 → 1
        const PORTAL_X  = 520;
        const PORTAL_CY = FLOOR - PLAYER_H * 0.6;
        const PW = 86, PH = 158; // full portal size

        // Scale: grow in phase 1, stay open phase 2, shrink phase 3
        let pScale;
        if      (progress < 0.28) pScale = progress / 0.28;
        else if (progress < 0.82) pScale = 1;
        else                      pScale = (1 - progress) / 0.18;
        pScale = Math.max(0, pScale);

        const pw = PW * pScale, ph = PH * pScale;
        const spin = frame * 0.04;

        // Draw portal
        ctx.save();

        // Outer glow halo
        ctx.shadowColor = '#7ee8fa';
        ctx.shadowBlur = 28 * pScale;
        ctx.strokeStyle = '#7ee8fa';
        ctx.lineWidth = 4 * pScale;
        ctx.beginPath();
        ctx.ellipse(PORTAL_X, PORTAL_CY, pw / 2, ph / 2, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Inner void (dark purple)
        const voidGrad = ctx.createRadialGradient(PORTAL_X, PORTAL_CY, 0, PORTAL_X, PORTAL_CY, pw / 2);
        voidGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
        voidGrad.addColorStop(0.25, 'rgba(100,200,255,0.7)');
        voidGrad.addColorStop(0.6, 'rgba(40,0,100,0.85)');
        voidGrad.addColorStop(1, 'rgba(10,0,30,0.95)');
        ctx.fillStyle = voidGrad;
        ctx.beginPath();
        ctx.ellipse(PORTAL_X, PORTAL_CY, pw / 2, ph / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Rotating inner rings
        for (let r = 0; r < 3; r++) {
          const rf = 0.35 + r * 0.2;
          ctx.strokeStyle = `rgba(126,232,250,${0.6 - r * 0.15})`;
          ctx.lineWidth = (3 - r) * pScale;
          ctx.beginPath();
          ctx.ellipse(PORTAL_X, PORTAL_CY, pw / 2 * rf, ph / 2 * rf, spin + r * 0.5, 0, Math.PI * 1.6);
          ctx.stroke();
        }

        // Electric tendrils along the rim
        ctx.strokeStyle = `rgba(180,240,255,${0.7 * pScale})`;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 10; i++) {
          const ang = (i / 10) * Math.PI * 2 + spin * 1.5;
          const rx = pw / 2, ry = ph / 2;
          const ex = PORTAL_X + Math.cos(ang) * rx;
          const ey = PORTAL_CY + Math.sin(ang) * ry;
          const midX = ex + (Math.random() - 0.5) * 12 * pScale;
          const midY = ey + (Math.random() - 0.5) * 12 * pScale;
          ctx.beginPath();
          ctx.moveTo(PORTAL_X + Math.cos(ang) * rx * 0.6, PORTAL_CY + Math.sin(ang) * ry * 0.6);
          ctx.quadraticCurveTo(midX, midY, ex, ey);
          ctx.stroke();
        }
        ctx.restore();

        // Flash when fully open and when closing
        const flashA = pScale > 0.98 ? Math.sin(frame * 0.25) * 0.12 : 0;
        if (flashA > 0) {
          ctx.fillStyle = `rgba(126,232,250,${flashA})`;
          ctx.fillRect(0, 0, W, H);
        }

        // "LEVEL X" text visible while portal is open
        if (progress > 0.35 && progress < 0.82) {
          const ta = Math.min(1, (progress - 0.35) / 0.12);
          ctx.globalAlpha = ta;
          ctx.textAlign = 'center';
          ctx.shadowColor = '#7ee8fa';
          ctx.shadowBlur = 22;
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 48px Courier New';
          const isBossNext = level + 1 > LEVEL_THEMES.length;
          ctx.fillText(isBossNext ? 'BOSS FIGHT' : 'LEVEL ' + (level + 1), W / 2, H / 2 - 8);
          ctx.shadowBlur = 0;
          ctx.font = '20px Courier New';
          ctx.fillStyle = isBossNext ? '#ff4444' : '#7ee8fa';
          ctx.fillText(isBossNext ? 'SURVIVE' : 'GET READY', W / 2, H / 2 + 26);
          ctx.globalAlpha = 1;
          ctx.textAlign = 'left';
        }
      }

      // Overlay messages
      if (state === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = COL.text;
        ctx.font = 'bold 48px Courier New';
        ctx.fillText('RUNNER', W / 2, H / 2 - 30);
        ctx.font = '18px Courier New';
        ctx.fillStyle = '#aaa';
        if (isTouchDevice) {
          ctx.fillText('TAP jump  \u2022  SWIPE \u2193 slide / dive', W / 2, H / 2 + 14);
        } else {
          ctx.fillText('UP to jump  \u2022  DOWN to slide  \u2022  SPACE / TAP to start', W / 2, H / 2 + 14);
        }
        // Shop button (tappable area)
        ctx.fillStyle = '#40c9a2';
        ctx.font = 'bold 16px Courier New';
        ctx.fillText(isTouchDevice ? '\u25C6 SHOP' : 'S \u2014 SHOP', W / 2, H / 2 + 44);
        ctx.textAlign = 'left';
      }

      // Shop overlay
      if (state === 'shop') {
        ctx.fillStyle = 'rgba(0,0,0,0.78)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';

        // Title
        ctx.shadowColor = '#40c9a2'; ctx.shadowBlur = 16;
        ctx.fillStyle = '#40c9a2';
        ctx.font = 'bold 34px Courier New';
        ctx.fillText('SHOP', W / 2, 36);
        ctx.shadowBlur = 0;

        // Diamond balance
        ctx.fillStyle = '#40c9a2';
        ctx.font = '14px Courier New';
        ctx.fillText('\u25C6 ' + totalDiamonds + ' diamonds', W / 2, 56);

        // Scrollable item list
        const visCount = 6;
        let scrollOff = Math.max(0, Math.min(shopSelection - 2, SHOP_ITEMS.length - visCount));
        if (scrollOff < 0) scrollOff = 0;

        for (let vi = 0; vi < visCount && scrollOff + vi < SHOP_ITEMS.length; vi++) {
          const idx = scrollOff + vi;
          const item = SHOP_ITEMS[idx];
          const y = 80 + vi * 28;
          const selected = idx === shopSelection;
          const isSkin = item.type === 'skin';
          const owned = isSkin ? ownedSkins.includes(item.key) : upgrades[item.key];
          const isActive = isSkin && activeSkin === item.key;

          // Selection highlight
          if (selected) {
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            roundRect(W / 2 - 230, y - 11, 460, 24, 4); ctx.fill();
            ctx.strokeStyle = item.color; ctx.lineWidth = 1.5;
            roundRect(W / 2 - 230, y - 11, 460, 24, 4); ctx.stroke();
          }

          // Item name
          ctx.fillStyle = (owned && !isSkin) || isActive ? '#667' : item.color;
          ctx.font = (selected ? 'bold ' : '') + '14px Courier New';
          ctx.fillText(item.name, W / 2 - 40, y + 4);

          // Status / price
          if (isActive) {
            ctx.fillStyle = '#40c9a2'; ctx.font = 'bold 12px Courier New';
            ctx.fillText('ACTIVE', W / 2 + 185, y + 4);
          } else if (owned && isSkin) {
            ctx.fillStyle = '#888'; ctx.font = '12px Courier New';
            ctx.fillText('EQUIP', W / 2 + 185, y + 4);
          } else if (owned) {
            ctx.fillStyle = '#40c9a2'; ctx.font = 'bold 12px Courier New';
            ctx.fillText('OWNED', W / 2 + 185, y + 4);
          } else {
            ctx.fillStyle = totalDiamonds >= item.cost ? '#40c9a2' : '#664444';
            ctx.font = 'bold 12px Courier New';
            ctx.fillText('\u25C6 ' + item.cost, W / 2 + 185, y + 4);
          }
        }

        // Scroll arrows
        if (scrollOff > 0) {
          ctx.fillStyle = '#555'; ctx.font = '12px Courier New';
          ctx.fillText('\u25B2', W / 2, 70);
        }
        if (scrollOff + visCount < SHOP_ITEMS.length) {
          ctx.fillStyle = '#555'; ctx.font = '12px Courier New';
          ctx.fillText('\u25BC', W / 2, 80 + visCount * 28 + 4);
        }

        // Selected item description
        ctx.fillStyle = '#888'; ctx.font = '13px Courier New';
        ctx.fillText(SHOP_ITEMS[shopSelection].desc, W / 2, 260);

        // Instructions
        ctx.fillStyle = '#555'; ctx.font = '12px Courier New';
        if (isTouchDevice) {
          ctx.fillText('TAP item to buy/equip  \u2022  TAP here to close', W / 2, H - 12);
        } else {
          ctx.fillText('\u2191\u2193 select  \u2022  SPACE buy  \u2022  ESC back', W / 2, H - 12);
        }
        ctx.textAlign = 'left';
      }

      if (state === 'dead') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = COL.ground;
        ctx.font = 'bold 42px Courier New';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
        ctx.fillStyle = COL.text;
        ctx.font = '20px Courier New';
        ctx.fillText('Score: ' + score + '   \u25cf ' + coinCount + '   \u25C6 ' + diamondCount + '   \u2665\u00d7' + Math.max(0,lives), W / 2, H / 2 + 10);
        ctx.font = '16px Courier New';
        ctx.fillStyle = '#aaa';
        ctx.fillText(isTouchDevice ? 'TAP to restart' : 'SPACE / TAP to restart', W / 2, H / 2 + 38);
        ctx.fillStyle = '#40c9a2';
        ctx.font = 'bold 14px Courier New';
        ctx.fillText(isTouchDevice ? '\u25C6 SHOP' : 'S \u2014 SHOP', W / 2, H / 2 + 60);
        ctx.textAlign = 'left';
      }

      if (state === 'victory') {
        victoryTimer++;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';

        // Animated sparkle border
        for (let i = 0; i < 12; i++) {
          const angle = (victoryTimer * 0.02) + (i / 12) * Math.PI * 2;
          const sx = W / 2 + Math.cos(angle) * 180;
          const sy = H / 2 + Math.sin(angle) * 80;
          const sparkle = 0.4 + Math.sin(victoryTimer * 0.06 + i) * 0.4;
          ctx.globalAlpha = sparkle;
          ctx.fillStyle = '#ffd700';
          ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
          ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;

        // Title
        ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 42px Courier New';
        ctx.fillText('VICTORY!', W / 2, H / 2 - 40);
        ctx.shadowBlur = 0;

        ctx.fillStyle = COL.text;
        ctx.font = '18px Courier New';
        ctx.fillText('You defeated the boss!', W / 2, H / 2 - 6);

        ctx.fillStyle = '#aaa';
        ctx.font = '16px Courier New';
        ctx.fillText('Score: ' + score + '   \u25cf ' + coinCount + '   \u25C6 ' + diamondCount, W / 2, H / 2 + 24);

        ctx.fillStyle = '#7ee8fa';
        ctx.font = '14px Courier New';
        const restartMsg = isTouchDevice ? 'TAP to play again' : 'SPACE to play again';
        ctx.fillText(restartMsg, W / 2, H / 2 + 54);
        ctx.textAlign = 'left';
      }
    }

    // ---- Loop ----
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initStars();
    initAmbient();
    initGround();
    loop();
  </script>
</body>
</html>

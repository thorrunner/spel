    function drawSpinToken(s) {
      const bob = Math.sin(frame * 0.05 + s.phase) * 4;
      const cy = s.y + bob;
      const r = s.r;
      const pulse = 0.7 + Math.sin(frame * 0.1 + s.phase) * 0.3;
      const rot = frame * 0.03 + s.phase;

      ctx.save();
      ctx.translate(s.x, cy);
      ctx.rotate(rot);

      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 22 * pulse;

      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = (i * Math.PI) / 5 - Math.PI / 2;
        const rr = i % 2 === 0 ? r : r * 0.45;
        const x = Math.cos(a) * rr;
        const y = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = '#ffe066';
      ctx.fill();
      ctx.strokeStyle = '#7a5a00';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(-r * 0.18, -r * 0.18, r * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // ---- Ground segments ----
    let groundTiles = [];
    function initGround() {
      groundTiles = [];
      for (let i = 0; i < Math.ceil(W / 40) + 2; i++) {
        groundTiles.push(i * 40);
      }
    }

    // ---- Update ----
    // ---- Snake game ----
    // Shared payment helper — pay a coin cost, with diamond fallback at the conversion rate
    function payArcadeCoinCost(coinCost) {
      if (coinBank >= coinCost) { coinBank -= coinCost; saveCoinBank(); return true; }
      const dCost = Math.ceil(coinCost / COINS_PER_DIAMOND);
      if (totalDiamonds >= dCost) { totalDiamonds -= dCost; saveDiamonds(); return true; }
      return false;
    }
    function canAffordArcadeCoin(coinCost) {
      return coinBank >= coinCost || totalDiamonds >= Math.ceil(coinCost / COINS_PER_DIAMOND);
    }
    const SNAKE_SLOW_COST = 5, SNAKE_WALLHACK_COST = 15;
    const FLAPPY_SLOW_COST = 5, FLAPPY_SHIELD_COST = 15;
    function activateSnakePowerup(n) {
      if (state !== 'snake' || !snakeStarted) return;
      if (n === 1) {
        if (snakeSlowTimer > 0) return;
        if (!payArcadeCoinCost(SNAKE_SLOW_COST)) return;
        snakeSlowTimer = 300; // 5s at 60fps
        spawnFloatText(W / 2, H / 2 - 30, 'SLOW MO', '#7ee8fa');
      } else {
        if (snakeWallhackTimer > 0) return;
        if (!payArcadeCoinCost(SNAKE_WALLHACK_COST)) return;
        snakeWallhackTimer = 360; // 6s at 60fps
        spawnFloatText(W / 2, H / 2 - 30, 'WALLHACK', '#c08aff');
      }
    }
    function activateFlappyPowerup(n) {
      if (state !== 'flappy' || !flappyStarted) return;
      if (n === 1) {
        if (flappySlowTimer > 0) return;
        if (!payArcadeCoinCost(FLAPPY_SLOW_COST)) return;
        flappySlowTimer = 240; // 4s
        spawnFloatText(W / 2, H / 2 - 30, 'SLOW MO', '#7ee8fa');
      } else {
        if (flappyShield) return;
        if (!payArcadeCoinCost(FLAPPY_SHIELD_COST)) return;
        flappyShield = true;
        spawnFloatText(W / 2, H / 2 - 30, 'SHIELD ARMED', '#7ee8fa');
      }
    }

    // Arcade-game button rects (also used for hit-tests)
    function snakeHomeBtnRect()    { return { x: 4,           y: 4, w: 60,  h: 18 }; }
    function snakeSlowBtnRect()    { return { x: W / 2 - 140, y: 4, w: 110, h: 18 }; }
    function snakeShrinkBtnRect()  { return { x: W / 2 + 10,  y: 4, w: 130, h: 18 }; }
    function flappyHomeBtnRect()   { return { x: 4,           y: 4, w: 60,  h: 20 }; }
    function flappySlowBtnRect()   { return { x: 70,          y: 4, w: 110, h: 20 }; }
    function flappyShieldBtnRect() { return { x: W - 118,     y: 4, w: 110, h: 20 }; }
    function thorrenHammerBtnRect() { return { x: W - 70, y: H - 60, w: 60, h: 44 }; }
    function inRect(cp, r) { return cp.x >= r.x && cp.x <= r.x + r.w && cp.y >= r.y && cp.y <= r.y + r.h; }

    function activateThorrenHammer() {
      if (state !== 'running' && state !== 'boss') return;
      if (activeSkin !== 'thorren') return;
      if (thorrenHammerCooldown > 0 || thorrenHammerSwingTimer > 0) return;
      if (!payArcadeCoinCost(THORREN_HAMMER_COIN_COST)) return;
      thorrenHammerSwingTimer = THORREN_HAMMER_SWING;
      thorrenHammerCooldown = THORREN_HAMMER_COOLDOWN;
      // Smash obstacles within range in front of the player
      const playerCx = player.x + player.w / 2;
      let killed = 0;
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        if (ob.x + ob.w >= player.x && ob.x <= playerCx + THORREN_HAMMER_RANGE) {
          const ocx = ob.x + ob.w / 2;
          const ocy = ob.y - ob.h / 2;
          spawnParticles(ocx, ocy, '#f5a623', 16);
          spawnParticles(ocx, ocy, '#a0d8ff', 12);
          spawnParticles(ocx, ocy, '#ffffff', 6);
          obstacles.splice(i, 1);
          score += 50;
          killed++;
        }
      }
      if (killed > 0) {
        spawnFloatText(player.x + 80, player.y + 4, 'SMASH ×' + killed, '#a0d8ff');
      }
      // Damage the boss if its bulk is in range (1 HP per swing)
      if (state === 'boss' && boss && !boss.defeated) {
        const bossCx = boss.x + boss.w / 2;
        if (bossCx > player.x - 20 && bossCx < playerCx + THORREN_HAMMER_RANGE + 80) {
          boss.hp -= 1;
          boss.hurtTimer = 20;
          spawnParticles(boss.x + boss.w / 2, boss.y - boss.h / 2, '#a0d8ff', 22);
        }
      }
      triggerShake(killed > 0 ? 10 : 6, 14);
    }

    // Shared revive helper for snake/flappy mini-games
    const ARCADE_REVIVE_COIN_COST = ARCADE_REVIVE_COST * COINS_PER_DIAMOND;
    function canArcadeRevive() {
      return totalDiamonds >= ARCADE_REVIVE_COST || coinBank >= ARCADE_REVIVE_COIN_COST;
    }
    function payArcadeRevive() {
      if (totalDiamonds >= ARCADE_REVIVE_COST) {
        totalDiamonds -= ARCADE_REVIVE_COST; saveDiamonds(); return true;
      }
      if (coinBank >= ARCADE_REVIVE_COIN_COST) {
        coinBank -= ARCADE_REVIVE_COIN_COST; saveCoinBank(); return true;
      }
      return false;
    }
    function reviveSnake() {
      if (state !== 'snakeDead' || !payArcadeRevive()) return;
      // Keep body, score, walls, pickups — just unlock the loop again
      state = 'snake';
      snakeStarted = false;
      snakeDirQueue = [];
      snakeTick = 0;
      spawnParticles(snake[0].x * SNAKE_CELL + SNAKE_CELL / 2,
                     snake[0].y * SNAKE_CELL + SNAKE_CELL / 2 + 24, '#7ee8fa', 18);
    }
    function reviveFlappy() {
      if (state !== 'flappyDead' || !payArcadeRevive()) return;
      // Reset bird, clear nearby pipes/pickups so revive isn't instant death
      flappyBird.x = 200; flappyBird.y = H / 2; flappyBird.vy = 0; flappyBird.rot = 0;
      flappyPipes = flappyPipes.filter(p => p.x > 360);
      flappyPickups = flappyPickups.filter(pk => pk.x > 360);
      flappyStarted = false;
      flappyDeadTimer = 0;
      flappyNextPipe = Math.max(flappyNextPipe, 90);
      state = 'flappy';
      spawnParticles(flappyBird.x, flappyBird.y, '#7ee8fa', 18);
    }

    function findEmptySnakeCell() {
      for (let tries = 0; tries < 100; tries++) {
        const fx = Math.floor(Math.random() * SNAKE_COLS);
        const fy = Math.floor(Math.random() * SNAKE_ROWS);
        if (isSnakeWall(fx, fy)) continue;
        if (snake.some(s => s.x === fx && s.y === fy)) continue;
        if (snakeFood && snakeFood.x === fx && snakeFood.y === fy) continue;
        if (snakeCoins.some(c => c.x === fx && c.y === fy)) continue;
        if (snakeDiamonds.some(d => d.x === fx && d.y === fy)) continue;
        return { x: fx, y: fy };
      }
      return null;
    }
    function spawnSnakeFood() {
      const cell = findEmptySnakeCell();
      if (cell) snakeFood = cell;
    }
    function spawnSnakeCoin() {
      const cell = findEmptySnakeCell();
      if (cell) snakeCoins.push(cell);
    }
    function spawnSnakeDiamond() {
      const cell = findEmptySnakeCell();
      if (cell) snakeDiamonds.push(cell);
    }
    function resetSnake() {
      snake = [{ x: 8, y: 7 }, { x: 7, y: 7 }, { x: 6, y: 7 }];
      snakeDir = { x: 1, y: 0 };
      snakeDirQueue = [];
      snakeScore = 0;
      snakeTick = 0;
      snakeTickRate = 12;
      snakeStarted = false;
      snakeCoins = [];
      snakeDiamonds = [];
      snakeSlowTimer = 0;
      snakeWallhackTimer = 0;
      spawnSnakeFood();
      spawnSnakeCoin();
      spawnSnakeCoin();
    }
    function queueSnakeDir(dx, dy) {
      const last = snakeDirQueue.length > 0 ? snakeDirQueue[snakeDirQueue.length - 1] : snakeDir;
      // Block 180° reversal against most recent committed/queued direction
      if (last.x === -dx && last.y === -dy) return;
      // Block duplicate (same direction)
      if (last.x === dx && last.y === dy) return;
      if (snakeDirQueue.length < 2) snakeDirQueue.push({ x: dx, y: dy });
      else snakeDirQueue[1] = { x: dx, y: dy }; // replace the second slot if user spams
    }
    function updateSnake() {
      if (state === 'snakeDead') return;
      if (!snakeStarted) return;
      if (snakeSlowTimer > 0) snakeSlowTimer--;
      if (snakeWallhackTimer > 0) snakeWallhackTimer--;
      snakeTick++;
      const effectiveRate = snakeSlowTimer > 0 ? snakeTickRate * 2 : snakeTickRate;
      if (snakeTick < effectiveRate) return;
      snakeTick = 0;
      if (snakeDirQueue.length > 0) snakeDir = snakeDirQueue.shift();
      const head = { x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y };
      if (snakeWallhackTimer > 0) {
        // Wrap edges and pass through interior walls
        if (head.x < 0) head.x = SNAKE_COLS - 1;
        else if (head.x >= SNAKE_COLS) head.x = 0;
        if (head.y < 0) head.y = SNAKE_ROWS - 1;
        else if (head.y >= SNAKE_ROWS) head.y = 0;
        // (interior walls intentionally skipped)
      } else if (head.x < 0 || head.x >= SNAKE_COLS || head.y < 0 || head.y >= SNAKE_ROWS || isSnakeWall(head.x, head.y)) {
        if (snakeScore > snakeHi) { snakeHi = snakeScore; saveSnakeHi(); }
        state = 'snakeDead';
        triggerShake(8, 18);
        return;
      }
      // self collision
      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          if (snakeScore > snakeHi) { snakeHi = snakeScore; saveSnakeHi(); }
          state = 'snakeDead';
          triggerShake(8, 18);
          return;
        }
      }
      snake.unshift(head);
      // Coin pickup (doesn't grow snake)
      for (let i = snakeCoins.length - 1; i >= 0; i--) {
        if (snakeCoins[i].x === head.x && snakeCoins[i].y === head.y) {
          snakeCoins.splice(i, 1);
          coinBank += 1; saveCoinBank();
          spawnParticles(head.x * SNAKE_CELL + SNAKE_CELL / 2,
                         head.y * SNAKE_CELL + SNAKE_CELL / 2 + 24, '#ffe066', 10);
          break;
        }
      }
      // Diamond pickup
      for (let i = snakeDiamonds.length - 1; i >= 0; i--) {
        if (snakeDiamonds[i].x === head.x && snakeDiamonds[i].y === head.y) {
          snakeDiamonds.splice(i, 1);
          totalDiamonds += 1; saveDiamonds();
          spawnParticles(head.x * SNAKE_CELL + SNAKE_CELL / 2,
                         head.y * SNAKE_CELL + SNAKE_CELL / 2 + 24, '#40c9a2', 14);
          break;
        }
      }
      // Food (grows snake + may seed new pickups)
      if (snakeFood && head.x === snakeFood.x && head.y === snakeFood.y) {
        snakeScore++;
        if (snakeScore % 8 === 0 && snakeTickRate > 6) snakeTickRate--;
        spawnSnakeFood();
        spawnParticles(snakeFood.x * SNAKE_CELL + SNAKE_CELL / 2,
                       snakeFood.y * SNAKE_CELL + SNAKE_CELL / 2 + 24, '#e94560', 10);
        if (snakeCoins.length < 3 && Math.random() < 0.55) spawnSnakeCoin();
        if (snakeDiamonds.length < 1 && Math.random() < 0.12) spawnSnakeDiamond();
      } else {
        snake.pop();
      }
    }
    function drawSnake() {
      // background
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0, 0, W, H);
      // slow-mo blue tint
      if (snakeSlowTimer > 0) {
        ctx.fillStyle = 'rgba(126,232,250,0.08)';
        ctx.fillRect(0, 0, W, H);
      }
      // grid (subtle)
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= SNAKE_COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * SNAKE_CELL, 24); ctx.lineTo(x * SNAKE_CELL, 24 + SNAKE_ROWS * SNAKE_CELL); ctx.stroke();
      }
      for (let y = 0; y <= SNAKE_ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, 24 + y * SNAKE_CELL); ctx.lineTo(W, 24 + y * SNAKE_CELL); ctx.stroke();
      }
      // border
      ctx.strokeStyle = '#40c9a2'; ctx.lineWidth = 2;
      ctx.strokeRect(1, 25, W - 2, SNAKE_ROWS * SNAKE_CELL - 2);
      // interior walls
      for (const w of SNAKE_WALLS) {
        const wx = w.x * SNAKE_CELL;
        const wy = w.y * SNAKE_CELL + 24;
        ctx.fillStyle = '#5a4a2a';
        ctx.fillRect(wx + 1, wy + 1, SNAKE_CELL - 2, SNAKE_CELL - 2);
        ctx.fillStyle = '#8a7a4a';
        ctx.fillRect(wx + 2, wy + 2, SNAKE_CELL - 6, 3);
        ctx.fillStyle = '#3a2e1a';
        ctx.fillRect(wx + 2, wy + SNAKE_CELL - 5, SNAKE_CELL - 4, 2);
      }
      // coins
      for (const c of snakeCoins) {
        const cx = c.x * SNAKE_CELL + SNAKE_CELL / 2;
        const cy = c.y * SNAKE_CELL + 24 + SNAKE_CELL / 2;
        const r = SNAKE_CELL / 2 - 4 + Math.sin(frame * 0.12 + c.x) * 0.6;
        ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 8;
        ctx.fillStyle = '#ffe066';
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#b8932a';
        ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
      // diamonds
      for (const d of snakeDiamonds) {
        const dx = d.x * SNAKE_CELL + SNAKE_CELL / 2;
        const dy = d.y * SNAKE_CELL + 24 + SNAKE_CELL / 2;
        const r = SNAKE_CELL / 2 - 3;
        ctx.save();
        ctx.translate(dx, dy);
        ctx.rotate(frame * 0.05);
        ctx.shadowColor = '#40c9a2'; ctx.shadowBlur = 10;
        ctx.fillStyle = '#7df0c8';
        ctx.beginPath();
        ctx.moveTo(0, -r); ctx.lineTo(r * 0.85, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.85, 0);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.6); ctx.lineTo(r * 0.3, -r * 0.1); ctx.lineTo(-r * 0.2, -r * 0.1);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      // food
      if (snakeFood) {
        const fx = snakeFood.x * SNAKE_CELL + SNAKE_CELL / 2;
        const fy = snakeFood.y * SNAKE_CELL + 24 + SNAKE_CELL / 2;
        ctx.shadowColor = '#e94560'; ctx.shadowBlur = 10;
        ctx.fillStyle = '#e94560';
        ctx.beginPath(); ctx.arc(fx, fy, SNAKE_CELL / 2 - 3, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
      // snake
      const wallhackOn = snakeWallhackTimer > 0;
      const wallhackPulse = wallhackOn ? 0.6 + Math.sin(frame * 0.2) * 0.3 : 0;
      for (let i = 0; i < snake.length; i++) {
        const s = snake[i];
        const sx = s.x * SNAKE_CELL;
        const sy = s.y * SNAKE_CELL + 24;
        if (i === 0) {
          ctx.fillStyle = wallhackOn ? '#e0c0ff' : '#7ee8fa';
          ctx.shadowColor = wallhackOn ? '#c08aff' : '#7ee8fa';
          ctx.shadowBlur = wallhackOn ? 12 + wallhackPulse * 6 : 8;
        } else {
          if (wallhackOn) {
            const t = i / snake.length;
            ctx.fillStyle = `hsl(${280 - t * 20}, 65%, ${60 - t * 15}%)`;
            ctx.shadowColor = '#c08aff'; ctx.shadowBlur = 6 + wallhackPulse * 3;
          } else {
            const t = i / snake.length;
            ctx.fillStyle = `hsl(${170 - t * 30}, 70%, ${55 - t * 20}%)`;
            ctx.shadowBlur = 0;
          }
        }
        ctx.globalAlpha = wallhackOn ? 0.7 + Math.sin(frame * 0.18 + i * 0.4) * 0.2 : 1;
        ctx.fillRect(sx + 1, sy + 1, SNAKE_CELL - 2, SNAKE_CELL - 2);
        ctx.globalAlpha = 1;
        if (i === 0) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#1a1a2e';
          const eyeSize = 3;
          const ex1 = sx + SNAKE_CELL / 2 + snakeDir.x * 4 - (snakeDir.x === 0 ? 4 : 0);
          const ey1 = sy + SNAKE_CELL / 2 + snakeDir.y * 4 - (snakeDir.y === 0 ? 4 : 0);
          const ex2 = sx + SNAKE_CELL / 2 + snakeDir.x * 4 + (snakeDir.x === 0 ? 4 : 0);
          const ey2 = sy + SNAKE_CELL / 2 + snakeDir.y * 4 + (snakeDir.y === 0 ? 4 : 0);
          ctx.fillRect(ex1 - eyeSize / 2, ey1 - eyeSize / 2, eyeSize, eyeSize);
          ctx.fillRect(ex2 - eyeSize / 2, ey2 - eyeSize / 2, eyeSize, eyeSize);
        }
      }
      ctx.shadowBlur = 0;
      // HUD — HOME button (top-left)
      const homeR = snakeHomeBtnRect();
      ctx.fillStyle = 'rgba(126,232,250,0.10)';
      roundRect(homeR.x, homeR.y, homeR.w, homeR.h, 3); ctx.fill();
      ctx.strokeStyle = '#7ee8fa'; ctx.lineWidth = 1;
      roundRect(homeR.x, homeR.y, homeR.w, homeR.h, 3); ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#7ee8fa'; ctx.font = 'bold 11px Courier New';
      ctx.fillText('← HOME', homeR.x + homeR.w / 2, homeR.y + homeR.h / 2);
      // Bank stacked next to HOME
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.font = 'bold 11px Courier New';
      ctx.fillStyle = '#ffe066';
      ctx.fillText('● ' + coinBank, 70, 3);
      ctx.fillStyle = '#40c9a2';
      ctx.fillText('◆ ' + totalDiamonds, 70, 14);
      // Score
      ctx.fillStyle = '#7ee8fa'; ctx.font = 'bold 14px Courier New';
      ctx.fillText('SCORE: ' + snakeScore, 140, 6);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#f5a623'; ctx.font = 'bold 14px Courier New';
      ctx.fillText('BEST: ' + snakeHi, W - 8, 6);
      // Powerup buttons (center of HUD)
      if (snakeStarted && state === 'snake') {
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        const r1 = snakeSlowBtnRect();
        const slowOk = canAffordArcadeCoin(SNAKE_SLOW_COST);
        const slowActive = snakeSlowTimer > 0;
        ctx.fillStyle = slowActive ? 'rgba(126,232,250,0.35)' : (slowOk ? 'rgba(126,232,250,0.10)' : 'rgba(60,60,60,0.20)');
        roundRect(r1.x, r1.y, r1.w, r1.h, 3); ctx.fill();
        ctx.strokeStyle = slowOk ? '#7ee8fa' : '#444'; ctx.lineWidth = 1;
        roundRect(r1.x, r1.y, r1.w, r1.h, 3); ctx.stroke();
        ctx.fillStyle = slowOk ? '#7ee8fa' : '#666';
        ctx.font = 'bold 10px Courier New';
        ctx.fillText('[1] SLOW ●' + SNAKE_SLOW_COST, r1.x + r1.w / 2, r1.y + r1.h / 2);

        const r2 = snakeShrinkBtnRect();
        const wallOk = canAffordArcadeCoin(SNAKE_WALLHACK_COST);
        const wallActive = snakeWallhackTimer > 0;
        ctx.fillStyle = wallActive ? 'rgba(192,138,255,0.40)' : (wallOk ? 'rgba(192,138,255,0.10)' : 'rgba(60,60,60,0.20)');
        roundRect(r2.x, r2.y, r2.w, r2.h, 3); ctx.fill();
        ctx.strokeStyle = wallOk || wallActive ? '#c08aff' : '#444';
        roundRect(r2.x, r2.y, r2.w, r2.h, 3); ctx.stroke();
        ctx.fillStyle = wallOk || wallActive ? '#c08aff' : '#666';
        ctx.fillText('[2] WALLHACK ●' + SNAKE_WALLHACK_COST, r2.x + r2.w / 2, r2.y + r2.h / 2);
      }
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      // overlays
      if (!snakeStarted && state === 'snake') {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#7ee8fa'; ctx.font = 'bold 36px Courier New';
        ctx.fillText('SNAKE', W / 2, H / 2 - 30);
        ctx.fillStyle = '#aaa'; ctx.font = '15px Courier New';
        ctx.fillText(isTouchDevice ? 'SWIPE to move' : 'ARROW KEYS / WASD to move', W / 2, H / 2 + 2);
        ctx.fillStyle = '#7ee8fa'; ctx.font = '14px Courier New';
        ctx.fillText(isTouchDevice ? 'TAP to start' : 'PRESS A KEY to start', W / 2, H / 2 + 28);
        ctx.fillStyle = '#555'; ctx.font = '12px Courier New';
        ctx.fillText('ESC / H — back to home', W / 2, H - 14);
        ctx.textAlign = 'left';
      }
      if (state === 'snakeDead') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#e94560'; ctx.font = 'bold 40px Courier New';
        ctx.shadowColor = '#e94560'; ctx.shadowBlur = 14;
        ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff'; ctx.font = '16px Courier New';
        ctx.fillText('Score: ' + snakeScore + '   Best: ' + snakeHi, W / 2, H / 2 - 8);
        // Revive (pay with diamonds OR coins)
        const reviveOk = canArcadeRevive();
        ctx.fillStyle = reviveOk ? '#7ee8fa' : '#555';
        ctx.font = 'bold 15px Courier New';
        ctx.fillText((isTouchDevice ? 'TAP HERE — REVIVE ' : 'R — REVIVE ')
                     + '◆ ' + ARCADE_REVIVE_COST + ' / ● ' + ARCADE_REVIVE_COIN_COST, W / 2, H / 2 + 18);
        ctx.fillStyle = '#aaa'; ctx.font = '13px Courier New';
        ctx.fillText(isTouchDevice ? 'TAP to play again' : 'SPACE — play again', W / 2, H / 2 + 42);
        ctx.fillStyle = '#aaa';
        ctx.fillText(isTouchDevice ? 'TAP bottom to go home' : 'ESC / H — back to home', W / 2, H - 14);
        ctx.textAlign = 'left';
      }
    }

    // ---- Flappy bird ----
    function resetFlappy() {
      flappyBird = { x: 200, y: H / 2, vy: 0, w: 28, h: 22, rot: 0 };
      flappyPipes = [];
      flappyPickups = [];
      flappyScore = 0;
      flappyStarted = false;
      flappyDeadTimer = 0;
      flappyNextPipe = 80;
      flappySlowTimer = 0;
      flappyShield = false;
      flappyInvincTimer = 0;
    }
    function flapJump() {
      flappyBird.vy = -5.8;
      spawnParticles(flappyBird.x - 6, flappyBird.y + 8, '#ffe066', 4);
    }
    function updateFlappy() {
      if (state === 'flappyDead') {
        flappyDeadTimer++;
        flappyBird.vy += 0.5;
        flappyBird.y += flappyBird.vy;
        flappyBird.rot = Math.min(Math.PI / 2, flappyBird.rot + 0.08);
        if (flappyBird.y > H - 24) { flappyBird.y = H - 24; flappyBird.vy = 0; }
        return;
      }
      if (!flappyStarted) {
        // hover
        flappyBird.y = H / 2 + Math.sin(frame * 0.08) * 6;
        return;
      }
      if (flappySlowTimer > 0) flappySlowTimer--;
      if (flappyInvincTimer > 0) flappyInvincTimer--;
      const slowFactor = flappySlowTimer > 0 ? 0.5 : 1;
      flappyBird.vy += 0.36 * slowFactor;
      if (flappyBird.vy > 7.5) flappyBird.vy = 7.5;
      flappyBird.y += flappyBird.vy * slowFactor;
      flappyBird.rot = Math.max(-0.4, Math.min(1.2, flappyBird.vy * 0.08));
      // spawn pipes (rate also slowed when slow-mo is active)
      flappyNextPipe -= slowFactor;
      if (flappyNextPipe <= 0) {
        // Variable pipe sizes — roll for normal/wide gaps and thin/fat pipes (no super-tight pipes)
        const sizeRoll = Math.random();
        let gap, pw;
        if (sizeRoll < 0.25) {           // 25% — wide & thin (easy breather)
          gap = 150; pw = 38;
        } else if (sizeRoll < 0.40) {    // 15% — fat pipes (long tunnel, generous gap)
          gap = 130; pw = 64;
        } else {                          // 60% — standard but roomy
          gap = 125; pw = 46;
        }
        const minY = 40, maxY = H - 50 - gap;
        const gy = minY + Math.random() * (maxY - minY);
        flappyPipes.push({ x: W + 20, gy, gap, w: pw, passed: false });
        // Place a pickup in the gap centre: ~55% coin, ~12% diamond, ~33% nothing
        const pickRoll = Math.random();
        if (pickRoll < 0.55) {
          flappyPickups.push({ x: W + 20 + pw / 2, y: gy + gap / 2, type: 'coin', r: 9 });
        } else if (pickRoll < 0.67) {
          flappyPickups.push({ x: W + 20 + pw / 2, y: gy + gap / 2, type: 'diamond', r: 9 });
        }
        // Spawn distance scales with pipe width — extra room overall
        flappyNextPipe = 120 + Math.round(pw * 0.6);
      }
      const scrollSpd = 2.4 * slowFactor;
      // move pipes + score + collide
      for (let i = flappyPipes.length - 1; i >= 0; i--) {
        const p = flappyPipes[i];
        p.x -= scrollSpd;
        if (!p.passed && p.x + p.w < flappyBird.x) {
          p.passed = true;
          flappyScore++;
          spawnFloatText(flappyBird.x, flappyBird.y - 20, '+1', '#ffe066');
        }
        if (p.x + p.w < -20) flappyPipes.splice(i, 1);
      }
      // pickups: scroll + collect
      for (let i = flappyPickups.length - 1; i >= 0; i--) {
        const pk = flappyPickups[i];
        pk.x -= scrollSpd;
        const dx = flappyBird.x - pk.x;
        const dy = flappyBird.y - pk.y;
        if (Math.sqrt(dx * dx + dy * dy) < pk.r + 12) {
          if (pk.type === 'coin') {
            coinBank += 1; saveCoinBank();
            spawnFloatText(pk.x, pk.y - 12, '+1●', '#ffe066');
            spawnParticles(pk.x, pk.y, '#ffe066', 10);
          } else {
            totalDiamonds += 1; saveDiamonds();
            spawnFloatText(pk.x, pk.y - 12, '+1◆', '#40c9a2');
            spawnParticles(pk.x, pk.y, '#40c9a2', 14);
          }
          flappyPickups.splice(i, 1);
          continue;
        }
        if (pk.x < -20) flappyPickups.splice(i, 1);
      }
      // collisions (hitbox is slightly smaller than the visual sprite for lenience)
      const hbW = flappyBird.w - 8;
      const hbH = flappyBird.h - 6;
      const bx = flappyBird.x - hbW / 2;
      const by = flappyBird.y - hbH / 2;
      let hit = false;
      if (by < 0 || by + hbH > H - 8) hit = true;
      for (const p of flappyPipes) {
        if (bx + hbW > p.x && bx < p.x + p.w) {
          if (by < p.gy || by + hbH > p.gy + p.gap) { hit = true; break; }
        }
      }
      if (hit && flappyInvincTimer <= 0) {
        if (flappyShield) {
          flappyShield = false;
          flappyInvincTimer = 60;
          // clear pipes within bird's vicinity so revive isn't instant re-death
          flappyPipes = flappyPipes.filter(p => p.x + p.w < flappyBird.x - 30 || p.x > flappyBird.x + 80);
          spawnParticles(flappyBird.x, flappyBird.y, '#7ee8fa', 28);
          spawnFloatText(flappyBird.x, flappyBird.y - 24, 'BLOCKED!', '#7ee8fa');
          triggerShake(6, 12);
        } else {
          if (flappyScore > flappyHi) { flappyHi = flappyScore; saveFlappyHi(); }
          state = 'flappyDead';
          flappyDeadTimer = 0;
          triggerShake(10, 22);
          spawnParticles(flappyBird.x, flappyBird.y, '#ffe066', 18);
        }
      }
    }
    function drawFlappy() {
      // sky gradient
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#4ec0e8');
      g.addColorStop(1, '#8ed8f0');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      // background hills
      ctx.fillStyle = '#1a8a3a';
      for (let i = 0; i < 5; i++) {
        const hx = ((i * 220) - (frame * 0.3) % 220);
        ctx.beginPath();
        ctx.ellipse(hx, H - 8, 130, 50, 0, Math.PI, 0);
        ctx.fill();
      }
      // ground strip
      ctx.fillStyle = '#3a8a3a';
      ctx.fillRect(0, H - 8, W, 8);
      ctx.fillStyle = '#256a25';
      for (let x = -(frame * 3 % 16); x < W; x += 16) ctx.fillRect(x, H - 8, 8, 2);
      // pipes
      for (const p of flappyPipes) {
        ctx.fillStyle = '#5fbf5f';
        ctx.fillRect(p.x, 0, p.w, p.gy);
        ctx.fillRect(p.x, p.gy + p.gap, p.w, H - p.gy - p.gap - 8);
        // pipe rims
        ctx.fillStyle = '#3f8f3f';
        ctx.fillRect(p.x - 4, p.gy - 14, p.w + 8, 14);
        ctx.fillRect(p.x - 4, p.gy + p.gap, p.w + 8, 14);
        // highlight
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fillRect(p.x + 4, 0, 4, p.gy - 14);
        ctx.fillRect(p.x + 4, p.gy + p.gap + 14, 4, H - p.gy - p.gap - 22);
      }
      // pickups (drawn behind bird)
      for (const pk of flappyPickups) {
        if (pk.type === 'coin') {
          const r = pk.r + Math.sin(frame * 0.14 + pk.x * 0.02) * 1;
          ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 8;
          ctx.fillStyle = '#ffe066';
          ctx.beginPath(); ctx.arc(pk.x, pk.y, r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#b8932a';
          ctx.beginPath(); ctx.arc(pk.x, pk.y, r * 0.55, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(pk.x - 2, pk.y - 2, 1.5, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.save();
          ctx.translate(pk.x, pk.y);
          ctx.rotate(frame * 0.06);
          ctx.shadowColor = '#40c9a2'; ctx.shadowBlur = 10;
          ctx.fillStyle = '#7df0c8';
          ctx.beginPath();
          ctx.moveTo(0, -pk.r); ctx.lineTo(pk.r * 0.85, 0); ctx.lineTo(0, pk.r); ctx.lineTo(-pk.r * 0.85, 0);
          ctx.closePath(); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(0, -pk.r * 0.6); ctx.lineTo(pk.r * 0.3, -pk.r * 0.1); ctx.lineTo(-pk.r * 0.2, -pk.r * 0.1);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }
      // shield aura behind bird
      if (flappyShield || flappyInvincTimer > 0) {
        const auraAlpha = flappyShield ? 0.7 : 0.3 + Math.sin(frame * 0.3) * 0.2;
        ctx.fillStyle = `rgba(126,232,250,${auraAlpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(flappyBird.x, flappyBird.y, 22 + Math.sin(frame * 0.15) * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(126,232,250,${auraAlpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(flappyBird.x, flappyBird.y, 22 + Math.sin(frame * 0.15) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
      // bird
      ctx.save();
      ctx.translate(flappyBird.x, flappyBird.y);
      ctx.rotate(flappyBird.rot);
      // body
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.ellipse(0, 0, flappyBird.w / 2, flappyBird.h / 2, 0, 0, Math.PI * 2); ctx.fill();
      // wing
      ctx.fillStyle = '#f5a623';
      const wingY = Math.sin(frame * 0.35) * 3;
      ctx.beginPath(); ctx.ellipse(-3, 2 + wingY, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
      // eye
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(7, -3, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(8, -3, 2, 0, Math.PI * 2); ctx.fill();
      // beak
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.moveTo(12, 0); ctx.lineTo(20, -2); ctx.lineTo(20, 3); ctx.closePath(); ctx.fill();
      ctx.restore();
      // HUD HOME button (top-left)
      {
        const homeR = flappyHomeBtnRect();
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        roundRect(homeR.x, homeR.y, homeR.w, homeR.h, 3); ctx.fill();
        ctx.strokeStyle = '#7ee8fa'; ctx.lineWidth = 1;
        roundRect(homeR.x, homeR.y, homeR.w, homeR.h, 3); ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#7ee8fa'; ctx.font = 'bold 11px Courier New';
        ctx.fillText('← HOME', homeR.x + homeR.w / 2, homeR.y + homeR.h / 2);
      }
      // HUD score
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
      ctx.font = 'bold 32px Courier New';
      ctx.fillText(String(flappyScore), W / 2, 16);
      ctx.shadowBlur = 0;
      // Powerup buttons (top corners during play)
      if (flappyStarted && state === 'flappy') {
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        const r1 = flappySlowBtnRect();
        const slowOk = canAffordArcadeCoin(FLAPPY_SLOW_COST);
        const slowActive = flappySlowTimer > 0;
        ctx.fillStyle = slowActive ? 'rgba(126,232,250,0.45)' : (slowOk ? 'rgba(255,255,255,0.18)' : 'rgba(60,60,60,0.30)');
        roundRect(r1.x, r1.y, r1.w, r1.h, 3); ctx.fill();
        ctx.strokeStyle = slowOk ? '#7ee8fa' : '#444'; ctx.lineWidth = 1;
        roundRect(r1.x, r1.y, r1.w, r1.h, 3); ctx.stroke();
        ctx.fillStyle = slowOk ? '#0a3050' : '#666';
        ctx.font = 'bold 10px Courier New';
        ctx.fillText('[1] SLOW ●' + FLAPPY_SLOW_COST, r1.x + r1.w / 2, r1.y + r1.h / 2);

        const r2 = flappyShieldBtnRect();
        const shieldOk = canAffordArcadeCoin(FLAPPY_SHIELD_COST) && !flappyShield;
        ctx.fillStyle = flappyShield ? 'rgba(126,232,250,0.55)' : (shieldOk ? 'rgba(255,255,255,0.18)' : 'rgba(60,60,60,0.30)');
        roundRect(r2.x, r2.y, r2.w, r2.h, 3); ctx.fill();
        ctx.strokeStyle = shieldOk ? '#7ee8fa' : (flappyShield ? '#7ee8fa' : '#444');
        roundRect(r2.x, r2.y, r2.w, r2.h, 3); ctx.stroke();
        ctx.fillStyle = flappyShield ? '#fff' : (shieldOk ? '#0a3050' : '#666');
        ctx.fillText(flappyShield ? '[2] ARMED' : '[2] SHIELD ●' + FLAPPY_SHIELD_COST, r2.x + r2.w / 2, r2.y + r2.h / 2);
      }
      // Coin + diamond bank (small, under the slow button — visible during play)
      if (state === 'flappy') {
        ctx.textBaseline = 'top'; ctx.textAlign = 'left';
        ctx.font = 'bold 12px Courier New';
        ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
        ctx.fillStyle = '#ffe066';
        ctx.fillText('● ' + coinBank, 12, 30);
        ctx.fillStyle = '#7df0c8';
        ctx.fillText('◆ ' + totalDiamonds, 70, 30);
        ctx.shadowBlur = 0;
      }
      ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
      // overlays
      if (!flappyStarted && state === 'flappy') {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffe066'; ctx.font = 'bold 36px Courier New';
        ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
        ctx.fillText('FLAPPY BIRD', W / 2, H / 2 - 30);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff'; ctx.font = '15px Courier New';
        ctx.fillText(isTouchDevice ? 'TAP to flap' : 'SPACE / UP to flap', W / 2, H / 2 + 2);
        ctx.fillStyle = '#ffe066'; ctx.font = '14px Courier New';
        ctx.fillText(isTouchDevice ? 'TAP to start' : 'PRESS SPACE to start', W / 2, H / 2 + 28);
        ctx.fillStyle = '#eef'; ctx.font = '12px Courier New';
        ctx.fillText('BEST: ' + flappyHi, W / 2, H / 2 + 56);
        ctx.fillStyle = '#ccc';
        ctx.fillText('ESC / H — back to home', W / 2, H - 14);
        ctx.textAlign = 'left';
      }
      if (state === 'flappyDead') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#e94560'; ctx.font = 'bold 40px Courier New';
        ctx.shadowColor = '#e94560'; ctx.shadowBlur = 14;
        ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff'; ctx.font = '16px Courier New';
        ctx.fillText('Score: ' + flappyScore + '   Best: ' + flappyHi, W / 2, H / 2 - 8);
        const reviveOk = canArcadeRevive();
        ctx.fillStyle = reviveOk ? '#7ee8fa' : '#555';
        ctx.font = 'bold 15px Courier New';
        ctx.fillText((isTouchDevice ? 'TAP HERE — REVIVE ' : 'R — REVIVE ')
                     + '◆ ' + ARCADE_REVIVE_COST + ' / ● ' + ARCADE_REVIVE_COIN_COST, W / 2, H / 2 + 18);
        ctx.fillStyle = '#ffe066'; ctx.font = '13px Courier New';
        ctx.fillText(isTouchDevice ? 'TAP to play again' : 'SPACE — play again', W / 2, H / 2 + 42);
        ctx.fillStyle = '#aaa';
        ctx.fillText(isTouchDevice ? 'TAP bottom to go home' : 'ESC / H — back to home', W / 2, H - 14);
        ctx.textAlign = 'left';
      }
    }

    // ---- Home menu ----
    const HOME_CARDS = [
      { id: 'runner',  label: 'RUNNER',      color: '#e94560', sub: 'endless arcade' },
      { id: 'snake',   label: 'SNAKE',       color: '#40c9a2', sub: 'eat & grow' },
      { id: 'flappy',  label: 'FLAPPY BIRD', color: '#ffe066', sub: 'tap to fly' },
    ];
    function homeCardRect(i) {
      const cardW = 200, cardH = 150, gap = 24;
      const total = 3 * cardW + 2 * gap;
      const startX = (W - total) / 2;
      const y = H / 2 - cardH / 2 + 14;
      return { x: startX + i * (cardW + gap), y, w: cardW, h: cardH };
    }
    function homeHitTest(cx, cy) {
      for (let i = 0; i < HOME_CARDS.length; i++) {
        const r = homeCardRect(i);
        if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) return i;
      }
      return -1;
    }
    function pickHomeCard(i) {
      const c = HOME_CARDS[i];
      if (!c) return;
      if (c.id === 'runner') { state = 'start'; }
      else if (c.id === 'snake') { resetSnake(); state = 'snake'; }
      else if (c.id === 'flappy') { resetFlappy(); state = 'flappy'; }
    }
    // ---- Online players overlay (rendered on every page when presence is enabled) ----
    function drawOnlinePanel() {
      if (!presenceEnabled) return;
      ctx.save();
      ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
      // Push panel down in arcade games so it doesn't clash with the top-right HUD elements
      const isArcade = state === 'snake' || state === 'snakeDead' || state === 'flappy' || state === 'flappyDead';
      const yOff = isArcade ? 30 : 0;
      const maxShow = 6;
      const rows = Math.min(onlinePlayers.length, maxShow) + (onlinePlayers.length > maxShow ? 1 : 0);
      const panelH = 18 + Math.max(0, rows) * 14 + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.40)';
      roundRect(W - 168, 4 + yOff, 160, panelH, 5); ctx.fill();
      ctx.fillStyle = '#7ee8fa';
      ctx.font = 'bold 12px Courier New';
      ctx.fillText('ONLINE: ' + onlinePlayers.length, W - 12, 18 + yOff);
      ctx.font = '11px Courier New';
      for (let i = 0; i < Math.min(onlinePlayers.length, maxShow); i++) {
        const p = onlinePlayers[i];
        const isMe = p.id === playerId;
        ctx.fillStyle = isMe ? '#ffe066' : '#cfe9f5';
        ctx.fillText('• ' + p.name + (isMe ? ' (you)' : ''), W - 12, 34 + yOff + i * 14);
      }
      if (onlinePlayers.length > maxShow) {
        ctx.fillStyle = '#888';
        ctx.fillText('+' + (onlinePlayers.length - maxShow) + ' more', W - 12, 34 + yOff + maxShow * 14);
      }
      ctx.restore();
    }

    function homeProfileBtnRect() { return { x: 8, y: 8, w: 220, h: 26 }; }
    function drawHome() {
      // background gradient
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0f0e17');
      g.addColorStop(1, '#1a1a2e');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // stars
      for (const s of stars) {
        ctx.fillStyle = `rgba(200,220,255,${0.3 + Math.sin(frame * 0.02 + s.x) * 0.2})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      // profile button (top-left)
      const pr = homeProfileBtnRect();
      ctx.fillStyle = 'rgba(126,232,250,0.10)';
      roundRect(pr.x, pr.y, pr.w, pr.h, 5); ctx.fill();
      ctx.strokeStyle = '#7ee8fa'; ctx.lineWidth = 1;
      roundRect(pr.x, pr.y, pr.w, pr.h, 5); ctx.stroke();
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 12px Courier New';
      ctx.fillStyle = '#7ee8fa';
      ctx.fillText('PROFILE:', pr.x + 8, pr.y + pr.h / 2);
      ctx.fillStyle = '#ffe066';
      ctx.fillText(currentProfile, pr.x + 78, pr.y + pr.h / 2);
      ctx.fillStyle = '#aaa'; ctx.font = '11px Courier New';
      ctx.fillText(isTouchDevice ? '[TAP TO CHANGE]' : '[N]', pr.x + pr.w - 8 - ctx.measureText(isTouchDevice ? '[TAP TO CHANGE]' : '[N]').width, pr.y + pr.h / 2);
      ctx.textBaseline = 'alphabetic';
      // title
      ctx.textAlign = 'center';
      ctx.shadowColor = '#7ee8fa'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 36px Courier New';
      ctx.fillText('ARCADE', W / 2, 50);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#aaa'; ctx.font = '13px Courier New';
      ctx.fillText(isTouchDevice ? 'TAP a game to play' : 'CLICK or press 1/2/3 to play', W / 2, 72);
      // cards
      for (let i = 0; i < HOME_CARDS.length; i++) {
        const c = HOME_CARDS[i];
        const r = homeCardRect(i);
        // card bg
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill();
        ctx.strokeStyle = c.color; ctx.lineWidth = 2;
        roundRect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
        // mini preview
        ctx.save();
        ctx.translate(r.x + r.w / 2, r.y + 50);
        if (c.id === 'runner') {
          // little running figure
          const sk = getSkin();
          ctx.fillStyle = sk.body;
          ctx.fillRect(-10, -16, 20, 24);
          ctx.fillStyle = sk.visorBg;
          ctx.fillRect(-7, -12, 14, 8);
          ctx.fillStyle = sk.visor;
          ctx.fillRect(-5, -10, 10, 4);
          ctx.fillStyle = sk.legs;
          const legSwing = Math.sin(frame * 0.2) * 4;
          ctx.fillRect(-8, 8, 5, 10 + legSwing);
          ctx.fillRect(3, 8, 5, 10 - legSwing);
        } else if (c.id === 'snake') {
          // mini snake
          const seg = 8;
          for (let k = 0; k < 6; k++) {
            const t = k / 6;
            ctx.fillStyle = k === 0 ? '#7ee8fa' : `hsl(${170 - t * 30}, 70%, ${55 - t * 20}%)`;
            ctx.fillRect(-22 + k * seg, -seg / 2, seg - 1, seg - 1);
          }
          ctx.fillStyle = '#e94560';
          ctx.beginPath(); ctx.arc(22, 0, 4, 0, Math.PI * 2); ctx.fill();
        } else if (c.id === 'flappy') {
          // mini bird with wing flap
          const wingY = Math.sin(frame * 0.25) * 3;
          ctx.fillStyle = '#ffe066';
          ctx.beginPath(); ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#f5a623';
          ctx.beginPath(); ctx.ellipse(-3, 2 + wingY, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(5, -2, 3, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#1a1a2e';
          ctx.beginPath(); ctx.arc(6, -2, 1.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#e94560';
          ctx.beginPath();
          ctx.moveTo(9, 0); ctx.lineTo(16, -1); ctx.lineTo(16, 2); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
        // label
        ctx.fillStyle = c.color; ctx.font = 'bold 18px Courier New';
        ctx.fillText(c.label, r.x + r.w / 2, r.y + r.h - 38);
        ctx.fillStyle = '#888'; ctx.font = '11px Courier New';
        ctx.fillText(c.sub, r.x + r.w / 2, r.y + r.h - 22);
        // best
        let best = 0;
        if (c.id === 'runner') best = hiScore;
        else if (c.id === 'snake') best = snakeHi;
        else if (c.id === 'flappy') best = flappyHi;
        ctx.fillStyle = '#f5a623'; ctx.font = '11px Courier New';
        ctx.fillText('BEST: ' + best, r.x + r.w / 2, r.y + r.h - 8);
        // hotkey badge (desktop)
        if (!isTouchDevice) {
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          roundRect(r.x + r.w - 28, r.y + 8, 20, 20, 4); ctx.fill();
          ctx.fillStyle = '#eee'; ctx.font = 'bold 12px Courier New';
          ctx.fillText(String(i + 1), r.x + r.w - 18, r.y + 22);
        }
      }
      ctx.textAlign = 'left';
    }

    function update() {
      // Home: passive animation only
      if (state === 'home') {
        frame++;
        for (const s of stars) {
          s.x -= s.s * 0.4;
          if (s.x < 0) s.x = W;
        }
        if (screenShake > 0) { screenShake--; if (screenShake === 0) shakeMag = 0; }
        return;
      }
      // Snake
      if (state === 'snake' || state === 'snakeDead') {
        frame++;
        updateSnake();
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= p.decay;
          if (p.life <= 0) particles.splice(i, 1);
        }
        if (screenShake > 0) { screenShake--; if (screenShake === 0) shakeMag = 0; }
        return;
      }
      // Flappy
      if (state === 'flappy' || state === 'flappyDead') {
        frame++;
        updateFlappy();
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= p.decay;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.life -= 0.018; ft.y += ft.vy;
          if (ft.life <= 0) floatingTexts.splice(i, 1);
        }
        if (screenShake > 0) { screenShake--; if (screenShake === 0) shakeMag = 0; }
        return;
      }
      // Level-up transition
      if (state === 'levelup') {
        frame++;
        levelUpTimer--;
        const progress = (130 - levelUpTimer) / 130;
        // Player runs toward portal (starts at progress 0.22, enters at 0.58)
        const PORTAL_TARGET = 520;
        const runFrames = Math.round(130 * (0.58 - 0.22)); // frames available to reach portal
        const runSpeed = Math.max(1, (PORTAL_TARGET - 100) / runFrames); // px per frame to hit portal
        if (progress < 0.22) {
          player.legPhase += runSpeed * 0.12;
        } else if (progress < 0.58) {
          player.x += runSpeed;
          player.legPhase += runSpeed * 0.16;
        }
        // Background scrolls gently
        for (const s of stars) { s.x -= s.s * 1.5; if (s.x < 0) s.x = W; }
        updateAmbient();
        for (let i = 0; i < groundTiles.length; i++) {
          groundTiles[i] -= speed * 0.6;
          if (groundTiles[i] + 40 < 0) groundTiles[i] += groundTiles.length * 40;
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= p.decay;
          if (p.life <= 0) particles.splice(i, 1);
        }
        if (levelUpTimer <= 0) {
          level++;
          player.x = 100;
          obstacles = [];
          coins = [];
          diamonds = [];
          if (level > LEVEL_THEMES.length) {
            // Boss level after final stage
            initBoss();
            invincible = 60;
            state = 'boss';
          } else {
            nextLevelScore = score + 5000;
            levelStartScore = score;
            levelDiamondsSpawned = 0;
            invincible = 90;
            initAmbient();
            state = 'running';
          }
        }
        return;
      }

      // Always update diamond display (persistent currency)
      diamondEl.textContent = '\u25C6 ' + totalDiamonds;

      if (state === 'wheel') {
        if (wheelSpinning) {
          wheelSpinFrame++;
          const t = Math.min(1, wheelSpinFrame / wheelSpinDuration);
          const eased = 1 - Math.pow(1 - t, 3);
          wheelAngle = wheelStartAngle + (wheelTargetAngle - wheelStartAngle) * eased;
          if (t >= 1) finishWheelSpin();
        } else if (wheelResultShown > 0) {
          wheelResultShown++;
        } else {
          wheelAngle += 0.004;
        }
        return;
      }

      if (state !== 'running' && state !== 'boss') {
        // Keep visual effects (shake fade-out) alive even after death/victory
        if (screenShake > 0) { screenShake--; if (screenShake === 0) shakeMag = 0; }
        return;
      }

      frame++;
      if (!(state === 'boss' && boss && boss.defeated)) score++;
      // Base speed scales with level + gradual increase within level (plateaus after level 4)
      const levelSpeed = Math.min((level - 1) * 2.0, 8);
      speed = 5 + levelSpeed + (score % 5000) / 750;
      // Slow down during boss defeat
      if (state === 'boss' && boss && boss.defeated) speed *= Math.max(0, 1 - boss.deathTimer / 120);

      // Invincibility countdown
      if (invincible > 0) invincible--;
      if (thorrenHammerCooldown > 0) thorrenHammerCooldown--;
      if (thorrenHammerSwingTimer > 0) thorrenHammerSwingTimer--;
      if (screenShake > 0) { screenShake--; if (screenShake === 0) shakeMag = 0; }

      // Slide timer
      if (player.sliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) endSlide();
      }

      // Player physics (no gravity/jump while sliding on ground)
      if (!player.sliding) {
        const prevFoot = player.y + player.h;
        player.vy += 0.6;
        player.y += player.vy;
        const foot = player.y + player.h;
        let landedOnPlatform = false;

        // Platform landing (only when falling)
        if (player.vy >= 0) {
          for (const p of platforms) {
            const overlapX = player.x + player.w > p.x + 2 && player.x < p.x + p.w - 2;
            if (overlapX && prevFoot <= p.y + 1 && foot >= p.y) {
              player.y = p.y - player.h;
              player.vy = 0;
              player.onGround = true;
              player.jumpsLeft = upgrades.tripleJump ? 3 : 2;
              if (player.diving) {
                player.diving = false;
                spawnParticles(player.x + player.w / 2, p.y, '#40c060', 10);
              }
              landedOnPlatform = true;
              break;
            }
          }
        }

        if (!landedOnPlatform) {
          const groundY = GROUND;
          if (player.y >= groundY) {
            player.y = groundY;
            player.vy = 0;
            player.onGround = true;
            player.jumpsLeft = upgrades.tripleJump ? 3 : 2;
            // Dive landing impact
            if (player.diving) {
              player.diving = false;
              spawnParticles(player.x + player.w / 2, FLOOR, getSkin().ground, 10);
            }
          } else {
            player.onGround = false;
          }
        }
      }

      // Leg / dust animation
      if (player.onGround && !player.sliding) {
        player.legPhase += speed * 0.12;
        if (frame % 3 === 0) spawnDustParticle();
      } else if (player.sliding) {
        if (frame % 4 === 0) spawnDustParticle();
      }

      // Trail effect
      if (upgrades.trail && frame % 2 === 0) {
        const sk = getSkin();
        particles.push({
          x: player.x + 2,
          y: player.y + player.h * 0.3 + Math.random() * player.h * 0.4,
          vx: -speed * 0.5 - Math.random() * 2,
          vy: (Math.random() - 0.5) * 1.5,
          life: 1, decay: 0.04,
          r: Math.random() * 3 + 1.5,
          color: sk.body,
        });
      }

      // Ghost wisp particles (drift downward from body)
      const sk2 = getSkin();
      if (sk2.ghost && frame % 5 === 0) {
        particles.push({
          x: player.x + player.w / 2 + (Math.random() - 0.5) * player.w,
          y: player.y + player.h * 0.7 + Math.random() * 10,
          vx: (Math.random() - 0.5) * 0.4,
          vy: Math.random() * 0.6 + 0.2,
          life: 0.45, decay: 0.02,
          r: Math.random() * 3 + 1,
          color: '#c0d0e8',
        });
      }

      // Frost sparkle particles (drift around body)
      if (sk2.frost && frame % 4 === 0) {
        particles.push({
          x: player.x + player.w / 2 + (Math.random() - 0.5) * player.w * 1.8,
          y: player.y + Math.random() * player.h,
          vx: (Math.random() - 0.5) * 0.8,
          vy: -Math.random() * 0.8 - 0.2,
          life: 0.7, decay: 0.04,
          r: Math.random() * 2 + 0.5,
          color: Math.random() > 0.5 ? '#d0f0ff' : '#ffffff',
        });
      }

      // Level-up check (not during boss)
      if (state === 'running' && score >= nextLevelScore) {
        state = 'levelup';
        levelUpTimer = 130;
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#7ee8fa', 30);
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffffff', 15);
        // Snap player to start position on the ground for portal run
        player.x = 100;
        player.y = GROUND;
        player.vy = 0;
        player.onGround = true;
        player.sliding = false;
        player.diving = false;
        player.h = PLAYER_H;
        return;
      }

      // ---- Boss update ----
      if (state === 'boss' && boss && !boss.defeated) {
        boss.bobPhase += 0.04;
        boss.y = GROUND - 60 + Math.sin(boss.bobPhase) * 12;
        if (boss.hurtTimer > 0) boss.hurtTimer--;

        // Boss attacks — spawn obstacles from the boss position
        boss.attackCooldown--;
        if (boss.attackCooldown <= 0) {
          boss.phase++;
          // Random attack from solo + safe-combo pool — single-action patterns,
          // generous spacing so a slide-or-jump path is always available.
          const r = Math.floor(Math.random() * 11);
          const bx = boss.x;
          if (r === 0) {
            obstacles.push({ x: bx, y: FLOOR, w: 28, h: 30, type: 'ground' });
          } else if (r === 1) {
            obstacles.push({ x: bx, y: SLIDE_CLEAR, w: 72, h: 52, type: 'overhead' });
          } else if (r === 2) {
            // Tall ground + overhead — well spaced so jump-then-slide is possible
            obstacles.push({ x: bx, y: FLOOR, w: 20, h: 54, type: 'ground' });
            obstacles.push({ x: bx + 130, y: SLIDE_CLEAR, w: 60, h: 52, type: 'overhead' });
          } else if (r === 3) {
            obstacles.push({ x: bx, y: FLOOR, w: 52, h: 42, type: 'ground', pair: true });
          } else if (r === 4) {
            obstacles.push({ x: bx, y: SLIDE_CLEAR, w: 34, h: SLIDE_CLEAR, type: 'lowwall' });
          } else if (r === 5) {
            // Double ground spikes with generous jump-gap between
            obstacles.push({ x: bx,       y: FLOOR, w: 22, h: 32, type: 'ground' });
            obstacles.push({ x: bx + 110, y: FLOOR, w: 22, h: 32, type: 'ground' });
          } else if (r === 6) {
            // Two mines spread out (jumpable each)
            obstacles.push({ x: bx,       y: FLOOR, w: 26, h: 22, type: 'mine' });
            obstacles.push({ x: bx + 110, y: FLOOR, w: 26, h: 22, type: 'mine' });
          } else if (r === 7) {
            obstacles.push({ x: bx, y: FLOOR, w: 40, h: 46, type: 'crystal' });
          } else if (r === 8) {
            // Floater above ground spike — jump under floater, over spike
            obstacles.push({ x: bx, y: FLOOR, w: 24, h: 26, type: 'ground' });
            obstacles.push({ x: bx + 110, y: GROUND - 10, w: 44, h: 26, type: 'floater' });
          } else if (r === 9) {
            obstacles.push({ x: bx, y: SLIDE_CLEAR, w: 18, h: SLIDE_CLEAR, type: 'electric' });
          } else {
            // Single landmine
            obstacles.push({ x: bx, y: FLOOR, w: 26, h: 22, type: 'mine' });
          }
          // Boss flashes when attacking — faster cadence overall, even faster at low HP
          boss.attackCooldown = Math.max(22, 50 - Math.floor((BOSS_MAX_HP - boss.hp) * 1.2));
        }
      }

      // Handle boss defeat animation
      if (state === 'boss' && boss && boss.defeated) {
        boss.deathTimer++;
        if (boss.deathTimer % 8 === 0) {
          const ex = boss.x + Math.random() * boss.w - boss.w / 2;
          const ey = boss.y + Math.random() * boss.h - boss.h / 2;
          spawnParticles(ex, ey, '#ff4444', 6);
          spawnParticles(ex, ey, '#ffaa00', 4);
        }
        if (boss.deathTimer >= 120) {
          state = 'victory';
          victoryTimer = 0;
          if (score > hiScore) hiScore = score;
        }
      }

      // Obstacles — gap shrinks each level (normal spawning only in running state)
      if (state === 'running') {
        nextObstacle--;
        if (nextObstacle <= 0) {
          obstacles.push(makeObstacle());
          const gapMin = Math.max(35, 65 - (level - 1) * 5);
          const gapMax = Math.max(75, 120 - (level - 1) * 8);
          nextObstacle = Math.floor(Math.random() * (gapMax - gapMin) + gapMin);
        }
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed;
        if (obstacles[i].x + obstacles[i].w < 0) {
          // Dodged! Damage boss if in boss state
          if (state === 'boss' && boss && !boss.defeated) {
            boss.hp--;
            boss.hurtTimer = 12;
            spawnParticles(boss.x, boss.y, '#ff4444', 8);
            floatingTexts.push({ x: boss.x, y: boss.y - 30, text: '-1', color: '#ff4444', life: 40 });
            if (boss.hp <= 0) {
              boss.defeated = true;
              boss.deathTimer = 0;
              obstacles = [];
              totalDiamonds += 50;
              saveDiamonds();
              spawnFloatText(boss.x, boss.y - 60, '+◆ 50', '#40c9a2');
              spawnParticles(boss.x, boss.y - 30, '#40c9a2', 30);
              spawnParticles(boss.x, boss.y - 30, '#ffffff', 16);
            }
          }
          obstacles.splice(i, 1);
          continue;
        }
        const ob = obstacles[i];
        const obHitbox = { x: ob.x, y: ob.y - ob.h, w: ob.w, h: ob.h };
        const playerHitbox = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (invincible <= 0 && collides(playerHitbox, obHitbox)) {
          // Mines detonate on contact with a big explosion
          if (ob.type === 'mine') {
            const mx = ob.x + ob.w / 2, my = ob.y - ob.h / 2;
            spawnParticles(mx, my, '#ffaa00', 30);
            spawnParticles(mx, my, '#ff3020', 24);
            spawnParticles(mx, my, '#ffffff', 14);
            spawnParticles(mx, my, '#666666', 12);
            spawnFloatText(mx, my - 14, 'BOOM', '#ffaa00');
            obstacles.splice(i, 1);
          }
          // Screen shake on hit — heavier during boss fight, varies by obstacle type
          if (state === 'boss') {
            const mag = ob.type === 'mine'     ? 14 :
                        ob.type === 'electric' ? 12 :
                        ob.type === 'crystal'  ? 9  :
                        ob.type === 'lowwall'  ? 10 :
                        ob.type === 'floater'  ? 7  :
                        ob.type === 'overhead' ? 8  : 7;
            triggerShake(mag, 22);
            // Type-specific flash particles around player
            if (ob.type === 'electric') {
              spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffff60', 24);
              spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffffff', 12);
            } else if (ob.type === 'crystal') {
              spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#c060ff', 20);
            } else if (ob.type === 'floater') {
              spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff5050', 18);
            }
          } else {
            triggerShake(5, 10);
          }
          lives--;
          spawnParticles(player.x + player.w / 2, player.y + player.h / 2, getSkin().body, 16);
          spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffffff', 8);
          if (lives <= 0) {
            state = 'dead';
            if (score > hiScore) hiScore = score;
          } else {
            invincible = state === 'boss' ? 60 : 120; // shorter during boss fight
            // Knock player back to ground and clear slide
            endSlide();
            player.vy = -6;  // small bounce on hit
          }
        }
      }

      // Coins (not during boss)
      if (state !== 'boss') {
        nextCoin--;
        if (nextCoin <= 0) {
          spawnCoinGroup();
          nextCoin = Math.floor(Math.random() * 80 + 60);
        }
      }

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.x -= speed;
        if (c.x + c.r < 0) { coins.splice(i, 1); continue; }
        // Coin magnet
        if (upgrades.coinMagnet) {
          const px = player.x + player.w / 2, py = player.y + player.h / 2;
          const dx = px - c.x, dy = py - c.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 100 && dist > 0) {
            const pull = (100 - dist) / 100 * 4;
            c.x += (dx / dist) * pull;
            c.y += (dy / dist) * pull;
          }
        }
        // Collection check — use coin circle vs player box
        const bob = Math.sin(frame * 0.07 + c.phase) * 3;
        const cy = c.y + bob;
        if (c.x + c.r > player.x && c.x - c.r < player.x + player.w &&
            cy + c.r > player.y && cy - c.r < player.y + player.h) {
          coins.splice(i, 1);
          const worth = c.bag ? 10 : c.big ? 5 : 1;
          coinCount  += worth;
          totalCoins += worth;
          coinBank   += worth;
          saveCoinBank();
          score += worth * 10;
          spawnParticles(c.x, cy, c.bag ? '#a78bfa' : '#ffe066', c.bag ? 18 : c.big ? 14 : 8);
          addCoinCombo(worth, c.x, cy);
          // 1-up every 50 coins
          if (totalCoins >= nextLifeAt) {
            lives++;
            nextLifeAt += 50;
            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff6b8a', 20);
            spawnFloatText(player.x + player.w / 2, player.y - 10, '+1 \u2665', '#ff6b8a');
          }
        }
      }

      // Diamonds — spawn at 2000 and 4000 distance into each level (not during boss)
      const levelDist = score - levelStartScore;
      if (state !== 'boss' && levelDiamondsSpawned < 1 && levelDist >= 2000) {
        diamonds.push({ x: W + 20, y: GROUND - 60, r: 16, phase: Math.random() * Math.PI * 2 });
        levelDiamondsSpawned++;
      }
      if (state !== 'boss' && levelDiamondsSpawned < 2 && levelDist >= 4000) {
        diamonds.push({ x: W + 20, y: GROUND - 60, r: 16, phase: Math.random() * Math.PI * 2 });
        levelDiamondsSpawned++;
      }

      for (let i = diamonds.length - 1; i >= 0; i--) {
        const d = diamonds[i];
        d.x -= speed;
        if (d.x + d.r < 0) { diamonds.splice(i, 1); continue; }
        // Diamond magnet
        if (upgrades.diamondMagnet) {
          const px = player.x + player.w / 2, py = player.y + player.h / 2;
          const dx = px - d.x, dy = py - d.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120 && dist > 0) {
            const pull = (120 - dist) / 120 * 5;
            d.x += (dx / dist) * pull;
            d.y += (dy / dist) * pull;
          }
        }
        // Collection check
        const bob = Math.sin(frame * 0.05 + d.phase) * 4;
        const dy = d.y + bob;
        const hw = d.r * 0.7, ht = d.r * 1.3, hb = d.r * 0.9;
        if (d.x + hw > player.x && d.x - hw < player.x + player.w &&
            dy + hb > player.y && dy - ht < player.y + player.h) {
          diamonds.splice(i, 1);
          diamondCount++;
          totalDiamonds++;
          saveDiamonds();
          score += 250;
          spawnParticles(d.x, dy, '#40c9a2', 20);
          spawnParticles(d.x, dy, '#ffffff', 10);
          spawnFloatText(d.x, dy - 20, '+\u25C6', '#40c9a2');
        }
      }

      // Spin tokens \u2014 rare collectibles that grant +1 wheel spin
      if (state !== 'boss' && score >= nextSpinTokenAt) {
        spinTokens.push({ x: W + 20, y: GROUND - 50 - Math.floor(Math.random() * 60), r: 14, phase: Math.random() * Math.PI * 2 });
        nextSpinTokenAt = score + 4000 + Math.floor(Math.random() * 4000);
      }

      for (let i = spinTokens.length - 1; i >= 0; i--) {
        const s = spinTokens[i];
        s.x -= speed;
        if (s.x + s.r < 0) { spinTokens.splice(i, 1); continue; }
        const bob = Math.sin(frame * 0.05 + s.phase) * 4;
        const sy = s.y + bob;
        if (s.x + s.r > player.x && s.x - s.r < player.x + player.w &&
            sy + s.r > player.y && sy - s.r < player.y + player.h) {
          spinTokens.splice(i, 1);
          extraSpins++;
          saveExtraSpins();
          score += 500;
          spawnParticles(s.x, sy, '#ffe066', 24);
          spawnParticles(s.x, sy, '#ffffff', 12);
          spawnFloatText(s.x, sy - 20, '+1 SPIN', '#ffe066');
        }
      }

      // Rare diamond bag — grants 5 diamonds at once
      if (state !== 'boss' && score >= nextDiamondBagAt) {
        diamondBags.push({ x: W + 20, y: GROUND - 40 - Math.floor(Math.random() * 50), r: 18, phase: Math.random() * Math.PI * 2 });
        nextDiamondBagAt = score + 10000 + Math.floor(Math.random() * 8000);
      }

      // Floating green platforms — land on top, walk underneath
      if (state !== 'boss' && score >= nextPlatformAt) {
        const pw = 70 + Math.floor(Math.random() * 50); // 70-120 wide
        const py = GROUND - 30 - Math.floor(Math.random() * 60); // 30-90 above ground top
        const platX = W + 20;
        platforms.push({ x: platX, y: py, w: pw, h: 12 });
        // Sometimes drop a reward on top of the platform
        const roll = Math.random();
        if (roll < 0.45) {
          // Single diamond hovering above the platform
          diamonds.push({ x: platX + pw / 2, y: py - 18, r: 16, phase: Math.random() * Math.PI * 2 });
        } else if (roll < 0.55) {
          // Rare diamond bag on top
          diamondBags.push({ x: platX + pw / 2, y: py - 22, r: 18, phase: Math.random() * Math.PI * 2 });
        } else if (roll < 0.75) {
          // Row of 3 coins above the platform
          for (let i = 0; i < 3; i++) {
            coins.push({ x: platX + pw / 2 - 28 + i * 28, y: py - 16, r: 8, phase: i * 0.4 });
          }
        }
        nextPlatformAt = score + 1200 + Math.floor(Math.random() * 1800);
      }
      for (let i = platforms.length - 1; i >= 0; i--) {
        const p = platforms[i];
        p.x -= speed;
        if (p.x + p.w < 0) { platforms.splice(i, 1); continue; }
      }

      for (let i = diamondBags.length - 1; i >= 0; i--) {
        const b = diamondBags[i];
        b.x -= speed;
        if (b.x + b.r < 0) { diamondBags.splice(i, 1); continue; }
        // Diamond magnet pulls the bag too
        if (upgrades.diamondMagnet) {
          const px = player.x + player.w / 2, py = player.y + player.h / 2;
          const dx = px - b.x, dy = py - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120 && dist > 0) {
            const pull = (120 - dist) / 120 * 5;
            b.x += (dx / dist) * pull;
            b.y += (dy / dist) * pull;
          }
        }
        const bob = Math.sin(frame * 0.05 + b.phase) * 4;
        const by = b.y + bob;
        if (b.x + b.r > player.x && b.x - b.r < player.x + player.w &&
            by + b.r > player.y && by - b.r < player.y + player.h) {
          diamondBags.splice(i, 1);
          diamondCount += 5;
          totalDiamonds += 5;
          saveDiamonds();
          score += 1000;
          spawnParticles(b.x, by, '#7ee8fa', 30);
          spawnParticles(b.x, by, '#ffffff', 18);
          spawnFloatText(b.x, by - 24, '+◆ 5', '#7ee8fa');
        }
      }

      // Coin combo timer
      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer === 0) { comboWorth = 0; comboText = null; }
      }

      // Floating texts
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y    += ft.vy;
        ft.vy   *= 0.96;
        ft.scale += (1 - ft.scale) * 0.18; // spring back to 1
        ft.life -= 0.018;
        if (ft.life <= 0) {
          if (ft === comboText) comboText = null;
          floatingTexts.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Stars scroll
      for (const s of stars) {
        s.x -= s.s;
        if (s.x < 0) s.x = W;
      }

      // Ambient background particles
      updateAmbient();

      // Ground tiles scroll
      for (let i = 0; i < groundTiles.length; i++) {
        groundTiles[i] -= speed;
        if (groundTiles[i] + 40 < 0) groundTiles[i] += groundTiles.length * 40;
      }

      // Update UI
      scoreEl.textContent = 'SCORE: ' + score;
      hiEl.textContent = 'BEST: ' + hiScore;
      coinEl.textContent = '\u25cf ' + coinCount;
      livesEl.textContent = '\u2665'.repeat(Math.max(0, lives)) || '\u2661';
      levelEl.textContent = state === 'boss' ? 'BOSS' : 'LVL ' + level;
    }

    // ---- Per-level silhouette shapes ----
    function drawSilhouette(theme) {
      const lv = Math.min(level, LEVEL_THEMES.length);
      ctx.fillStyle = theme.bldCol;

      if (lv === 2) {
        // Cyber forest — trees with trunks and rounded canopies
        for (const [x, w, h] of theme.blds) {
          const trunkW = Math.max(4, w * 0.18);
          const trunkH = h * 0.45;
          const cx = x + w / 2;
          // Trunk
          ctx.fillRect(cx - trunkW / 2, GROUND - trunkH, trunkW, trunkH);
          // Canopy — layered circles for organic feel
          const canopyR = w * 0.45;
          const canopyY = GROUND - trunkH - canopyR * 0.6;
          ctx.beginPath();
          ctx.arc(cx, canopyY, canopyR, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath();
          ctx.arc(cx - canopyR * 0.4, canopyY + canopyR * 0.2, canopyR * 0.7, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath();
          ctx.arc(cx + canopyR * 0.4, canopyY + canopyR * 0.2, canopyR * 0.7, 0, Math.PI * 2); ctx.fill();
        }

      } else if (lv === 3) {
        // Desert — rolling dunes and mesa shapes
        // Background dune wave
        ctx.beginPath();
        ctx.moveTo(0, GROUND);
        for (let px = 0; px <= W; px += 4) {
          const dy = Math.sin(px * 0.006) * 35 + Math.sin(px * 0.015) * 18 + Math.sin(px * 0.003) * 25;
          ctx.lineTo(px, GROUND - 50 - dy);
        }
        ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
        // Mesa/butte accents on top of dunes
        const mesas = [[80, 50, 40], [250, 35, 55], [450, 45, 35], [620, 40, 50], [760, 30, 45]];
        for (const [mx, mw, mh] of mesas) {
          ctx.beginPath();
          ctx.moveTo(mx - mw * 0.7, GROUND - 50);
          ctx.lineTo(mx - mw * 0.35, GROUND - 50 - mh);
          ctx.lineTo(mx + mw * 0.35, GROUND - 50 - mh);
          ctx.lineTo(mx + mw * 0.7, GROUND - 50);
          ctx.closePath(); ctx.fill();
        }

      } else if (lv === 5) {
        // Frozen tundra — jagged mountain peaks
        ctx.beginPath();
        ctx.moveTo(0, GROUND);
        for (const [x, w, h] of theme.blds) {
          const peakX = x + w / 2;
          const peakY = GROUND - h;
          ctx.lineTo(x, GROUND - h * 0.15);
          ctx.lineTo(peakX, peakY);
          ctx.lineTo(x + w, GROUND - h * 0.2);
        }
        ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
        // Snow caps — lighter triangles at peaks
        ctx.fillStyle = '#2a4a6a';
        for (const [x, w, h] of theme.blds) {
          const peakX = x + w / 2;
          const peakY = GROUND - h;
          const capH = h * 0.25;
          ctx.beginPath();
          ctx.moveTo(peakX, peakY);
          ctx.lineTo(peakX - w * 0.18, peakY + capH);
          ctx.lineTo(peakX + w * 0.18, peakY + capH);
          ctx.closePath(); ctx.fill();
        }

      } else if (lv === 7) {
        // Deep ocean — coral reef mounds and sea fans
        // Undulating reef base
        ctx.beginPath();
        ctx.moveTo(0, GROUND);
        for (let px = 0; px <= W; px += 4) {
          const dy = Math.sin(px * 0.008) * 25 + Math.sin(px * 0.02) * 12 + Math.sin(px * 0.004) * 20;
          ctx.lineTo(px, GROUND - 35 - dy);
        }
        ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill();
        // Coral branches / fans on top
        ctx.strokeStyle = theme.bldCol; ctx.lineWidth = 3; ctx.lineCap = 'round';
        const corals = [[60,55],[180,70],[310,50],[440,65],[570,55],[700,60]];
        for (const [cx, ch] of corals) {
          const baseY = GROUND - 40;
          // Central stem
          ctx.beginPath(); ctx.moveTo(cx, baseY); ctx.lineTo(cx, baseY - ch); ctx.stroke();
          // Branches
          for (let b = 1; b <= 3; b++) {
            const by = baseY - ch * (b / 4);
            const spread = 8 + b * 5;
            ctx.beginPath(); ctx.moveTo(cx, by);
            ctx.lineTo(cx - spread, by - 12 - b * 3); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx, by);
            ctx.lineTo(cx + spread, by - 10 - b * 4); ctx.stroke();
          }
        }

      } else {
        // Default — rectangular building silhouettes (levels 1, 4, 6, 8)
        for (const [x, w, h] of theme.blds) {
          ctx.fillRect(x, GROUND - h, w, h);
        }
      }
    }

    // ---- Boss drawing ----
    function drawBoss() {
      if (!boss) return;
      const bx = boss.x, by = boss.y, bw = boss.w, bh = boss.h;
      ctx.save();

      // Shake when hurt
      const shake = boss.hurtTimer > 0 ? (Math.random() - 0.5) * 6 : 0;
      ctx.translate(shake, 0);

      // Death fade
      if (boss.defeated) {
        ctx.globalAlpha = Math.max(0, 1 - boss.deathTimer / 120);
      }

      // Shadow on ground
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(bx, FLOOR, bw * 0.5, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body — dark angular shape
      const bodyColor = boss.hurtTimer > 0 && boss.hurtTimer % 4 < 2 ? '#ff4444' : '#2a0a3a';
      ctx.fillStyle = bodyColor;

      // Main body (angular torso)
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.35, by + bh * 0.1);    // left shoulder
      ctx.lineTo(bx - bw * 0.15, by - bh * 0.35);    // left neck
      ctx.lineTo(bx + bw * 0.15, by - bh * 0.35);    // right neck
      ctx.lineTo(bx + bw * 0.35, by + bh * 0.1);     // right shoulder
      ctx.lineTo(bx + bw * 0.25, by + bh * 0.45);    // right hip
      ctx.lineTo(bx - bw * 0.25, by + bh * 0.45);    // left hip
      ctx.closePath(); ctx.fill();

      // Head
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.2, by - bh * 0.3);
      ctx.lineTo(bx, by - bh * 0.55);                 // crown
      ctx.lineTo(bx + bw * 0.2, by - bh * 0.3);
      ctx.closePath(); ctx.fill();

      // Eye — glowing red
      const eyePulse = 0.7 + Math.sin(frame * 0.08) * 0.3;
      ctx.fillStyle = `rgba(255,30,30,${eyePulse})`;
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(bx, by - bh * 0.35, 6, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Arm spikes
      ctx.fillStyle = bodyColor;
      // Left arm
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.35, by + bh * 0.1);
      ctx.lineTo(bx - bw * 0.6, by + bh * 0.05 + Math.sin(boss.bobPhase * 1.5) * 5);
      ctx.lineTo(bx - bw * 0.3, by + bh * 0.25);
      ctx.closePath(); ctx.fill();
      // Right arm
      ctx.beginPath();
      ctx.moveTo(bx + bw * 0.35, by + bh * 0.1);
      ctx.lineTo(bx + bw * 0.6, by + bh * 0.05 + Math.sin(boss.bobPhase * 1.5 + 1) * 5);
      ctx.lineTo(bx + bw * 0.3, by + bh * 0.25);
      ctx.closePath(); ctx.fill();

      // Outline glow
      ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 1.5;
      ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(bx - bw * 0.35, by + bh * 0.1);
      ctx.lineTo(bx - bw * 0.15, by - bh * 0.35);
      ctx.lineTo(bx, by - bh * 0.55);
      ctx.lineTo(bx + bw * 0.15, by - bh * 0.35);
      ctx.lineTo(bx + bw * 0.35, by + bh * 0.1);
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.globalAlpha = 1;
      ctx.restore();

      // HP bar (drawn without shake/fade)
      if (!boss.defeated) {
        const barW = 120, barH = 8;
        const barX = bx - barW / 2, barY = by - bh * 0.65 - 12;
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
        ctx.fillStyle = '#330a0a'; ctx.fillRect(barX, barY, barW, barH);
        const hpFrac = Math.max(0, boss.hp / BOSS_MAX_HP);
        const hpCol = hpFrac > 0.5 ? '#a855f7' : hpFrac > 0.25 ? '#ff6b35' : '#ff2020';
        ctx.fillStyle = hpCol;
        ctx.fillRect(barX, barY, barW * hpFrac, barH);
        ctx.shadowColor = hpCol; ctx.shadowBlur = 6;
        ctx.fillRect(barX, barY, barW * hpFrac, barH);
        ctx.shadowBlur = 0;
      }
    }

    // ---- Per-level animated background layers ----
    function drawLevelBg(theme) {
      const lv = Math.min(level, LEVEL_THEMES.length);
      ctx.save();

      if (lv === 2) {
        // Cyber forest — fireflies glow
        for (const p of ambientParts) {
          const glow = 0.4 + Math.sin(p.phase * 3) * 0.3;
          ctx.globalAlpha = glow;
          ctx.fillStyle = '#40ff90';
          ctx.shadowColor = '#40ff90'; ctx.shadowBlur = 10;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;

      } else if (lv === 3) {
        // Desert — heat shimmer waves
        ctx.globalAlpha = 0.04;
        ctx.fillStyle = '#e67e22';
        for (let i = 0; i < 5; i++) {
          const yy = GROUND - 20 - i * 18;
          ctx.beginPath();
          ctx.moveTo(0, yy);
          for (let x = 0; x < W; x += 8) {
            ctx.lineTo(x, yy + Math.sin((x + frame * 2) * 0.02 + i) * 6);
          }
          ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
        }

      } else if (lv === 4) {
        // Purple spires — pulsing energy lines between tall buildings
        ctx.globalAlpha = 0.15 + Math.sin(frame * 0.04) * 0.1;
        ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 1.5;
        ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 8;
        const blds = theme.blds;
        for (let i = 0; i < blds.length - 1; i += 2) {
          const [x1, w1, h1] = blds[i]; const [x2, w2, h2] = blds[i + 1];
          const y1 = GROUND - h1 + 10; const y2 = GROUND - h2 + 10;
          ctx.beginPath(); ctx.moveTo(x1 + w1 / 2, y1);
          const mx = (x1 + w1 / 2 + x2 + w2 / 2) / 2;
          const my = Math.min(y1, y2) - 15 + Math.sin(frame * 0.06 + i) * 8;
          ctx.quadraticCurveTo(mx, my, x2 + w2 / 2, y2);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        // Rising energy motes
        for (const p of ambientParts) {
          ctx.globalAlpha = 0.5 + Math.sin(p.phase * 2) * 0.3;
          ctx.fillStyle = '#c084fc';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }

      } else if (lv === 5) {
        // Frozen tundra — snowflakes + aurora borealis
        // Aurora: gently waving translucent bands
        for (let band = 0; band < 3; band++) {
          const hue = 140 + band * 40 + Math.sin(frame * 0.01 + band) * 20;
          ctx.globalAlpha = 0.06;
          ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
          ctx.beginPath(); ctx.moveTo(0, 30 + band * 25);
          for (let x = 0; x <= W; x += 10) {
            ctx.lineTo(x, 30 + band * 25 + Math.sin((x + frame * 0.8) * 0.008 + band * 2) * 20);
          }
          ctx.lineTo(W, 90 + band * 25); ctx.lineTo(0, 90 + band * 25); ctx.closePath(); ctx.fill();
        }
        // Snowflakes
        for (const p of ambientParts) {
          ctx.globalAlpha = 0.6 + Math.sin(p.phase) * 0.2;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }

      } else if (lv === 6) {
        // Volcanic — lava glow at ground + rising embers
        // Lava glow gradient at bottom
        const grad = ctx.createLinearGradient(0, FLOOR - 40, 0, FLOOR + 20);
        grad.addColorStop(0, 'rgba(255,80,0,0)');
        grad.addColorStop(0.7, 'rgba(255,60,0,0.12)');
        grad.addColorStop(1, 'rgba(255,30,0,0.25)');
        ctx.globalAlpha = 0.7 + Math.sin(frame * 0.03) * 0.15;
        ctx.fillStyle = grad;
        ctx.fillRect(0, FLOOR - 40, W, 60);
        // Embers
        for (const p of ambientParts) {
          const life = 1 - (FLOOR - p.y) / (FLOOR + 30);
          ctx.globalAlpha = Math.max(0, Math.min(1, life * 0.9));
          ctx.fillStyle = Math.random() > 0.5 ? '#ff6a00' : '#ff3800';
          ctx.shadowColor = '#ff4500'; ctx.shadowBlur = 4;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      font-family: 'Courier New', monospace;
      color: #eee;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    canvas {
      border: 2px solid #e94560;
      border-radius: 4px;
      display: block;
      max-width: 100vw;
      max-height: 80dvh;
    }
    #ui {
      width: 800px;
      max-width: 100vw;
      display: flex;
      justify-content: space-between;
      padding: 8px 4px;
      font-size: 14px;
      color: #aaa;
    }
    #score-display { color: #e94560; font-weight: bold; font-size: 16px; }
    #hi-display { color: #f5a623; }
    #coin-display { color: #ffe066; font-weight: bold; font-size: 16px; }
    #lives-display { color: #ff6b8a; font-weight: bold; font-size: 16px; letter-spacing: 3px; }
    #level-display  { color: #7ee8fa; font-weight: bold; font-size: 16px; }
    #diamond-display { color: #40c9a2; font-weight: bold; font-size: 16px; }
    @media (max-width: 820px) {
      #ui { font-size: 11px; padding: 4px 2px; }
      #score-display, #coin-display, #lives-display, #level-display, #diamond-display { font-size: 12px; }
      #hi-display { font-size: 11px; }
    }
  </style>
</head>

    // ---- Responsive canvas scaling ----

      canvas.style.width = Math.floor(W * scale) + 'px';
      canvas.style.height = Math.floor(H * scale) + 'px';
      // Also resize the UI bar to match
      const ui = document.getElementById('ui');
      ui.style.width = Math.floor(W * scale) + 'px';

    let victoryTimer = 0;
    function initBoss() {

        w: 64, h: 80,
        hp: BOSS_MAX_HP,
        phase: 0,          // attack phase timer
        hurtTimer: 0,      // flash when hit

        attackCooldown: 0,  // frames until next attack

        deathTimer: 0,

    }

    // ---- Player ----
    const player = {
      x: 100,
      y: GROUND,
      w: 32,
      h: PLAYER_H,
      vy: 0,
      onGround: true,
      jumpsLeft: 2,
      lean: 0,
      legPhase: 0,
      sliding: false,
      slideTimer: 0,
      diving: false,
    };

    // ---- Obstacles ----
    let obstacles = [];
    let nextObstacle = 80;

    // ---- Floating platforms (green blocks you can land on) ----
    let platforms = [];
    let nextPlatformAt = 0;

    // ---- Coins ----
    let coins = [];
    let coinCount = 0;
    let nextCoin = 50;

    // ---- Diamonds ----
    let diamonds = [];
    let diamondCount = 0;
    let levelStartScore = 0;
    let levelDiamondsSpawned = 0;
    let diamondBags = [];
    let nextDiamondBagAt = 0; // score threshold for next rare bag spawn

    // ---- Profile system: all coin/diamond/unlock state is namespaced per name ----
    const PROFILE_KEYS = ['totalDiamonds', 'coinBank', 'upgrades', 'ownedUpgrades', 'activeSkin', 'ownedSkins', 'lastSpinDate', 'extraSpins', 'snakeHi', 'flappyHi', 'adminUnlocked', 'thorrenUnlocked'];
    let currentProfile = localStorage.getItem('runner_currentProfile') || '';
    if (!currentProfile) {
      // First boot with profile system — migrate any old global keys to a default profile.
      currentProfile = (localStorage.getItem('runner_playerName') || 'Player').trim() || 'Player';
      for (const k of PROFILE_KEYS) {
        const oldVal = localStorage.getItem('runner_' + k);
        const newKey = 'runner_' + currentProfile + '_' + k;
        if (oldVal !== null && localStorage.getItem(newKey) === null) {
          localStorage.setItem(newKey, oldVal);
        }
      }
      localStorage.setItem('runner_currentProfile', currentProfile);
    }
    let knownProfiles = JSON.parse(localStorage.getItem('runner_profiles') || '[]');
    if (!knownProfiles.includes(currentProfile)) {
      knownProfiles.push(currentProfile);
      localStorage.setItem('runner_profiles', JSON.stringify(knownProfiles));
    }
    function pkey(k) { return 'runner_' + currentProfile + '_' + k; }

    // ---- Shop / persistent upgrades ----
    const REVIVE_COST = 15;
    const COINS_PER_DIAMOND = 5; // exchange rate when paying with coins instead of diamonds
    const ARCADE_REVIVE_COST = 3; // cheaper revive cost in snake/flappy
    let totalDiamonds = parseInt(localStorage.getItem(pkey('totalDiamonds')) || '0');
    let coinBank = parseInt(localStorage.getItem(pkey('coinBank')) || '0');
    function saveCoinBank() { localStorage.setItem(pkey('coinBank'), coinBank); }
    let upgrades = JSON.parse(localStorage.getItem(pkey('upgrades')) || '{}');
    let ownedUpgrades = JSON.parse(localStorage.getItem(pkey('ownedUpgrades')) || 'null');
    if (!ownedUpgrades) {
      // Migration: existing players already own anything they have active.
      ownedUpgrades = {};
      for (const k in upgrades) if (upgrades[k]) ownedUpgrades[k] = true;
      localStorage.setItem(pkey('ownedUpgrades'), JSON.stringify(ownedUpgrades));
    }
    let shopSelection = 0;
    let shopReturnState = 'start';

    // ---- Daily Spin Wheel ----
    const WHEEL_SEGMENTS = [1, 2, 3, 5, 1, 10, 2, 25];
    const WHEEL_COLORS   = ['#ffe066','#7ee8fa','#a8dadc','#40c9a2','#ffe066','#f5a623','#7ee8fa','#e94560'];
    let lastSpinDate = localStorage.getItem(pkey('lastSpinDate')) || '';
    let extraSpins = parseInt(localStorage.getItem(pkey('extraSpins')) || '0');
    let wheelReturnState = 'start';
    let wheelAngle = 0, wheelStartAngle = 0, wheelTargetAngle = 0;
    let wheelSpinning = false, wheelSpinFrame = 0, wheelSpinDuration = 180;
    let wheelResultIdx = -1, wheelResultShown = 0, wheelRewardAmount = 0;
    let spinTokens = [];
    let nextSpinTokenAt = 0; // score threshold for next spawn (set in reset())

    // ---- Online Presence (Firebase Realtime DB) ----
    // SETUP (~5 min, gratis):
    //   1) Ga naar https://console.firebase.google.com → "Add project" (Spark/free plan)
    //   2) Build → Realtime Database → Create database (regio bv. europe-west1)
    //   3) Tabblad "Rules" → vervang door:  { "rules": { ".read": true, ".write": true } }  → Publish
    //   4) Kopieer de DB-URL uit het Data-tabblad en plak hieronder (bv. https://jouwproject-default-rtdb.europe-west1.firebasedatabase.app)
    const PRESENCE_URL = 'https://thorrunner-bee78-default-rtdb.europe-west1.firebasedatabase.app/'; // leeg = uit
    let playerId = localStorage.getItem('runner_playerId') ||
      (localStorage.setItem('runner_playerId', 'p' + Math.random().toString(36).slice(2, 11)),
       localStorage.getItem('runner_playerId'));
    let playerName = currentProfile;
    let onlinePlayers = []; // [{id, name, lastSeen}]
    const presenceEnabled = !!PRESENCE_URL;

    function setPlayerName(n) {
      n = (n || '').trim().slice(0, 16);
      if (!n) return;
      playerName = n;
      localStorage.setItem('runner_playerName', n);
    }
    // Keep the legacy key in sync so the presence layer keeps working.
    setPlayerName(currentProfile);

    async function presenceHeartbeat() {
      if (!presenceEnabled || !playerName) return;
      try {
        await fetch(PRESENCE_URL + '/presence/' + playerId + '.json', {
          method: 'PUT',
          body: JSON.stringify({ name: playerName, lastSeen: Date.now() }),
        });
      } catch (e) {}
    }
    async function presencePoll() {
      if (!presenceEnabled) return;
      try {
        const r = await fetch(PRESENCE_URL + '/presence.json');
        if (!r.ok) return;
        const data = (await r.json()) || {};
        const cutoff = Date.now() - 20000;
        onlinePlayers = Object.entries(data)
          .map(([id, v]) => v ? { id, name: v.name, lastSeen: v.lastSeen } : null)
          .filter(p => p && p.name && p.lastSeen >= cutoff)
          .sort((a, b) => b.lastSeen - a.lastSeen);
      } catch (e) {}
    }
    function presenceCleanup() {
      if (!presenceEnabled || !playerName) return;
      try {
        fetch(PRESENCE_URL + '/presence/' + playerId + '.json', { method: 'DELETE', keepalive: true });
      } catch (e) {}
    }
    if (presenceEnabled) {
      presenceHeartbeat(); presencePoll();
      setInterval(presenceHeartbeat, 8000);
      setInterval(presencePoll, 8000);
      window.addEventListener('beforeunload', presenceCleanup);
      window.addEventListener('pagehide', presenceCleanup);

    function todayKey() {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }
    function canSpinToday() { return lastSpinDate !== todayKey(); }
    function canSpin() { return canSpinToday() || extraSpins > 0; }

    function startWheelSpin() {
      if (!canSpin() || wheelSpinning) return;
      // Deduct now so closing the tab mid-spin doesn't grant a free retry.
      if (canSpinToday()) {
        lastSpinDate = todayKey();
        saveLastSpinDate();
      } else {
        extraSpins--;
        saveExtraSpins();
      }
      wheelResultIdx = Math.floor(Math.random() * WHEEL_SEGMENTS.length);
      const segAngle = (Math.PI * 2) / WHEEL_SEGMENTS.length;
      const segCenter = wheelResultIdx * segAngle + segAngle / 2;
      const turns = 5 + Math.floor(Math.random() * 3);
      let target = wheelAngle + turns * Math.PI * 2 + ((-Math.PI / 2) - segCenter - wheelAngle);
      while (target < wheelAngle + turns * Math.PI * 2) target += Math.PI * 2;
      wheelTargetAngle = target;
      wheelStartAngle = wheelAngle;
      wheelSpinFrame = 0;
      wheelResultShown = 0;
      wheelSpinning = true;
    }

    function finishWheelSpin() {
      const reward = WHEEL_SEGMENTS[wheelResultIdx];
      totalDiamonds += reward;
      saveDiamonds();
      wheelRewardAmount = reward;
      wheelResultShown = 1;
      wheelSpinning = false;
    }

    // ---- Stars (background) ----
    function initStars() {
      stars = [];
      for (let i = 0; i < 60; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * GROUND * 0.8, r: Math.random() * 1.5 + 0.3, s: Math.random() * 0.3 + 0.1 });
      }

    // ---- Ambient background particles (per-level atmosphere) ----
    let ambientParts = [];
    function initAmbient() {
      ambientParts = [];
      const lv = Math.min(level, LEVEL_THEMES.length);
      const count = [0, 25, 20, 0, 35, 30, 40, 50][lv - 1] || 0;
      for (let i = 0; i < count; i++) {
        ambientParts.push(makeAmbientParticle(true));
      }
    }
    function makeAmbientParticle(randomX) {
      const lv = Math.min(level, LEVEL_THEMES.length);
      const p = { x: randomX ? Math.random() * W : W + Math.random() * 40,
                  y: Math.random() * GROUND, r: 0, vx: 0, vy: 0, phase: Math.random() * Math.PI * 2 };
      if (lv === 2) { // Fireflies
        p.r = Math.random() * 2 + 1; p.vx = -0.3 - Math.random() * 0.5;
        p.vy = Math.sin(p.phase) * 0.3;
      } else if (lv === 4) { // Energy motes
        p.r = Math.random() * 1.5 + 0.5; p.vx = -0.2 - Math.random() * 0.3;
        p.vy = -0.5 - Math.random() * 0.8; p.y = GROUND - Math.random() * 60;
      } else if (lv === 5) { // Snowflakes
        p.r = Math.random() * 2.5 + 1; p.vx = -0.5 - Math.random() * 1;
        p.vy = 0.8 + Math.random() * 1.2; p.y = randomX ? Math.random() * H : -5;
      } else if (lv === 6) { // Embers
        p.r = Math.random() * 2 + 0.5; p.vx = -0.3 + (Math.random() - 0.5) * 0.6;
        p.vy = -1 - Math.random() * 1.5; p.y = FLOOR - Math.random() * 30;
      } else if (lv === 7) { // Bubbles
        p.r = Math.random() * 3 + 1; p.vx = (Math.random() - 0.5) * 0.4;
        p.vy = -0.4 - Math.random() * 0.8; p.y = randomX ? Math.random() * GROUND : GROUND;
      } else if (lv === 8) { // Rain
        p.r = 1; p.vx = -2; p.vy = 6 + Math.random() * 3;
        p.y = randomX ? Math.random() * H : -5;
      }
      return p;
    }
    function updateAmbient() {
      for (let i = ambientParts.length - 1; i >= 0; i--) {
        const p = ambientParts[i];
        const lv = Math.min(level, LEVEL_THEMES.length);
        p.x += p.vx; p.y += p.vy; p.phase += 0.03;
        // Wobble for fireflies and snowflakes
        if (lv === 2) p.vy = Math.sin(p.phase) * 0.4;
        if (lv === 5) p.vx += Math.sin(p.phase) * 0.02;
        // Recycle off-screen particles
        if (p.x < -10 || p.y < -10 || p.y > H + 10) {
          const vertical = (lv === 5 || lv === 6 || lv === 7 || lv === 8);
          ambientParts[i] = makeAmbientParticle(vertical);
          if (lv === 5) ambientParts[i].y = -5;                     // snow falls from top
          if (lv === 6) ambientParts[i].y = FLOOR - Math.random() * 20; // embers rise from ground
          if (lv === 7) ambientParts[i].y = GROUND;                 // bubbles rise from ground
          if (lv === 8) ambientParts[i].y = -5;                     // rain falls from top
        }
      }
    }

    // ---- Particles ----
    function spawnParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 2,
          life: 1,
          decay: Math.random() * 0.03 + 0.02,
          r: Math.random() * 5 + 2,
          color,
        });
      }
    }

    function spawnDustParticle() {
      particles.push({
        x: player.x + player.w / 2,
        y: FLOOR,
        vx: -speed * 0.3 + (Math.random() - 0.5) * 1,
        vy: -Math.random() * 1.5,
        life: 1,
        decay: 0.06,
        r: Math.random() * 3 + 1,
        color: COL.ground,
      });

      comboWorth += worth;

    // ---- Jump ----
    function jump() {
      if (state === 'shop') return;
      if (state === 'start' || state === 'victory') { state = 'running'; reset(); return; }
      if (state === 'dead') { state = 'running'; reset(); return; }
      if (player.sliding) {
        endSlide();
        if (!upgrades.longSlide) return; // without upgrade: cancel only, no jump
        // with long slide upgrade: cancel slide AND jump
      }
      if (player.jumpsLeft > 0) {
        player.vy = -13;
        player.jumpsLeft--;
        spawnParticles(player.x + player.w / 2, player.y + player.h, getSkin().jump, 6);
      }
    }

    // ---- Slide ----
    function startSlide() {
      if (!player.onGround || player.sliding) return;
      player.sliding = true;
      player.slideTimer = upgrades.longSlide ? 60 : 38;
      player.h = SLIDE_H;
      player.y = GROUND + (PLAYER_H - SLIDE_H); // keep feet on ground
    }

    function endSlide() {
      if (!player.sliding) return;
      player.sliding = false;
      player.slideTimer = 0;
      player.h = PLAYER_H;
      player.y = GROUND;
    }

    // ---- Dive ----
    function dive() {
      if ((state !== 'running' && state !== 'boss') || !upgrades.dive) return;
      if (player.onGround || player.sliding || player.diving) return;
      player.diving = true;
      player.vy = 14;
      spawnParticles(player.x + player.w / 2, player.y, getSkin().jump, 8);
    }

    // ---- Touch detection ----
    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

    // ---- Revive: pay diamonds to resume from where you died ----
    const REVIVE_COIN_COST = REVIVE_COST * COINS_PER_DIAMOND;
    function canRevive() {
      return state === 'dead' && (totalDiamonds >= REVIVE_COST || coinBank >= REVIVE_COIN_COST);
    }
    function revive() {
      if (state !== 'dead') return;
      // Prefer diamonds, fall back to coins
      if (totalDiamonds >= REVIVE_COST) {
        totalDiamonds -= REVIVE_COST;
        saveDiamonds();
      } else if (coinBank >= REVIVE_COIN_COST) {
        coinBank -= REVIVE_COIN_COST;
        saveCoinBank();
      } else return;
      lives = 3;
      invincible = 180;
      endSlide();
      player.y = GROUND;
      player.h = PLAYER_H;
      player.vy = 0;
      player.onGround = true;
      obstacles = obstacles.filter(o => o.x > W * 0.85);
      state = (boss && !boss.defeated) ? 'boss' : 'running';
    }

    // ---- Shop purchase logic (shared by keyboard & touch) ----
    // Deduct from diamonds if possible, otherwise coins. Returns true on success.
    function payShopCost(diamondCost) {
      if (totalDiamonds >= diamondCost) {
        totalDiamonds -= diamondCost;
        saveDiamonds();
        return true;
      }
      const coinCost = diamondCost * COINS_PER_DIAMOND;
      if (coinBank >= coinCost) {
        coinBank -= coinCost;
        saveCoinBank();
        return true;
      }
      return false;
    }
    function canAfford(diamondCost) {
      return totalDiamonds >= diamondCost || coinBank >= diamondCost * COINS_PER_DIAMOND;
    }
    function shopPurchase(idx) {
      if (idx === undefined) idx = shopSelection;
      const item = SHOP_ITEMS[idx];
      if (item.type === 'skin') {
        if (ownedSkins.includes(item.key)) {
          activeSkin = item.key;
          saveActiveSkin();
        } else if (payShopCost(item.cost)) {
          ownedSkins.push(item.key);
          activeSkin = item.key;
          saveOwnedSkins();
          saveActiveSkin();
        }
      } else {
        if (ownedUpgrades[item.key]) {
          // Already owned — toggle active state on/off.
          upgrades[item.key] = !upgrades[item.key];
          saveUpgrades();
        } else if (payShopCost(item.cost)) {
          ownedUpgrades[item.key] = true;
          upgrades[item.key] = true;
          saveUpgrades();
          saveOwnedUpgrades();
        }
      }
    }

    // ---- Boss cheat: type 'boss' during gameplay to skip to boss fight ----
    let cheatBuffer = '';
    function goToBoss() {
      obstacles = [];
      coins = [];
      diamonds = [];
      spinTokens = [];
      diamondBags = [];
      platforms = [];
      level = LEVEL_THEMES.length + 1;
      player.x = 100;
      initBoss();
      invincible = 60;
      state = 'boss';
    }

    // ---- Input (keyboard) ----
    document.addEventListener('keydown', e => {
      // Home menu
      if (state === 'home') {
        if (e.code === 'KeyN') { e.preventDefault(); promptChangeProfile(); return; }
        if (e.code === 'Digit1' || e.code === 'Numpad1') { e.preventDefault(); pickHomeCard(0); return; }
        if (e.code === 'Digit2' || e.code === 'Numpad2') { e.preventDefault(); pickHomeCard(1); return; }
        if (e.code === 'Digit3' || e.code === 'Numpad3') { e.preventDefault(); pickHomeCard(2); return; }
        if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); pickHomeCard(0); return; }
        return;
      }
      // Snake input
      if (state === 'snake' || state === 'snakeDead') {
        if (e.code === 'Escape' || e.code === 'KeyH') { e.preventDefault(); state = 'home'; return; }
        if (state === 'snakeDead') {
          if (e.code === 'KeyR') { e.preventDefault(); reviveSnake(); return; }
          if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); resetSnake(); state = 'snake'; }
          return;
        }
        if (e.code === 'Digit1' || e.code === 'Numpad1') { e.preventDefault(); activateSnakePowerup(1); return; }
        if (e.code === 'Digit2' || e.code === 'Numpad2') { e.preventDefault(); activateSnakePowerup(2); return; }
        let handled = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW')         { queueSnakeDir(0, -1); handled = true; }
        else if (e.code === 'ArrowDown' || e.code === 'KeyS')  { queueSnakeDir(0, 1);  handled = true; }
        else if (e.code === 'ArrowLeft' || e.code === 'KeyA')  { queueSnakeDir(-1, 0); handled = true; }
        else if (e.code === 'ArrowRight' || e.code === 'KeyD') { queueSnakeDir(1, 0);  handled = true; }
        if (handled) { e.preventDefault(); snakeStarted = true; }
        return;
      }
      // Flappy input
      if (state === 'flappy' || state === 'flappyDead') {
        if (e.code === 'Escape' || e.code === 'KeyH') { e.preventDefault(); state = 'home'; return; }
        if (state === 'flappyDead') {
          if (e.code === 'KeyR') { e.preventDefault(); reviveFlappy(); return; }
          if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); resetFlappy(); state = 'flappy'; }
          return;
        }
        if (e.code === 'Digit1' || e.code === 'Numpad1') { e.preventDefault(); activateFlappyPowerup(1); return; }
        if (e.code === 'Digit2' || e.code === 'Numpad2') { e.preventDefault(); activateFlappyPowerup(2); return; }
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
          e.preventDefault();
          flappyStarted = true;
          flapJump();
        }
        return;
      }
      // From runner start/dead screens, ESC/H goes back to home
      if ((state === 'start' || state === 'dead') && (e.code === 'Escape' || e.code === 'KeyH')) {
        e.preventDefault(); state = 'home'; return;
      }
      // Boss cheat code
      if (state === 'running' || state === 'levelup') {
        const ch = e.key && e.key.length === 1 ? e.key.toLowerCase() : '';
        if (ch >= 'a' && ch <= 'z') {
          cheatBuffer = (cheatBuffer + ch).slice(-4);
          if (cheatBuffer === 'boss') {
            cheatBuffer = '';
            goToBoss();
            return;
          }
        }
      }
      // Open daily spin from start or dead screen
      if ((state === 'start' || state === 'dead') && e.code === 'KeyW') {
        e.preventDefault(); wheelReturnState = state; state = 'wheel'; return;
      }
      // Wheel input
      if (state === 'wheel') {
        e.preventDefault();
        if (e.code === 'Space' || e.code === 'Enter') {
          if (canSpin() && !wheelSpinning) startWheelSpin();
        } else if (e.code === 'KeyW' || e.code === 'Escape') {
          if (!wheelSpinning) state = wheelReturnState;
        }
        return;
      }
      // Open shop from start or dead screen
      if ((state === 'start' || state === 'dead') && e.code === 'KeyS') {
        e.preventDefault(); shopReturnState = state; state = 'shop'; shopSelection = 0; return;
      }
      // Revive from dead screen
      if (state === 'dead' && e.code === 'KeyR') {
        e.preventDefault(); revive(); return;
      }
      // Shop navigation
      if (state === 'shop') {
        e.preventDefault();
        // Cheat: typing a code unlocks a hidden skin. Buffer keeps last 7 chars for the longest code.
        const ch = e.key && e.key.length === 1 ? e.key.toLowerCase() : '';
        if (ch >= 'a' && ch <= 'z') {
          shopCheatBuf = (shopCheatBuf + ch).slice(-7);
          if (shopCheatBuf.endsWith('admin'))   { shopCheatBuf = ''; unlockAdminSkin();   return; }
          if (shopCheatBuf.endsWith('thorren')) { shopCheatBuf = ''; unlockThorrenSkin(); return; }
          // While building a known cheat prefix, swallow keys (so 's' doesn't close the shop mid-code)
          const isMidCheat = shopCheatBuf.length > 0 && (
            'admin'.startsWith(shopCheatBuf) || 'thorren'.startsWith(shopCheatBuf)
          );
          if (isMidCheat) return;
        } else {

    canvas.addEventListener('touchend', e => {

    // Coordinate note:
    //   ob.y = bottom of obstacle, ob.y - ob.h = top.
    //   Player standing: top=GROUND(240), bottom=FLOOR(280).
    //   Player sliding:  top=GROUND+22(262), bottom=FLOOR(280).
    //   Slide-under bottom must be 246–261: hits standing/jumping, misses sliding.

    // Gap bottom — sliding player top + a little breathing room
    const SLIDE_CLEAR = GROUND + 20; // = 260; obstacle bottom must be <= this to let slide through

    // ---- Obstacle shapes ----
    // Weights per level: [short, tall, wide, pair, overhead, lowwall]
    const OBSTACLE_WEIGHTS = [
      [4, 2, 2, 1, 2, 1],   // level 1 — easy intro
      [2, 2, 2, 2, 3, 2],   // level 2 — balanced
      [1, 2, 2, 3, 3, 3],   // level 3 — harder mix
      [0, 1, 2, 3, 3, 4],   // level 4 — mostly hard
      [2, 3, 1, 2, 1, 3],   // level 5 — tall & low walls (tundra)
      [1, 1, 3, 4, 2, 1],   // level 6 — wide & pairs (volcanic)
      [2, 2, 2, 1, 4, 3],   // level 7 — overhead-heavy (ocean)
      [1, 2, 2, 3, 3, 3],   // level 8 — balanced hard (neon city)
    ];

    function weightedPick(weights) {
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++) {
        r -= weights[i];
        if (r <= 0) return i;
      }
      return weights.length - 1;
    }

    function makeObstacle() {
      const w = OBSTACLE_WEIGHTS[Math.min(level - 1, OBSTACLE_WEIGHTS.length - 1)];
      const kind = weightedPick(w);
      const s = Math.min(1 + (level - 1) * 0.10, 1.5); // size scale, capped at 1.5×
      const sw = n => Math.round(n * s);
      if (kind === 0) return { x: W + 20, y: FLOOR,       w: sw(28), h: sw(30), type: 'ground' };
      if (kind === 1) return { x: W + 20, y: FLOOR,       w: sw(20), h: sw(54), type: 'ground' };
      if (kind === 2) return { x: W + 20, y: FLOOR,       w: sw(64), h: sw(24), type: 'ground' };
      if (kind === 3) return { x: W + 20, y: FLOOR,       w: sw(52), h: sw(42), type: 'ground', pair: true };
      if (kind === 4) return { x: W + 20, y: SLIDE_CLEAR, w: sw(72), h: 52,    type: 'overhead' };
               return { x: W + 20, y: SLIDE_CLEAR, w: sw(34), h: SLIDE_CLEAR,  type: 'lowwall' };
    }

    // ---- Coin spawn patterns ----
    // Coin heights:
    //   FLOOR-18 (=262) — ground level, collect while running
    //   GROUND-30 (=210) — low jump
    //   GROUND-80 (=160) — high / double jump
    //   FLOOR-10 (=270) — slide zone, reward for sliding
    function spawnCoinGroup() {
      const kind = Math.floor(Math.random() * 6);
      const sx = W + 20;
      if (kind === 0) {
        // Row of 4 at ground level — run right through
        for (let i = 0; i < 4; i++)
          coins.push({ x: sx + i * 28, y: FLOOR - 18, r: 8, phase: i * 0.4 });
      } else if (kind === 1) {
        // Arc over an imaginary obstacle — must jump
        for (let i = 0; i < 6; i++) {
          const t = i / 5;
          coins.push({ x: sx + i * 28, y: FLOOR - 18 - Math.sin(t * Math.PI) * 100, r: 8, phase: i * 0.3 });
        }
      } else if (kind === 2) {
        // Two rows stacked: ground + mid — jump to grab both
        for (let i = 0; i < 3; i++) {
          coins.push({ x: sx + i * 30, y: FLOOR - 18,  r: 8, phase: i * 0.5 });
          coins.push({ x: sx + i * 30, y: GROUND - 30, r: 8, phase: i * 0.5 + 1 });
        }
      } else if (kind === 3) {
        // Diagonal rising line — jump to follow
        for (let i = 0; i < 5; i++)
          coins.push({ x: sx + i * 30, y: FLOOR - 18 - i * 22, r: 8, phase: i * 0.4 });
      } else if (kind === 4) {
        // Single big-value coin up high — double jump
        coins.push({ x: sx + 10, y: GROUND - 80, r: 11, phase: 0, big: true });
      } else {
        // Coin bag — 10 coins, floats at mid height
        coins.push({ x: sx + 10, y: GROUND - 40, r: 13, phase: 0, bag: true });
      }
    }

    // ---- AABB collision ----
    function collides(a, b) {
      const pad = 6;
      return (
        a.x + pad < b.x + b.w &&
        a.x + a.w - pad > b.x &&
        a.y + pad < b.y + b.h &&
        a.y + a.h - pad > b.y
      );
    }

    // ---- Draw helpers ----
    function roundRect(x, y, w, h, r = 4) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawPlayer() {
      const px = player.x;
      const py = player.y;
      const pw = player.w;
      const ph = player.h;
      const sliding = player.sliding;
      const skin = getSkin();

      ctx.save();
      // Anchor at bottom of player (moves up when jumping)
      ctx.translate(px + pw / 2, py + ph);

      // Ghost: pulsing transparency
      if (skin.ghost) {
        ctx.globalAlpha = 0.5 + Math.sin(frame * 0.08) * 0.2;
      }

      if (sliding) {
        // Sliding: wide flat body
        const sw = pw + 14, sh = SLIDE_H;
        // Shadow
        ctx.fillStyle = skin.ghost ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 2, sw * 0.6, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Royal cape (dragging behind while sliding)
        if (skin.royal) {
          const cw = Math.sin(frame * 0.08) * 3;
          ctx.fillStyle = skin.capeColor;
          ctx.beginPath();
          ctx.moveTo(-sw / 2, -sh + 2);
          ctx.quadraticCurveTo(-sw / 2 - 10, -sh - 2 + cw, -sw / 2 - 16, -sh + 4 + cw);
          ctx.lineTo(-sw / 2 - 12, 0);
          ctx.lineTo(-sw / 2, -2);
          ctx.closePath();
          ctx.fill();
        }

        // Body (flat)
        ctx.fillStyle = skin.body;
        roundRect(-sw / 2, -sh, sw, sh - 4, skin.robot ? 2 : 5);
        ctx.fill();

        // Rainbow: clipped vertical bands on sliding body
        if (skin.rainbow) {
          ctx.save();
          ctx.beginPath();
          roundRect(-sw / 2, -sh, sw, sh - 4, 5);
          ctx.clip();
          const rcolors = ['#ff2244', '#ff8800', '#ffdd00', '#22cc44', '#0088ff', '#5533cc', '#aa00cc'];
          const stripeW = sw / rcolors.length;
          const offset = (frame * 0.6) % stripeW;
          for (let i = -1; i < rcolors.length + 1; i++) {
            const idx = ((i % rcolors.length) + rcolors.length) % rcolors.length;
            ctx.fillStyle = rcolors[idx];
            ctx.fillRect(-sw / 2 + i * stripeW + offset, -sh, stripeW + 1, sh - 4);
          }
          ctx.restore();
        }

        // Dragon: scales on sliding body
        if (skin.dragon) {
          ctx.fillStyle = 'rgba(0, 40, 20, 0.55)';
          for (let xx = -sw / 2 + 4; xx < sw / 2 - 8; xx += 5) {
            ctx.beginPath();
            ctx.arc(xx, -sh + 5, 2.2, Math.PI, 0);
            ctx.fill();
          }
        }

        // Galaxy: stars on sliding body
        if (skin.galaxy) {
          for (let i = 0; i < 5; i++) {
            const sx = -sw / 2 + 4 + i * (sw - 16) / 4;
            const sy = -sh / 2 - 2;
            const tw = 0.4 + Math.abs(Math.sin(frame * 0.08 + i)) * 0.6;
            ctx.globalAlpha = tw;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(sx, sy, 1.2, 0, Math.PI * 2); ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        // Frost: small spikes on sliding body
        if (skin.frost) {
          ctx.fillStyle = '#d0f0ff';
          for (let i = -1; i <= 1; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 10 - 3, -sh);
            ctx.lineTo(i * 10, -sh - 6);
            ctx.lineTo(i * 10 + 3, -sh);
            ctx.closePath();
            ctx.fill();
          }
        }

        // Robot panel line on slide body
        if (skin.robot) {
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-sw / 2 + 4, -sh / 2);
          ctx.lineTo(sw / 2 - 14, -sh / 2);
          ctx.stroke();
        }

        // Visor (side-facing)
        ctx.fillStyle = skin.visorBg;
        roundRect(sw / 2 - 12, -sh + 3, 10, sh - 10, 3);
        ctx.fill();
        ctx.fillStyle = skin.visor;
        if (skin.ninja) {
          roundRect(sw / 2 - 11, -sh + 6, 8, sh - 18, 1);
        } else {
          roundRect(sw / 2 - 11, -sh + 5, 8, sh - 14, 2);
        }
        ctx.fill();

        // Admin: shades over side-visor + flat cap brim + chain on flat body (slide mode)
        if (skin.admin) {
          // Mini pixelated sunglasses on the side visor
          ctx.fillStyle = '#0c0c0c';
          ctx.fillRect(sw / 2 - 11, -sh + 7, 8, 4);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(sw / 2 - 9, -sh + 8, 1, 1);
          ctx.fillRect(sw / 2 - 6, -sh + 8, 1, 1);
          // Tan brim hanging forward in slide
          ctx.fillStyle = '#b8965a';
          ctx.strokeStyle = '#7a5a28';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(sw / 2 - 2, -sh + 2, 9, 2, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          // Green dome (squashed flat in slide)
          ctx.fillStyle = '#6a8a3a';
          ctx.strokeStyle = '#3a5a18';
          ctx.beginPath();
          ctx.ellipse(sw / 2 - 8, -sh + 1, 6, 3, 0, Math.PI, 0);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Gold chain dangling under the flat body
          ctx.fillStyle = '#ffd700';
          ctx.strokeStyle = '#8a6a00';
          ctx.lineWidth = 0.6;
          for (let i = 0; i < 5; i++) {
            const lx = -sw / 2 + 6 + i * 4;
            ctx.beginPath();
            ctx.ellipse(lx, -2, 1.8, 1.2, i % 2 === 0 ? 0.3 : -0.3, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
          }
        }

        // Ninja scarf while sliding
        if (skin.ninja) {
          const w1 = Math.sin(frame * 0.12) * 5;
          const w2 = Math.sin(frame * 0.1 + 2) * 7;
          ctx.strokeStyle = skin.scarfColor;
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-sw / 2 + 2, -sh + 4);
          ctx.quadraticCurveTo(-sw / 2 - 10, -sh + 2 + w1, -sw / 2 - 18, -sh + 6 + w2);
          ctx.stroke();
        }

        // Thorren: lightning aura + hammer trailing behind (slide mode)
        if (skin.thorren) {
          const pulse = 0.55 + Math.sin(frame * 0.13) * 0.35;
          // Electric trail behind body
          ctx.shadowColor = '#80c8ff'; ctx.shadowBlur = 10 * pulse;
          ctx.fillStyle = `rgba(128,200,255,${0.15 * pulse})`;
          roundRect(-sw / 2 - 3, -sh - 2, sw + 6, sh, 5);
          ctx.fill();
          ctx.shadowBlur = 0;
          // Crackles
          for (let i = 0; i < 3; i++) {
            const lx = -sw / 2 - 6 - i * 5;
            const ly = -sh / 2 + Math.sin(frame * 0.2 + i) * 4;
            ctx.strokeStyle = `rgba(200,235,255,${0.6 + Math.sin(frame * 0.3 + i) * 0.3})`;
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.moveTo(lx, ly - 3);
            ctx.lineTo(lx + 2, ly - 1);
            ctx.lineTo(lx - 1, ly + 1);
            ctx.lineTo(lx + 2, ly + 3);
            ctx.stroke();
          }
          // Mini hammer dragging behind the back of the body
          const hammerY = -sh - 2 + Math.sin(frame * 0.1) * 1;
          ctx.save();
          ctx.translate(-sw / 2 - 4, hammerY);
          ctx.rotate(-0.35);
          ctx.fillStyle = '#5a3018';
          ctx.fillRect(-1, -1, 2, 10);
          ctx.fillStyle = '#9aa0a8';
          ctx.strokeStyle = '#3a3e44'; ctx.lineWidth = 1;
          roundRect(-5, -5, 10, 5, 1);
          ctx.fill(); ctx.stroke();
          ctx.restore();
        }
      } else {
        const lean = player.onGround ? Math.sin(player.legPhase * 0.5) * 0.08 : -0.15;
        ctx.rotate(lean);

        // Shadow
        ctx.fillStyle = skin.ghost ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, 2, skin.ghost ? pw * 0.4 : pw * 0.6, skin.ghost ? 3 : 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs (ghost floats - no legs)
        if (!skin.ghost) {
          ctx.strokeStyle = skin.legs;
          ctx.lineWidth = skin.robot ? 6 : 5;
          ctx.lineCap = skin.robot ? 'square' : 'round';
          if (player.onGround) {
            const lp = player.legPhase;
            if (skin.robot) {
              // Segmented robot legs with knee joints
              const lkx = -6 + Math.sin(lp) * 4, rky = -5;
              ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(lkx, rky); ctx.lineTo(-6 + Math.sin(lp) * 8, 0); ctx.stroke();
              const rkx = 6 - Math.sin(lp) * 4;
              ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(rkx, rky); ctx.lineTo(6 - Math.sin(lp) * 8, 0); ctx.stroke();
              // Knee bolts
              ctx.fillStyle = '#bbb';
              ctx.beginPath(); ctx.arc(lkx, rky, 2, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(rkx, rky, 2, 0, Math.PI * 2); ctx.fill();
            } else {
              ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(-6 + Math.sin(lp) * 8, 0); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(6 - Math.sin(lp) * 8, 0); ctx.stroke();
            }
          } else {
            if (skin.robot) {
              ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(-8, -3); ctx.lineTo(-10, 4); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(8, -3); ctx.lineTo(10, 4); ctx.stroke();
              ctx.fillStyle = '#bbb';
              ctx.beginPath(); ctx.arc(-8, -3, 2, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(8, -3, 2, 0, Math.PI * 2); ctx.fill();
            } else {
              ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(-10, 4); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(10, 4); ctx.stroke();

          }
        }

        // Dinosaur: thick tail trailing behind body
        if (skin.dinosaur) {
          const tailWave = Math.sin(frame * 0.14) * 5;
          ctx.fillStyle = skin.body;
          ctx.strokeStyle = '#1a4a1a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 2, -14);
          ctx.quadraticCurveTo(-pw / 2 - 10 + tailWave * 0.4, -6, -pw / 2 - 22 + tailWave, -2 + tailWave * 0.3);
          ctx.lineTo(-pw / 2 - 16 + tailWave, 4 + tailWave * 0.3);
          ctx.quadraticCurveTo(-pw / 2 - 4 + tailWave * 0.2, 0, -pw / 2 + 2, -6);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        }

        // Phoenix: fiery wings (behind body)
        if (skin.phoenix) {
          const flap = Math.sin(frame * 0.22) * 0.4;
          for (let side = -1; side <= 1; side += 2) {
            ctx.save();
            ctx.translate(side * (pw / 2 - 2), -ph + 14);
            ctx.rotate(side * (0.5 - flap));
            // Outer flame
            ctx.fillStyle = '#ff6010';
            ctx.shadowColor = '#ffa040'; ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(side * 22, -10);
            ctx.lineTo(side * 26, 0);
            ctx.lineTo(side * 22, 8);
            ctx.lineTo(side * 14, 12);
            ctx.lineTo(side * 8, 10);
            ctx.closePath(); ctx.fill();
            // Inner flame
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd040';
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.lineTo(side * 14, -4);
            ctx.lineTo(side * 18, 3);
            ctx.lineTo(side * 12, 8);
            ctx.lineTo(side * 6, 7);
            ctx.closePath(); ctx.fill();
            ctx.restore();
          }
        }

        // Dragon wings (behind body)
        if (skin.dragon) {
          const flap = Math.sin(frame * 0.18) * 0.35;
          // Left wing
          ctx.save();
          ctx.translate(-pw / 2 + 2, -ph + 14);
          ctx.rotate(-0.5 + flap);
          ctx.fillStyle = '#8b0a2a';
          ctx.strokeStyle = '#3a0010';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-20, -8);
          ctx.lineTo(-24, 2);
          ctx.lineTo(-18, 4);
          ctx.lineTo(-22, 12);
          ctx.lineTo(-12, 8);
          ctx.lineTo(-6, 14);
          ctx.closePath();
          ctx.fill(); ctx.stroke();

          ctx.strokeStyle = '#5a0418';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-20, -8); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-18, 4); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12, 8); ctx.stroke();
          ctx.restore();
          // Right wing
          ctx.save();
          ctx.translate(pw / 2 - 2, -ph + 14);
          ctx.rotate(0.5 - flap);
          ctx.fillStyle = '#8b0a2a';
          ctx.strokeStyle = '#3a0010';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(20, -8);
          ctx.lineTo(24, 2);
          ctx.lineTo(18, 4);
          ctx.lineTo(22, 12);
          ctx.lineTo(12, 8);
          ctx.lineTo(6, 14);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.strokeStyle = '#5a0418';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(20, -8); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(18, 4); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(12, 8); ctx.stroke();
          ctx.restore();
          // Dragon tail
          const tailWave = Math.sin(frame * 0.12) * 4;
          ctx.fillStyle = skin.body;
          ctx.strokeStyle = '#0a2010';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 4, -10);

          ctx.closePath();
          ctx.fill(); ctx.stroke();

        if (skin.royal) {

            for (let xx = -pw / 2 + 3; xx < pw / 2 - 1; xx += 5) {

        if (skin.dinosaur) {

          ctx.lineWidth = 1;

          const plateXs = [-pw / 2 + 4, -pw / 4, 0, pw / 4, pw / 2 - 4];
          const plateHeights = [5, 7, 8, 7, 5];
          for (let i = 0; i < plateXs.length; i++) {
            const px2 = plateXs[i];
            const peakH = plateHeights[i];
            ctx.beginPath();
            ctx.moveTo(px2 - 4, -ph + 2);
            ctx.lineTo(px2, -ph - peakH);
            ctx.lineTo(px2 + 4, -ph + 2);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
          }
          // Belly (light underside)
          ctx.fillStyle = 'rgba(220, 240, 180, 0.3)';
          roundRect(-pw / 2 + 3, -ph + 24, pw - 8, ph - 38, 4);

        // Alien: cosmic helmet bubble + body glow
        if (skin.alien) {
          // Body glow
          ctx.shadowColor = '#b080ff';
          ctx.shadowBlur = 12 + Math.sin(frame * 0.08) * 4;
          ctx.fillStyle = 'rgba(176,128,255,0.10)';
          roundRect(-pw / 2 - 2, -ph - 2, pw + 4, ph - 8, 8);
          ctx.fill();
          ctx.shadowBlur = 0;
          // Helmet bubble over head area
          ctx.fillStyle = 'rgba(160, 255, 200, 0.18)';
          ctx.strokeStyle = 'rgba(160, 255, 200, 0.6)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, -ph + 12, pw / 2 + 3, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          // Highlight on helmet
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.beginPath();
          ctx.ellipse(-5, -ph + 8, 4, 2, -0.5, 0, Math.PI * 2);
          ctx.fill();

        // Galaxy: twinkling stars on body + cosmic aura
        if (skin.galaxy) {
          ctx.shadowColor = '#a080ff';
          ctx.shadowBlur = 14 + Math.sin(frame * 0.06) * 4;
          ctx.fillStyle = 'rgba(160,128,255,0.10)';
          roundRect(-pw / 2 - 2, -ph - 2, pw + 4, ph - 8, 8);
          ctx.fill();
          ctx.shadowBlur = 0;
          const starPositions = [
            [-6, -ph + 8], [4, -ph + 14], [-2, -ph + 22], [7, -ph + 26],
            [-7, -ph + 30], [2, -ph + 36], [-4, -16], [6, -20],
          ];
          for (let i = 0; i < starPositions.length; i++) {
            const [sx, sy] = starPositions[i];
            const tw = 0.4 + Math.abs(Math.sin(frame * 0.08 + i * 1.3)) * 0.6;
            ctx.globalAlpha = tw;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(sx, sy, 1.2, 0, Math.PI * 2);
            ctx.fill();
            // 4-point twinkle cross
            if (tw > 0.7) {
              ctx.strokeStyle = 'rgba(255,255,255,0.8)';
              ctx.lineWidth = 0.6;
              ctx.beginPath();
              ctx.moveTo(sx - 2.5, sy); ctx.lineTo(sx + 2.5, sy);
              ctx.moveTo(sx, sy - 2.5); ctx.lineTo(sx, sy + 2.5);
              ctx.stroke();
            }
          }
          ctx.globalAlpha = 1;
        }

        // Ghost: ethereal glow around body
        if (skin.ghost) {
          ctx.shadowColor = '#c0d0e8';
          ctx.shadowBlur = 12 + Math.sin(frame * 0.06) * 4;
          ctx.fillStyle = 'rgba(184,198,219,0.15)';
          roundRect(-pw / 2 - 2, -ph - 2, pw + 4, ph - 8, 8);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Robot panel details
        if (skin.robot) {
          ctx.strokeStyle = '#555';
          ctx.lineWidth = 1;
          // Horizontal panel line
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 3, -ph + 22);
          ctx.lineTo(pw / 2 - 3, -ph + 22);
          ctx.stroke();
          // Vertical center seam
          ctx.beginPath();
          ctx.moveTo(0, -ph + 22);
          ctx.lineTo(0, -14);
          ctx.stroke();
          // Corner bolts
          ctx.fillStyle = '#bbb';
          ctx.beginPath(); ctx.arc(-pw / 2 + 5, -ph + 4, 2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(pw / 2 - 5, -ph + 4, 2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(-pw / 2 + 5, -14, 2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(pw / 2 - 5, -14, 2, 0, Math.PI * 2); ctx.fill();
          // Power indicator
          ctx.fillStyle = '#00ff44';
          ctx.beginPath(); ctx.arc(0, -ph + 26, 2, 0, Math.PI * 2); ctx.fill();
        }

        // Frost: ice crystal spikes on shoulders
        if (skin.frost) {
          ctx.fillStyle = '#d0f0ff';
          ctx.strokeStyle = '#a0d4f0';
          ctx.lineWidth = 1;
          // Left shoulder spike cluster
          ctx.beginPath();
          ctx.moveTo(-pw / 2 - 5, -ph + 16);
          ctx.lineTo(-pw / 2, -ph + 2);
          ctx.lineTo(-pw / 2 + 4, -ph + 16);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-pw / 2 - 2, -ph + 16);
          ctx.lineTo(-pw / 2 - 4, -ph + 6);
          ctx.lineTo(-pw / 2 + 1, -ph + 16);
          ctx.closePath();
          ctx.fill();
          // Right shoulder spike cluster
          ctx.beginPath();
          ctx.moveTo(pw / 2 + 5, -ph + 16);
          ctx.lineTo(pw / 2, -ph + 2);
          ctx.lineTo(pw / 2 - 4, -ph + 16);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(pw / 2 + 2, -ph + 16);
          ctx.lineTo(pw / 2 + 4, -ph + 6);
          ctx.lineTo(pw / 2 - 1, -ph + 16);
          ctx.closePath();
          ctx.fill();
          // Frost glow
          ctx.shadowColor = '#80d0ff';
          ctx.shadowBlur = 8;
          ctx.fillStyle = 'rgba(176,224,255,0.08)';
          roundRect(-pw / 2 - 2, -ph - 2, pw + 4, ph - 8, 8);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Visor
        ctx.fillStyle = skin.visorBg;
        if (skin.ninja) {
          // Narrow slit visor
          roundRect(-pw / 2 + 4, -ph + 9, pw - 8, 6, 2);
          ctx.fill();
          ctx.fillStyle = skin.visor;
          roundRect(-pw / 2 + 6, -ph + 10, pw - 12, 4, 1);
          ctx.fill();
        } else {
          roundRect(-pw / 2 + 4, -ph + 6, pw - 8, 14, 4);
          ctx.fill();
          ctx.fillStyle = skin.visor;
          roundRect(-pw / 2 + 6, -ph + 8, pw - 12, 10, 3);
          ctx.fill();
        }

        // Robot: antenna with blinking light
        if (skin.robot) {
          ctx.strokeStyle = '#777';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, -ph);
          ctx.lineTo(2, -ph - 7);
          ctx.stroke();
          // Blinking light
          const blink = frame % 40 < 20;
          ctx.fillStyle = blink ? '#ff2020' : '#881010';
          ctx.shadowColor = blink ? '#ff2020' : 'transparent';
          ctx.shadowBlur = blink ? 6 : 0;
          ctx.beginPath();
          ctx.arc(2, -ph - 8, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Dinosaur: toothy grin under the visor
        if (skin.dinosaur) {
          ctx.fillStyle = '#1a3a1a';
          roundRect(-pw / 2 + 5, -ph + 21, pw - 10, 5, 1);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          const toothCount = 5;
          const tw = (pw - 12) / toothCount;
          for (let i = 0; i < toothCount; i++) {
            const tx = -pw / 2 + 6 + i * tw + tw / 2;
            ctx.beginPath();
            ctx.moveTo(tx - tw * 0.35, -ph + 21);
            ctx.lineTo(tx, -ph + 26);
            ctx.lineTo(tx + tw * 0.35, -ph + 21);
            ctx.closePath();
            ctx.fill();
          }
          // Yellow snake-eye visor accent (over standard visor)
          ctx.fillStyle = '#1a1a1a';
          ctx.beginPath();
          ctx.ellipse(-3, -ph + 13, 1.5, 3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(5, -ph + 13, 1.5, 3, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Phoenix: flaming feather crest on head
        if (skin.phoenix) {
          const flick = Math.sin(frame * 0.15) * 2;
          ctx.fillStyle = '#ff8020';
          ctx.shadowColor = '#ff6010'; ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.moveTo(-6, -ph + 2);
          ctx.lineTo(-4 + flick, -ph - 6);
          ctx.lineTo(0, -ph - 2);
          ctx.lineTo(4 - flick, -ph - 8);
          ctx.lineTo(6, -ph + 2);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#ffe080';
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.moveTo(-3, -ph);
          ctx.lineTo(0, -ph - 4 + flick * 0.5);
          ctx.lineTo(3, -ph);
          ctx.closePath();
          ctx.fill();
        }

        // Alien: two wobbly antennae with glowing bulbs
        if (skin.alien) {
          const wob1 = Math.sin(frame * 0.1) * 1.5;
          const wob2 = Math.sin(frame * 0.13 + 1) * 1.5;

          ctx.lineWidth = 1.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-5, -ph + 4);
          ctx.quadraticCurveTo(-7 + wob1, -ph - 4, -8 + wob1, -ph - 9);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(5, -ph + 4);
          ctx.quadraticCurveTo(7 + wob2, -ph - 4, 8 + wob2, -ph - 9);
          ctx.stroke();
          // Bulbs
          ctx.fillStyle = '#a0ffcc';
          ctx.shadowColor = '#a0ffcc'; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.arc(-8 + wob1, -ph - 10, 2.2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(8 + wob2, -ph - 10, 2.2, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Dragon: horns on head
        if (skin.dragon) {
          ctx.fillStyle = '#3a1a08';
          ctx.strokeStyle = '#1a0a02';
          ctx.lineWidth = 1;
          // Left horn (curved back)
          ctx.beginPath();
          ctx.moveTo(-7, -ph + 2);
          ctx.quadraticCurveTo(-11, -ph - 4, -9, -ph - 10);
          ctx.lineTo(-3, -ph - 1);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Right horn
          ctx.beginPath();
          ctx.moveTo(7, -ph + 2);
          ctx.quadraticCurveTo(11, -ph - 4, 9, -ph - 10);
          ctx.lineTo(3, -ph - 1);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Horn highlights
          ctx.fillStyle = 'rgba(255,200,120,0.4)';
          ctx.beginPath(); ctx.arc(-9, -ph - 4, 1, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(9, -ph - 4, 1, 0, Math.PI * 2); ctx.fill();
        }

        // Galaxy: orbiting moons/planets
        if (skin.galaxy) {
          const orbA = frame * 0.04;
          for (let i = 0; i < 2; i++) {
            const a = orbA + i * Math.PI;
            const ox = Math.cos(a) * 14;
            const oy = -ph + 4 + Math.sin(a) * 4;
            ctx.fillStyle = i === 0 ? '#ffd080' : '#a0c0ff';
            ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 5;
            ctx.beginPath(); ctx.arc(ox, oy, 1.6, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

        // Royal: crown
        if (skin.royal) {
          ctx.fillStyle = skin.crownColor;
          ctx.beginPath();
          ctx.moveTo(-9, -ph + 1);
          ctx.lineTo(-11, -ph - 7);
          ctx.lineTo(-5, -ph - 4);
          ctx.lineTo(0, -ph - 10);
          ctx.lineTo(5, -ph - 4);
          ctx.lineTo(11, -ph - 7);
          ctx.lineTo(9, -ph + 1);
          ctx.closePath();
          ctx.fill();
          // Crown base band
          ctx.fillStyle = '#daa520';
          roundRect(-9, -ph, 18, 3, 1);
          ctx.fill();
          // Crown gems
          ctx.fillStyle = '#ff3366';
          ctx.beginPath(); ctx.arc(0, -ph - 5, 2, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#3366ff';
          ctx.beginPath(); ctx.arc(-6, -ph - 3, 1.5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(6, -ph - 3, 1.5, 0, Math.PI * 2); ctx.fill();
        }

        // Admin: gold chain + baseball cap + pixelated shades
        if (skin.admin) {
          // Gold chain across the chest — series of overlapping links forming a U
          ctx.save();
          const chainY = -14;
          const linkCount = 9;
          const chainSpan = pw - 4;
          for (let i = 0; i < linkCount; i++) {
            const t = i / (linkCount - 1);
            const lx = -chainSpan / 2 + t * chainSpan;
            // Slight sag toward the middle
            const sag = Math.sin(t * Math.PI) * 4;
            const ly = chainY + sag;
            ctx.fillStyle = i % 2 === 0 ? '#ffd700' : '#f5b800';
            ctx.strokeStyle = '#8a6a00';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.ellipse(lx, ly, 2.4, 1.6, i % 2 === 0 ? 0.4 : -0.4, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
          }
          // Chain highlight glints
          ctx.fillStyle = 'rgba(255,255,200,0.7)';
          ctx.beginPath(); ctx.arc(-3, chainY + 3.5, 0.9, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(4, chainY + 3.5, 0.9, 0, Math.PI * 2); ctx.fill();
          ctx.restore();

          // Baseball cap — green dome + tan brim sticking forward
          ctx.save();
          // Dome
          ctx.fillStyle = '#6a8a3a';
          ctx.strokeStyle = '#3a5a18';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(1, -ph + 1, pw / 2 + 1, 8, 0, Math.PI, 0);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Dome shading
          ctx.fillStyle = 'rgba(255,255,255,0.10)';
          ctx.beginPath();
          ctx.ellipse(-2, -ph - 2, pw / 2 - 2, 4, 0, Math.PI, 0);
          ctx.fill();
          // Brim — flat tan ellipse extending forward (rightward, since player faces right)
          ctx.fillStyle = '#b8965a';
          ctx.strokeStyle = '#7a5a28';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(8, -ph + 3, 14, 3, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          // Brim shading
          ctx.fillStyle = 'rgba(0,0,0,0.18)';
          ctx.beginPath();
          ctx.ellipse(10, -ph + 4, 10, 1.5, 0, 0, Math.PI);
          ctx.fill();
          ctx.restore();

          // Pixelated "deal with it" sunglasses — overlap the visor area
          ctx.save();
          const px2 = 2; // pixel size
          // Lens block layout (each cell is 2x2 px) — a chunky 8-bit pair of shades
          // Pattern: 0=transparent, 1=black, 2=white highlight
          const shadePattern = [
            '011111110011111110',
            '111111111111111111',
            '111121111111111121',
            '111211111111112111',
            '111111111111111111',
            '011111100011111100',
          ];
          const startX = -pw / 2 + 2;
          const startY = -ph + 10;
          for (let r = 0; r < shadePattern.length; r++) {
            for (let c = 0; c < shadePattern[r].length; c++) {
              const v = shadePattern[r][c];
              if (v === '0') continue;
              ctx.fillStyle = v === '2' ? '#ffffff' : '#0c0c0c';
              ctx.fillRect(startX + c * px2 * 0.78, startY + r * px2, px2, px2);
            }
          }
          // Side temple (arm of glasses) toward the back of head
          ctx.fillStyle = '#0c0c0c';
          ctx.fillRect(startX - 2, startY + 4, 3, 2);
          ctx.restore();
        }

        // Thorren: electric aura + jagged crown + floating hammer
        if (skin.thorren) {
          const pulse = 0.55 + Math.sin(frame * 0.13) * 0.35;

          // Electric aura behind body — soft cyan glow with crackling lightning
          ctx.save();
          ctx.shadowColor = '#80c8ff'; ctx.shadowBlur = 16 * pulse;
          ctx.fillStyle = `rgba(128,200,255,${0.12 * pulse})`;
          roundRect(-pw / 2 - 3, -ph - 3, pw + 6, ph - 4, 9);
          ctx.fill();
          ctx.shadowBlur = 0;
          // Lightning crackles around the silhouette
          for (let i = 0; i < 4; i++) {
            const ang = frame * 0.10 + i * (Math.PI / 2);
            const orbitR = 18 + Math.sin(frame * 0.18 + i) * 3;
            const lx = Math.cos(ang) * orbitR;
            const ly = -ph / 2 + Math.sin(ang) * orbitR * 0.7;
            ctx.strokeStyle = `rgba(200,235,255,${0.55 + Math.sin(frame * 0.25 + i) * 0.35})`;
            ctx.lineWidth = 1.4;
            ctx.shadowColor = '#a0d8ff'; ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.moveTo(lx, ly - 5);
            ctx.lineTo(lx + 2.5, ly - 1);
            ctx.lineTo(lx - 1.5, ly + 1);
            ctx.lineTo(lx + 2, ly + 5);
            ctx.stroke();
            ctx.shadowBlur = 0;
          }
          ctx.restore();

          // Jagged horned crown on the head
          ctx.fillStyle = '#c89a30';
          ctx.strokeStyle = '#6a4818';
          ctx.lineWidth = 1;
          // Center peak (forked lightning shape)
          ctx.beginPath();
          ctx.moveTo(-3, -ph + 2);
          ctx.lineTo(-4, -ph - 4);
          ctx.lineTo(-1, -ph - 4);
          ctx.lineTo(-2, -ph - 11);
          ctx.lineTo(2, -ph - 7);
          ctx.lineTo(0, -ph - 4);
          ctx.lineTo(3, -ph - 4);
          ctx.lineTo(4, -ph + 2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Left horn (curved outward)
          ctx.beginPath();
          ctx.moveTo(-10, -ph + 1);
          ctx.lineTo(-15, -ph - 9);
          ctx.lineTo(-8, -ph - 2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Right horn
          ctx.beginPath();
          ctx.moveTo(10, -ph + 1);
          ctx.lineTo(15, -ph - 9);
          ctx.lineTo(8, -ph - 2);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          // Crown gem
          ctx.fillStyle = '#80e8ff';
          ctx.shadowColor = '#80e8ff'; ctx.shadowBlur = 6;
          ctx.beginPath(); ctx.arc(0, -ph - 4, 1.6, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;

          // Floating hammer above the head — hidden during the swing so it looks like the same hammer
          if (thorrenHammerSwingTimer <= 0) {
            const hammerY = -ph - 18 + Math.sin(frame * 0.09) * 2;
            const hammerR = Math.sin(frame * 0.06) * 0.18;
            ctx.save();
            ctx.translate(2, hammerY);
            ctx.rotate(hammerR);
            // Handle
            ctx.fillStyle = '#5a3018';
            ctx.strokeStyle = '#2a1808'; ctx.lineWidth = 1;
            ctx.fillRect(-1.2, -2, 2.4, 13);
            ctx.strokeRect(-1.2, -2, 2.4, 13);
            // Pommel
            ctx.fillStyle = '#c89a30';
            ctx.beginPath(); ctx.arc(0, 11, 1.6, 0, Math.PI * 2); ctx.fill();
            // Head
            ctx.fillStyle = '#9aa0a8';
            ctx.strokeStyle = '#3a3e44'; ctx.lineWidth = 1;
            roundRect(-7, -6, 14, 7, 1.5);
            ctx.fill(); ctx.stroke();
            // Highlight strip
            ctx.fillStyle = '#cdd2d8';
            ctx.fillRect(-6, -5, 12, 1.2);
            // Electric arcs zapping from head
            ctx.strokeStyle = `rgba(180,235,255,${0.55 + Math.sin(frame * 0.32) * 0.4})`;
            ctx.lineWidth = 1.3;
            ctx.shadowColor = '#80c8ff'; ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.moveTo(-6, -3); ctx.lineTo(-3, -1); ctx.lineTo(-7, 2); ctx.lineTo(-2, 4);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(6, -4); ctx.lineTo(3, -1); ctx.lineTo(7, 2); ctx.lineTo(3, 5);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();
          }

          // Trailing energy tassels at the body's bottom edge (the "skirt" in the sketch)
          for (let i = 0; i < 5; i++) {
            const tx = -pw / 2 + 4 + i * ((pw - 8) / 4);
            const wob = Math.sin(frame * 0.12 + i * 0.7) * 2;
            ctx.strokeStyle = `rgba(160,220,255,${0.5 + Math.sin(frame * 0.18 + i) * 0.3})`;
            ctx.lineWidth = 1.6;
            ctx.lineCap = 'round';
            ctx.shadowColor = '#80c8ff'; ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(tx, -14);
            ctx.quadraticCurveTo(tx + wob, -8, tx + wob * 0.5, -2);
            ctx.stroke();
            ctx.shadowBlur = 0;
          }
        }

        // Ninja: trailing scarf ribbons
        if (skin.ninja) {
          const w1 = Math.sin(frame * 0.12 + 1) * 5;
          const w2 = Math.sin(frame * 0.1 + 2.5) * 7;
          const w3 = Math.sin(frame * 0.09 + 4) * 4;
          ctx.strokeStyle = skin.scarfColor;
          ctx.lineWidth = 3.5;
          ctx.lineCap = 'round';
          // Upper ribbon
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 1, -ph + 10);
          ctx.quadraticCurveTo(-pw / 2 - 10, -ph + 12 + w1, -pw / 2 - 18 + w3, -ph + 15 + w2);
          ctx.stroke();
          // Lower ribbon
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-pw / 2 + 1, -ph + 13);
          ctx.quadraticCurveTo(-pw / 2 - 8, -ph + 18 + w2 * 0.6, -pw / 2 - 15 + w1, -ph + 22 + w3);
          ctx.stroke();
        }
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawPlatform(p) {
      // Shadow on ground beneath the platform
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, FLOOR - 1, p.w * 0.45, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Main body
      ctx.fillStyle = '#2e8b3e';
      roundRect(p.x, p.y, p.w, p.h, 4);
      ctx.fill();

      // Brighter top edge (grass strip)
      ctx.fillStyle = '#5bd667';
      roundRect(p.x, p.y, p.w, 4, 4);
      ctx.fill();

      // Darker bottom shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(p.x + 2, p.y + p.h - 3, p.w - 4, 3);

      // Outline
      ctx.strokeStyle = '#1a5a25';
      ctx.lineWidth = 1.5;
      roundRect(p.x, p.y, p.w, p.h, 4);
      ctx.stroke();

      // Soft green glow
      ctx.shadowColor = '#40c060';
      ctx.shadowBlur = 6;
      ctx.fillStyle = 'rgba(91,214,103,0.0)';
      ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawObstacle(ob) {
      const top = ob.y - ob.h;
      const bot = ob.y;

      if (ob.type === 'ground') {
        if (ob.pair) {
          // Two spikes side by side
          const sw = 20, gap = 12;
          ctx.fillStyle = COL.obstacle;
          roundRect(ob.x,          FLOOR - 42, sw, 42, 3); ctx.fill();
          roundRect(ob.x + sw + gap, FLOOR - 32, sw, 32, 3); ctx.fill();
          ctx.shadowColor = COL.obstacle; ctx.shadowBlur = 8;
          ctx.fillStyle = 'rgba(245,166,35,0.35)';
          roundRect(ob.x,          FLOOR - 42, sw, 42, 3); ctx.fill();
          roundRect(ob.x + sw + gap, FLOOR - 32, sw, 32, 3); ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = COL.obstacle;
          roundRect(ob.x, top, ob.w, ob.h, 3); ctx.fill();
          ctx.shadowColor = COL.obstacle; ctx.shadowBlur = 8;
          ctx.fillStyle = 'rgba(245,166,35,0.4)';
          roundRect(ob.x, top, ob.w, ob.h, 3); ctx.fill();
          ctx.shadowBlur = 0;
        }

      } else if (ob.type === 'overhead') {
        // Hanging beam — slide under or jump over (if reaction is fast enough)
        const beamH = 14;
        ctx.fillStyle = '#c0392b';
        roundRect(ob.x, bot - beamH, ob.w, beamH, 3); ctx.fill();
        // Support rods
        ctx.fillStyle = '#7f1d1d';
        roundRect(ob.x + ob.w * 0.15, top, ob.w * 0.1, ob.h - beamH, 2); ctx.fill();
        roundRect(ob.x + ob.w * 0.75, top, ob.w * 0.1, ob.h - beamH, 2); ctx.fill();
        // Glow
        ctx.shadowColor = '#e74c3c'; ctx.shadowBlur = 10;
        ctx.fillStyle = 'rgba(231,76,60,0.35)';
        roundRect(ob.x, bot - beamH, ob.w, beamH, 3); ctx.fill();
        ctx.shadowBlur = 0;

      } else if (ob.type === 'mine') {
        // Spiky metal landmine on the ground
        const cx = ob.x + ob.w / 2, cy = bot - ob.h / 2;
        const rr = ob.h / 2;
        // Spikes
        ctx.fillStyle = '#444';
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
          ctx.lineTo(cx + Math.cos(a) * (rr + 6), cy + Math.sin(a) * (rr + 6));
          ctx.lineTo(cx + Math.cos(a + 0.2) * rr, cy + Math.sin(a + 0.2) * rr);
          ctx.closePath();
          ctx.fill();
        }
        // Body
        ctx.fillStyle = '#2a2a2a';
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
        // Blinking red light
        const blink = (frame % 24) < 12;
        ctx.fillStyle = blink ? '#ff2020' : '#661010';
        ctx.shadowColor = blink ? '#ff2020' : 'transparent';
        ctx.shadowBlur = blink ? 8 : 0;
        ctx.beginPath(); ctx.arc(cx, cy - 1, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;

      } else if (ob.type === 'crystal') {
        // Purple/cyan crystal cluster — sharp angular shards
        ctx.shadowColor = '#a040ff'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#9a30e0';
        ctx.strokeStyle = '#4a0080';
        ctx.lineWidth = 1.5;
        // Main shard
        ctx.beginPath();
        ctx.moveTo(ob.x + ob.w / 2, top);
        ctx.lineTo(ob.x + ob.w * 0.85, top + ob.h * 0.4);
        ctx.lineTo(ob.x + ob.w * 0.7, bot);
        ctx.lineTo(ob.x + ob.w * 0.3, bot);
        ctx.lineTo(ob.x + ob.w * 0.15, top + ob.h * 0.4);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        // Side shards
        ctx.fillStyle = '#c060ff';
        ctx.beginPath();
        ctx.moveTo(ob.x + ob.w * 0.15, top + ob.h * 0.4);
        ctx.lineTo(ob.x, top + ob.h * 0.7);
        ctx.lineTo(ob.x + ob.w * 0.2, bot);
        ctx.lineTo(ob.x + ob.w * 0.3, bot);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.moveTo(ob.x + ob.w * 0.5, top + 3);
        ctx.lineTo(ob.x + ob.w * 0.6, top + ob.h * 0.3);
        ctx.lineTo(ob.x + ob.w * 0.45, top + ob.h * 0.6);
        ctx.closePath();
        ctx.fill();

      } else if (ob.type === 'floater') {
        // Floating red/orange energy block in mid-air (must duck or jump-over)
        const cx = ob.x + ob.w / 2;
        const fy = top + Math.sin(frame * 0.08 + ob.x * 0.01) * 3;
        // Glow halo
        ctx.shadowColor = '#ff4040'; ctx.shadowBlur = 14;
        ctx.fillStyle = '#cc2020';
        roundRect(ob.x, fy, ob.w, ob.h, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
        // Inner pattern
        ctx.fillStyle = '#ff5050';
        roundRect(ob.x + 3, fy + 3, ob.w - 6, ob.h - 6, 3);
        ctx.fill();
        // Pulsing core
        const pulse = 0.5 + Math.sin(frame * 0.15) * 0.5;
        ctx.fillStyle = 'rgba(255,220,180,' + (0.4 + pulse * 0.5) + ')';
        ctx.beginPath();
        ctx.arc(cx, fy + ob.h / 2, ob.h * 0.3, 0, Math.PI * 2);
        ctx.fill();
        // Outline
        ctx.strokeStyle = '#660808'; ctx.lineWidth = 1.5;
        roundRect(ob.x, fy, ob.w, ob.h, 4);
        ctx.stroke();
        // Update hitbox bobbing so collision matches visual
        ob._renderOffset = fy - top;

      } else if (ob.type === 'electric') {
        // Vertical electric barrier — thin, full-height, with crackling bolts
        ctx.fillStyle = '#1a1a3a';
        roundRect(ob.x, top, ob.w, ob.h, 2);
        ctx.fill();
        // Crackling lightning down the middle
        ctx.strokeStyle = '#ffff60';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#ffff60'; ctx.shadowBlur = 10;
        ctx.beginPath();
        const cx = ob.x + ob.w / 2;
        ctx.moveTo(cx, top);
        for (let yy = top + 6; yy < bot; yy += 8) {
          const off = (Math.sin(frame * 0.4 + yy * 0.3) + Math.sin(frame * 0.7 + yy)) * 3;
          ctx.lineTo(cx + off, yy);
        }
        ctx.lineTo(cx, bot);
        ctx.stroke();
        ctx.shadowBlur = 0;
        // Arc spark dots
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 3; i++) {
          const sy = top + (frame * 4 + i * 30) % ob.h;
          ctx.beginPath(); ctx.arc(cx + Math.sin(frame * 0.5 + i) * 4, sy, 1.5, 0, Math.PI * 2); ctx.fill();
        }
        // Edge glow
        ctx.shadowColor = '#ffff60'; ctx.shadowBlur = 8;
        ctx.fillStyle = 'rgba(255,255,96,0.25)';
        roundRect(ob.x, top, ob.w, ob.h, 2);
        ctx.fill();
        ctx.shadowBlur = 0;

      } else if (ob.type === 'lowwall') {
        // Solid wall from canvas top down to bot — MUST SLIDE, jumping goes INTO it
        // Wall body
        ctx.fillStyle = '#1a0a2e';
        roundRect(ob.x, 0, ob.w, bot, 3); ctx.fill();
        // Hazard stripes
        ctx.save();
        ctx.beginPath();
        roundRect(ob.x, 0, ob.w, bot, 3);
        ctx.clip();
        ctx.strokeStyle = '#9b1a2e';
        ctx.lineWidth = 7;
        for (let sy = -bot; sy < bot * 2; sy += 18) {
          ctx.beginPath();
          ctx.moveTo(ob.x, sy);
          ctx.lineTo(ob.x + ob.w, sy + ob.w);
          ctx.stroke();
        }
        ctx.restore();
        // Bright danger edge on the bottom (where gap starts)
        ctx.fillStyle = '#e94560';
        ctx.fillRect(ob.x, bot - 4, ob.w, 4);
        // Slide gap highlight — arrow pointing into gap
        ctx.fillStyle = 'rgba(168,218,220,0.5)';
        ctx.beginPath();
        ctx.moveTo(ob.x + ob.w + 8, bot - 10);
        ctx.lineTo(ob.x + ob.w + 8, FLOOR);
        ctx.lineTo(ob.x + ob.w + 18, (bot + FLOOR) / 2);
        ctx.closePath();
        ctx.fill();
        // Glow
        ctx.shadowColor = '#e94560'; ctx.shadowBlur = 12;
        ctx.fillStyle = 'rgba(233,69,96,0.2)';
        roundRect(ob.x, 0, ob.w, bot, 3); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function drawCoin(c) {
      const bob = Math.sin(frame * 0.07 + c.phase) * 3;
      const cy = c.y + bob;
      const r = c.r;
      const pulse = 0.7 + Math.sin(frame * 0.1 + c.phase) * 0.3;

      if (c.bag) {
        // Coin bag — purple sack shape
        ctx.shadowColor = '#a78bfa';
        ctx.shadowBlur = 16 * pulse;

        // Sack body
        ctx.fillStyle = '#7c3aed';
        ctx.beginPath();
        ctx.ellipse(c.x, cy + r * 0.15, r, r * 0.9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Sack highlight
        ctx.fillStyle = '#a78bfa';
        ctx.beginPath();
        ctx.ellipse(c.x - r * 0.2, cy - r * 0.1, r * 0.35, r * 0.45, -0.4, 0, Math.PI * 2);
        ctx.fill();

        // Tie at top
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        ctx.ellipse(c.x, cy - r * 0.8, r * 0.28, r * 0.18, 0, 0, Math.PI * 2);
        ctx.fill();

        // "x10" label
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.round(r * 0.75)}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('×10', c.x, cy + r * 0.2);
        ctx.textBaseline = 'alphabetic';

        ctx.shadowBlur = 0;
        return;
      }

      // Regular / big coin
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 14 * pulse;
      ctx.fillStyle = c.big ? '#ffcc00' : '#ffe066';
      ctx.beginPath(); ctx.arc(c.x, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;

      // Inner highlight
      ctx.fillStyle = '#fff9c4';
      ctx.beginPath(); ctx.arc(c.x - r * 0.25, cy - r * 0.25, r * 0.45, 0, Math.PI * 2); ctx.fill();

      // Rim
      ctx.strokeStyle = '#e6ac00';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(c.x, cy, r, 0, Math.PI * 2); ctx.stroke();

      // "×5" label on big coin / rotating spokes
      if (c.big) {
        ctx.strokeStyle = '#c8860a';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        const a = frame * 0.04 + c.phase;
        for (let i = 0; i < 4; i++) {
          const ang = a + i * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(c.x + Math.cos(ang) * r * 0.3, cy + Math.sin(ang) * r * 0.3);
          ctx.lineTo(c.x + Math.cos(ang) * r * 0.85, cy + Math.sin(ang) * r * 0.85);
          ctx.stroke();
        }
        ctx.fillStyle = '#7a4f00';
        ctx.font = `bold ${Math.round(r * 0.7)}px Courier New`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('×5', c.x, cy);
        ctx.textBaseline = 'alphabetic';
      }
    }

    function drawDiamond(d) {
      const bob = Math.sin(frame * 0.05 + d.phase) * 4;
      const cy = d.y + bob;
      const r = d.r;
      const pulse = 0.7 + Math.sin(frame * 0.08 + d.phase) * 0.3;
      const rot = Math.sin(frame * 0.03 + d.phase) * 0.12; // gentle wobble

      ctx.save();
      ctx.translate(d.x, cy);
      ctx.rotate(rot);

      // Glow
      ctx.shadowColor = '#40c9a2';
      ctx.shadowBlur = 20 * pulse;

      // Diamond shape (kite/rhombus — taller than wide)
      const hw = r * 0.7;  // half-width
      const ht = r * 1.3;  // half-height top
      const hb = r * 0.9;  // half-height bottom

      // Main body
      ctx.beginPath();
      ctx.moveTo(0, -ht);       // top point
      ctx.lineTo(hw, 0);        // right point
      ctx.lineTo(0, hb);        // bottom point
      ctx.lineTo(-hw, 0);       // left point
      ctx.closePath();
      ctx.fillStyle = '#3ab8a0';
      ctx.fill();

      // Upper-left facet (lighter)
      ctx.beginPath();
      ctx.moveTo(0, -ht);
      ctx.lineTo(-hw, 0);
      ctx.lineTo(0, -ht * 0.15);
      ctx.closePath();
      ctx.fillStyle = '#6edbc4';
      ctx.fill();

      // Upper-right facet (medium)
      ctx.beginPath();
      ctx.moveTo(0, -ht);
      ctx.lineTo(hw, 0);
      ctx.lineTo(0, -ht * 0.15);
      ctx.closePath();
      ctx.fillStyle = '#4ecdc4';
      ctx.fill();

      // Lower-right facet (darker)
      ctx.beginPath();
      ctx.moveTo(hw, 0);
      ctx.lineTo(0, hb);
      ctx.lineTo(0, -ht * 0.15);
      ctx.closePath();
      ctx.fillStyle = '#2a9080';
      ctx.fill();

      // Lower-left facet (dark)
      ctx.beginPath();
      ctx.moveTo(-hw, 0);
      ctx.lineTo(0, hb);
      ctx.lineTo(0, -ht * 0.15);
      ctx.closePath();
      ctx.fillStyle = '#318f7e';
      ctx.fill();

      // Outline
      ctx.beginPath();
      ctx.moveTo(0, -ht);
      ctx.lineTo(hw, 0);
      ctx.lineTo(0, hb);
      ctx.lineTo(-hw, 0);
      ctx.closePath();
      ctx.strokeStyle = '#5ee8cc';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Center facet line (horizontal)
      ctx.beginPath();
      ctx.moveTo(-hw, 0);
      ctx.lineTo(hw, 0);
      ctx.strokeStyle = 'rgba(94,232,204,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Center vertical facet line
      ctx.beginPath();
      ctx.moveTo(0, -ht);
      ctx.lineTo(0, hb);
      ctx.stroke();

      // Sparkle highlight
      const sparkle = 0.5 + Math.sin(frame * 0.15 + d.phase) * 0.5;
      ctx.fillStyle = `rgba(255,255,255,${sparkle * 0.6})`;
      ctx.beginPath();
      ctx.arc(-hw * 0.3, -ht * 0.4, r * 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.restore();
    }

    function drawDiamondBag(b) {
      const bob = Math.sin(frame * 0.05 + b.phase) * 4;
      const cx = b.x, cy = b.y + bob;
      const r = b.r;
      const pulse = 0.7 + Math.sin(frame * 0.08 + b.phase) * 0.3;

      ctx.save();

      // Ground shadow
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(cx, GROUND - 2, r * 0.9, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Sack body
      ctx.shadowColor = '#7ee8fa';
      ctx.shadowBlur = 14 * pulse;
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.4, cy - r * 0.7);
      ctx.quadraticCurveTo(cx - r * 1.15, cy - r * 0.15, cx - r * 0.95, cy + r * 0.65);
      ctx.quadraticCurveTo(cx, cy + r * 1.1, cx + r * 0.95, cy + r * 0.65);
      ctx.quadraticCurveTo(cx + r * 1.15, cy - r * 0.15, cx + r * 0.4, cy - r * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // Right-side shading
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath();
      ctx.moveTo(cx + r * 0.4, cy - r * 0.7);
      ctx.quadraticCurveTo(cx + r * 1.15, cy - r * 0.15, cx + r * 0.95, cy + r * 0.65);
      ctx.quadraticCurveTo(cx + r * 0.55, cy + r * 0.95, cx + r * 0.2, cy + r * 0.95);
      ctx.lineTo(cx + r * 0.2, cy - r * 0.7);
      ctx.closePath();
      ctx.fill();

      // Rope tie
      ctx.strokeStyle = '#4a2e12'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.45, cy - r * 0.6);
      ctx.lineTo(cx + r * 0.45, cy - r * 0.6);
      ctx.stroke();

      // Diamonds spilling out of the top
      const gems = [
        { dx: -r * 0.45, dy: -r * 1.0, s: r * 0.22 },
        { dx:  0,         dy: -r * 1.25, s: r * 0.28 },
        { dx:  r * 0.45,  dy: -r * 1.0, s: r * 0.22 },
        { dx: -r * 0.15,  dy: -r * 0.85, s: r * 0.18 },
        { dx:  r * 0.25,  dy: -r * 0.8,  s: r * 0.18 },
      ];
      for (const g of gems) {
        const gx = cx + g.dx, gy = cy + g.dy;
        ctx.fillStyle = '#7ee8fa';
        ctx.shadowColor = '#7ee8fa'; ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(gx, gy - g.s);
        ctx.lineTo(gx + g.s * 0.7, gy);
        ctx.lineTo(gx, gy + g.s);
        ctx.lineTo(gx - g.s * 0.7, gy);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath();
        ctx.moveTo(gx, gy - g.s);
        ctx.lineTo(gx + g.s * 0.35, gy - g.s * 0.3);
        ctx.lineTo(gx, gy - g.s * 0.1);
        ctx.lineTo(gx - g.s * 0.35, gy - g.s * 0.3);
        ctx.closePath(); ctx.fill();
      }

      // Sparkles
      for (let i = 0; i < 4; i++) {
        const a = (frame * 0.05) + (i / 4) * Math.PI * 2 + b.phase;
        const rr = r * 1.3 + Math.sin(frame * 0.07 + i) * 2;
        const sx = cx + Math.cos(a) * rr;
        const sy = cy + Math.sin(a) * rr * 0.6;
        const sp = 0.3 + Math.sin(frame * 0.09 + i * 1.3) * 0.5;
        ctx.globalAlpha = Math.max(0, sp);
        ctx.fillStyle = '#7ee8fa';
        ctx.shadowColor = '#7ee8fa'; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      ctx.restore();
    }
